<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lameyer - Firma Tecnológica</title>
    <meta name="description" content="Lameyer: soluciones web y manejo de datos. Conecta tus flujos de trabajo con lógica Serverless: Modular Core + Serverless Edge (MC-SE).">
    <link rel="canonical" href="https://lameyer.net/">

    <script>
        // Old hash links (lameyer.net/#/development, ...) now live in real folders
        (function () {
            var legacy = {
                '#/development': '/pages/development/',
                '#/components': '/pages/components/',
                '#/community': '/pages/community/',
                '#/stack': '/pages/stack/',
                '#/blog': '/blog/'
            };
            var target = legacy[window.location.hash.replace(/\/$/, '')];
            if (target) window.location.replace(target);
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel">
        // One card per blog series (the five MC-SE categories); keep in sync with SERIES in /js/blog.jsx.
        const BLOG_HIGHLIGHTS = [
            { num: '01', label: 'Modular Core', text: 'Módulos y contratos para tu lógica de negocio', href: '/blog/?series=core' },
            { num: '02', label: 'Serverless Edge', text: 'Funciones, caché y cron cerca del usuario', href: '/blog/?series=serverless' },
            { num: '03', label: 'Workflow Automation', text: 'Webhooks, colas y flujos fiables', href: '/blog/?series=workflows' },
            { num: '04', label: 'API Security', text: 'Defensa en capas para APIs headless', href: '/blog/?series=security' },
            { num: '05', label: 'Code Search & Discoverability', text: 'Código y páginas fáciles de encontrar', href: '/blog/?series=search' },
        ];

        const ContentCard = ({ title, desc, align, active, icon }) => {
            return (
                <div className={`flex w-full ${align === 'right' ? 'justify-end' : 'justify-start'} transition-all duration-700 transform ${active ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-95'}`}>
                    <div className={`max-w-xs md:max-w-sm p-8 rounded-[2.5rem] border bg-white/90 backdrop-blur-md shadow-2xl transition-all duration-500 ${active ? 'border-blue-500 shadow-blue-500/10 scale-105' : 'border-gray-100 shadow-gray-200/40'}`}>
                        <div className={`mb-4 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${active ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-400'}`}>
                            {icon}
                        </div>
                        <h3 className="text-xl font-black text-gray-900 mb-2">{title}</h3>
                        <p className="text-sm text-gray-500 font-medium leading-relaxed">{desc}</p>
                    </div>
                </div>
            );
        };

        const CircuitAnimationShowcase = () => {
            const [scrollProgress, setScrollProgress] = useState(0);
            const [pathLength, setPathLength] = useState(0);
            const pathRef = useRef(null);
            const containerRef = useRef(null);

            const BEAM_LENGTH = 160;

            useLayoutEffect(() => {
                if (pathRef.current) {
                    setPathLength(pathRef.current.getTotalLength());
                }
            }, []);

            useEffect(() => {
                const handleScroll = () => {
                    if (!containerRef.current) return;
                    const rect = containerRef.current.getBoundingClientRect();
                    const totalScrollable = containerRef.current.offsetHeight - window.innerHeight;
                    const progress = Math.max(0, Math.min(1, -rect.top / totalScrollable));
                    setScrollProgress(progress);
                };

                handleScroll();
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const circuitD = "M 300,50 L 300,150 C 300,200 100,200 100,250 L 100,450 C 100,500 500,500 500,550 L 500,750 C 500,800 300,800 300,850 L 300,1000";

            // The beam enters from before the start of the path and exits past the end,
            // so it travels the full circuit as the user scrolls.
            const dashOffset = BEAM_LENGTH - scrollProgress * (pathLength + BEAM_LENGTH);

            return (
                <section ref={containerRef} className="relative h-[800vh] w-full bg-slate-50/50">
                    <div className="sticky top-0 h-screen w-full flex items-center justify-center pointer-events-none overflow-hidden">
                        <svg viewBox="0 0 600 1100" className="w-full h-[75%] max-w-4xl transition-opacity duration-1000">
                            <path d={circuitD} stroke="#e2e8f0" strokeWidth="6" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                            <path
                                ref={pathRef}
                                d={circuitD}
                                stroke="url(#blueBeam)"
                                strokeWidth="8"
                                fill="none"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                                style={{
                                    strokeDasharray: `${BEAM_LENGTH} ${pathLength + BEAM_LENGTH}`,
                                    strokeDashoffset: dashOffset,
                                    filter: 'drop-shadow(0 0 15px rgba(37, 99, 235, 0.6))'
                                }}
                            />
                            <defs>
                                <linearGradient id="blueBeam" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#60a5fa" stopOpacity="0" />
                                    <stop offset="50%" stopColor="#2563eb" stopOpacity="1" />
                                    <stop offset="100%" stopColor="#0a192f" stopOpacity="0" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <div className="absolute inset-0 flex flex-col justify-between py-[100vh] z-10 px-6 md:px-20 max-w-6xl mx-auto pointer-events-none">
                        <div className="pointer-events-auto">
                            <ContentCard
                                icon="⚡"
                                title="Flujo de Datos"
                                desc="Transmisión cinética optimizada para infraestructuras críticas sin latencia."
                                align="left"
                                active={scrollProgress > 0.01 && scrollProgress < 0.31}
                            />
                        </div>
                        <div className="pointer-events-auto">
                            <ContentCard
                                icon="🛡️"
                                title="Seguridad Zero Trust"
                                desc="Cifrado de hardware en cada nodo de conexión para integridad total."
                                align="right"
                                active={scrollProgress > 0.35 && scrollProgress < 0.64}
                            />
                        </div>
                        <div className="pointer-events-auto">
                            <ContentCard
                                icon="📊"
                                title="Monitoreo Activo"
                                desc="Seguimiento en tiempo real de voltajes y flujos de información redundante."
                                align="left"
                                active={scrollProgress > 0.68 && scrollProgress < 0.99}
                            />
                        </div>
                    </div>
                </section>
            );
        };

        const SoftwareSection = () => {
            const titleRef = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('reveal-active');
                        }
                    });
                }, { threshold: 0.1 });

                if (titleRef.current) observer.observe(titleRef.current);
                return () => observer.disconnect();
            }, []);

            return (
                <section className="bg-white py-32 px-6 md:px-32 relative z-20 overflow-hidden">
                    <div className="max-w-7xl mx-auto">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                            <div className="order-2 lg:order-1">
                                <h2
                                    ref={titleRef}
                                    className="text-5xl md:text-7xl font-black text-gray-900 tracking-tighter mb-8 leading-tight reveal-blur"
                                >
                                    Software que <br/>
                                    <span className="text-blue-600">Escala Realidades</span>
                                </h2>
                                <div className="space-y-6 text-lg text-gray-600 leading-relaxed max-w-xl">
                                    <p>
                                        En <span className="font-bold text-gray-900">Lameyer</span>, el desarrollo de software no es solo escribir código; es ingeniería de precisión. Diseñamos ecosistemas digitales robustos que actúan como el sistema nervioso de su empresa.
                                    </p>
                                    <p className="opacity-80">
                                        Desde arquitecturas de microservicios hasta interfaces de usuario de alta fidelidad, nuestras soluciones están construidas para soportar el tráfico global mientras mantienen una latencia mínima y una seguridad impenetrable.
                                    </p>
                                    <div className="pt-6">
                                        <a href="/pages/stack/" className="inline-flex items-center gap-3 font-bold text-blue-600 group transition-all">
                                            VER STACK TECNOLÓGICO
                                            <svg className="w-5 h-5 transform group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                                            </svg>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div className="order-1 lg:order-2 relative">
                                <div className="absolute -inset-4 bg-blue-600/5 rounded-[4rem] blur-2xl"></div>
                                <img
                                    src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80&w=1200"
                                    alt="Software Development"
                                    className="relative rounded-[3rem] shadow-2xl object-cover aspect-[4/3] w-full border border-gray-100"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        e.target.src = 'https://placehold.co/1200x900/1a202c/ffffff?text=Software+Development';
                                    }}
                                />
                                <div className="absolute -bottom-6 -left-6 bg-white p-6 rounded-3xl shadow-xl border border-gray-50 flex items-center gap-4 max-w-[200px]">
                                    <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">99%</div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-tight">Uptime en despliegues</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- BLOG TEASER (links into the /blog/ folder) ---
        const BlogSection = () => (
            <section className="py-32 px-4 md:px-8 relative z-20">
                <div className="max-w-6xl mx-auto">
                    <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-8 mb-12">
                        <div>
                            <p className="text-[10px] font-bold uppercase tracking-[0.4em] text-blue-500 mb-4">Blog · Casos y soluciones MC-SE</p>
                            <h3 className="text-4xl md:text-6xl font-black text-gray-900 tracking-tighter leading-tight">
                                Conecta tus flujos<br/><span className="text-blue-600">con lógica Serverless</span>
                            </h3>
                        </div>
                        <a
                            href="/blog/"
                            className="self-start md:self-auto inline-flex items-center gap-3 px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-full shadow-xl hover:scale-105 transition-all uppercase tracking-widest text-xs"
                        >
                            Ver el blog
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                            </svg>
                        </a>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        {BLOG_HIGHLIGHTS.map(post => (
                            <a
                                key={post.href}
                                href={post.href}
                                className="group p-6 rounded-[2rem] border border-gray-100 bg-white/90 backdrop-blur-md shadow-lg shadow-gray-200/40 hover:border-blue-500 hover:-translate-y-1 transition-all duration-300"
                            >
                                <span className="block text-[10px] font-bold uppercase tracking-[0.2em] text-blue-500 mb-3">Categoría {post.num}</span>
                                <span className="block font-black text-gray-900 leading-tight group-hover:text-blue-600 transition-colors mb-2">{post.label}</span>
                                <span className="block text-xs text-gray-500 font-medium leading-snug">{post.text}</span>
                            </a>
                        ))}
                    </div>
                </div>
            </section>
        );

        const HomePage = () => {
            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                gsap.from("#hero-content", { duration: 1.5, y: 50, opacity: 0, ease: "power4.out" });

                // Arriving from another page's REGISTER button (/#form-section):
                // the form only exists after React renders, so scroll to it here.
                if (window.location.hash === '#form-section') {
                    setTimeout(() => document.getElementById('form-section')?.scrollIntoView({ behavior: 'smooth' }), 100);
                }
            }, []);

            return (
                <>
                    <section className="min-h-[80vh] flex flex-col items-center justify-center px-4 text-center relative overflow-hidden">
                        <div id="hero-content" className="relative z-10">
                            <div className="inline-block mb-8 px-5 py-1.5 border border-blue-200 text-blue-600 text-[10px] font-bold rounded-full tracking-[0.5em] uppercase bg-blue-50/50">
                                ESPAÑA 2027 | FIRMA TECNOLÓGICA
                            </div>
                            <h1 className="text-6xl md:text-[10rem] font-black text-gray-900 tracking-tighter mb-10 leading-[0.85]">
                                SOLUCIONES WEB &<br/><span className="text-blue-600">MANEJO DE DATOS</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-gray-500 max-w-3xl mx-auto mb-16 font-medium">
                                Conecta tus flujos de trabajo con lógica Serverless: Modular Core + Serverless Edge (MC-SE).
                            </p>
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-6">
                                <a href="/pages/development/" className="px-10 py-5 bg-blue-600 text-white font-black rounded-full shadow-2xl hover:scale-105 transition-all uppercase tracking-widest text-xs">Explorar Soluciones</a>
                            </div>
                        </div>
                        <div className="absolute bottom-10 animate-bounce opacity-20">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 14l-7 7-7-7" strokeWidth="3"/></svg>
                        </div>
                    </section>

                    <CircuitAnimationShowcase />

                    <SoftwareSection />

                    <StackSection />

                    <BlogSection />

                    <ContactSection />
                </>
            );
        };

        renderPage(HomePage);
    </script>
    <!-- ===================== Lameyer WhatsApp chat widget ===================== -->
    <!-- Self-contained: paste right before </body>. Opens wa.me (Meta's official deep link). -->
    <style>
        .lm-chat { --lm-blue: #2563eb; --lm-navy: #0a192f; --lm-ink: #0a192f; --lm-muted: #64748b; --lm-line: #e2e8f0; --lm-wa: #25d366;
            position: fixed; right: 24px; bottom: 24px; z-index: 90; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--lm-ink); }
        .lm-chat[hidden] { display: none; }
        .lm-chat *, .lm-chat *::before, .lm-chat *::after { box-sizing: border-box; }

        .lm-chat__launcher { width: 60px; height: 60px; border: 0; border-radius: 999px; cursor: pointer; display: grid; place-items: center;
            background: var(--lm-blue); color: #fff; box-shadow: 0 18px 40px -12px rgba(37, 99, 235, .55); transition: transform .25s, background .25s; margin-left: auto; position: relative; }
        .lm-chat__launcher:hover { transform: scale(1.06); background: var(--lm-navy); }
        .lm-chat__launcher:focus-visible, .lm-chat__close:focus-visible, .lm-chat__lang:focus-visible, .lm-chat__start:focus-visible, .lm-chat__msg:focus-visible { outline: 3px solid rgba(37, 99, 235, .45); outline-offset: 2px; }
        .lm-chat__launcher svg { width: 28px; height: 28px; transition: transform .25s, opacity .2s; position: absolute; }
        .lm-chat__launcher .lm-i-close { opacity: 0; transform: rotate(-90deg); }
        .lm-chat.is-open .lm-chat__launcher .lm-i-chat { opacity: 0; transform: rotate(90deg); }
        .lm-chat.is-open .lm-chat__launcher .lm-i-close { opacity: 1; transform: none; }
        .lm-chat__dot { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 999px; background: var(--lm-wa); border: 2px solid #fff; }
        .lm-chat.is-open .lm-chat__dot { display: none; }

        .lm-chat__panel { position: absolute; right: 0; bottom: 76px; width: 360px; max-width: calc(100vw - 32px); border-radius: 2rem; overflow: hidden;
            background: rgba(255, 255, 255, .95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(10, 25, 47, .06);
            box-shadow: 0 30px 60px -20px rgba(10, 25, 47, .35); transform-origin: bottom right;
            opacity: 0; transform: translateY(12px) scale(.96); pointer-events: none; visibility: hidden; transition: opacity .25s, transform .25s, visibility 0s .25s; }
        .lm-chat.is-open .lm-chat__panel { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .25s, transform .25s; }

        .lm-chat__head { background: var(--lm-navy); color: #fff; padding: 20px 22px; display: flex; align-items: center; gap: 12px; }
        .lm-chat__avatar { width: 42px; height: 42px; border-radius: 14px; background: var(--lm-blue); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; flex: none; }
        .lm-chat__title { margin: 0; font-size: .95rem; font-weight: 800; line-height: 1.2; }
        .lm-chat__status { margin: 2px 0 0; font-size: .75rem; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
        .lm-chat__status::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--lm-wa); }
        .lm-chat__close { margin-left: auto; background: transparent; border: 0; color: #cbd5e1; cursor: pointer; padding: 6px; border-radius: 10px; }
        .lm-chat__close:hover { color: #fff; background: rgba(255, 255, 255, .08); }
        .lm-chat__close svg { width: 20px; height: 20px; display: block; }

        .lm-chat__body { padding: 20px 22px 22px; }
        .lm-chat__bubble { background: #f1f5f9; border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: .9rem; line-height: 1.5; margin: 0 0 18px; max-width: 92%; }
        .lm-chat__label { display: block; font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--lm-muted); margin: 0 0 8px; }
        .lm-chat__langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 16px; }
        .lm-chat__lang { border: 1px solid var(--lm-line); background: #fff; border-radius: 14px; padding: 8px 4px; cursor: pointer; font: inherit; color: var(--lm-ink); text-align: center; transition: border-color .2s, background .2s, color .2s; }
        .lm-chat__lang b { display: block; font-size: .85rem; font-weight: 800; }
        .lm-chat__lang span { display: block; font-size: .7rem; color: var(--lm-muted); }
        .lm-chat__lang:hover { border-color: var(--lm-blue); }
        .lm-chat__lang[aria-checked="true"] { background: var(--lm-blue); border-color: var(--lm-blue); color: #fff; }
        .lm-chat__lang[aria-checked="true"] span { color: #dbeafe; }
        .lm-chat__msg { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--lm-line); border-radius: 16px; padding: 10px 12px; font: inherit; font-size: .9rem; color: var(--lm-ink); background: #fff; margin: 0 0 16px; }
        .lm-chat__start { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px 20px; border-radius: 999px;
            background: var(--lm-blue); color: #fff; text-decoration: none; font-weight: 800; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; transition: background .2s, transform .2s; }
        .lm-chat__start:hover { background: var(--lm-navy); transform: translateY(-1px); }
        .lm-chat__start svg { width: 18px; height: 18px; }
        .lm-chat__foot { margin: 12px 0 0; text-align: center; font-size: .7rem; color: var(--lm-muted); }

        @media (max-width: 480px) {
            .lm-chat { right: 16px; bottom: 16px; }
            .lm-chat__panel { width: calc(100vw - 32px); bottom: 72px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .lm-chat__launcher, .lm-chat__launcher svg, .lm-chat__panel, .lm-chat__start { transition: none; }
        }
    </style>

    <div class="lm-chat" id="lm-chat" lang="es" hidden>
        <div class="lm-chat__panel" id="lm-chat-panel" role="dialog" aria-modal="false" aria-labelledby="lm-chat-title">
            <div class="lm-chat__head">
                <div class="lm-chat__avatar" aria-hidden="true">L</div>
                <div>
                    <p class="lm-chat__title" id="lm-chat-title">Lameyer</p>
                    <p class="lm-chat__status" data-i18n="status">Soporte en español e inglés · España</p>
                </div>
                <button class="lm-chat__close" type="button" data-i18n-label="close" aria-label="Cerrar chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <div class="lm-chat__body">
                <p class="lm-chat__bubble" data-i18n="greeting">👋 Hola, ¿en qué podemos ayudarte? Escríbenos en español o en inglés y continúa la conversación en WhatsApp.</p>

                <span class="lm-chat__label" id="lm-chat-lang" data-i18n="language">Idioma</span>
                <div class="lm-chat__langs" role="radiogroup" aria-labelledby="lm-chat-lang">
                    <button class="lm-chat__lang" type="button" role="radio" data-lang="es" lang="es"><b>ES</b><span>Español</span></button>
                    <button class="lm-chat__lang" type="button" role="radio" data-lang="en" lang="en"><b>EN</b><span>English</span></button>
                </div>

                <label class="lm-chat__label" for="lm-chat-msg" data-i18n="message">Mensaje</label>
                <textarea class="lm-chat__msg" id="lm-chat-msg" maxlength="500"></textarea>

                <a class="lm-chat__start" href="https://wa.me/" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>
                    <span data-i18n="start">Iniciar chat</span>
                </a>
                <p class="lm-chat__foot" data-i18n="foot">Se abrirá WhatsApp en una nueva pestaña.</p>
            </div>
        </div>

        <button class="lm-chat__launcher" type="button" aria-label="Abrir chat de WhatsApp" aria-expanded="false" aria-controls="lm-chat-panel">
            <svg class="lm-i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5l1.5-4.9A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>
            <svg class="lm-i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            <span class="lm-chat__dot" aria-hidden="true"></span>
        </button>
    </div>

    <script>
        (function () {
            // Spain WhatsApp number: full international format, digits only — no "+", spaces, brackets or leading zeros
            //   (ES +34 602 55 76 85 -> 34602557685).
            var NUMBER = '34602557685';

            // Bilingual support: Spanish (default) and English.
            var STRINGS = {
                es: {
                    status: 'Soporte en español e inglés · España',
                    greeting: '👋 Hola, ¿en qué podemos ayudarte? Escríbenos en español o en inglés y continúa la conversación en WhatsApp.',
                    language: 'Idioma',
                    message: 'Mensaje',
                    start: 'Iniciar chat',
                    foot: 'Se abrirá WhatsApp en una nueva pestaña.',
                    close: 'Cerrar chat',
                    open: 'Abrir chat de WhatsApp',
                    closeWa: 'Cerrar chat de WhatsApp',
                    text: 'Hola Lameyer, me gustaría información sobre sus servicios.'
                },
                en: {
                    status: 'Support in Spanish & English · Spain',
                    greeting: '👋 Hi, how can we help? Write to us in English or Spanish and continue the conversation on WhatsApp.',
                    language: 'Language',
                    message: 'Message',
                    start: 'Start chat',
                    foot: 'WhatsApp will open in a new tab.',
                    close: 'Close chat',
                    open: 'Open WhatsApp chat',
                    closeWa: 'Close WhatsApp chat',
                    text: 'Hi Lameyer, I would like information about your services.'
                }
            };
            var LANGS = ['es', 'en'];

            if (!/^[1-9]\d{7,14}$/.test(NUMBER)) { console.warn('[lm-chat] Invalid WhatsApp number: ' + NUMBER + '; widget hidden.'); return; }

            var root = document.getElementById('lm-chat');
            var launcher = root.querySelector('.lm-chat__launcher');
            var closeBtn = root.querySelector('.lm-chat__close');
            var group = root.querySelector('.lm-chat__langs');
            var msg = root.querySelector('.lm-chat__msg');
            var start = root.querySelector('.lm-chat__start');

            var lang = /^en\b/i.test(navigator.language || '') ? 'en' : 'es';
            var edited = false;

            function t(key) { return STRINGS[lang][key]; }

            function link() {
                var text = msg.value.trim();
                start.href = 'https://wa.me/' + NUMBER + (text ? '?text=' + encodeURIComponent(text) : '');
            }

            function setLauncherLabel() {
                launcher.setAttribute('aria-label', root.classList.contains('is-open') ? t('closeWa') : t('open'));
            }

            function setLang(next) {
                lang = next;
                root.lang = lang;
                root.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
                root.querySelectorAll('[data-i18n-label]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nLabel)); });
                group.querySelectorAll('.lm-chat__lang').forEach(function (b) {
                    var on = b.dataset.lang === lang;
                    b.setAttribute('aria-checked', on ? 'true' : 'false');
                    b.tabIndex = on ? 0 : -1;
                });
                // Swap the prefilled message only if the visitor hasn't written their own, or it's still a default.
                if (!edited || LANGS.some(function (l) { return msg.value === STRINGS[l].text; })) { msg.value = t('text'); edited = false; }
                setLauncherLabel();
                link();
            }

            group.querySelectorAll('.lm-chat__lang').forEach(function (b) {
                b.addEventListener('click', function () { setLang(b.dataset.lang); });
            });

            // Arrow keys toggle between languages (radio group pattern).
            group.addEventListener('keydown', function (e) {
                var step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
                if (!step) return;
                e.preventDefault();
                var next = LANGS[(LANGS.indexOf(lang) + step + LANGS.length) % LANGS.length];
                setLang(next);
                group.querySelector('[data-lang="' + next + '"]').focus();
            });

            msg.addEventListener('input', function () { edited = true; link(); });

            function setOpen(open) {
                root.classList.toggle('is-open', open);
                launcher.setAttribute('aria-expanded', open ? 'true' : 'false');
                setLauncherLabel();
                if (open) start.focus(); else launcher.focus();
            }
            launcher.addEventListener('click', function () { setOpen(!root.classList.contains('is-open')); });
            closeBtn.addEventListener('click', function () { setOpen(false); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && root.classList.contains('is-open')) setOpen(false);
            });

            setLang(lang);
            root.hidden = false;
        })();
    </script>
    <!-- =================== /Lameyer WhatsApp chat widget =================== -->

</body>
</html>
