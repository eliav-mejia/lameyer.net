<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatización serverless de flujos - Academia Lameyer</title>
    <meta name="description" content="Conectar flujos de trabajo con lógica serverless: webhooks, colas y pasos duraderos que enlazan formularios, CRM, hojas de cálculo y pagos con un núcleo modular, con reintentos e idempotencia.">
    <link rel="canonical" href="https://lameyer.net/academia/automatizacion-flujos/automatizacion-serverless-flujos/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Verifica la firma de cada webhook',
            'Confirma rápido y procesa en una cola',
            'Da a cada trabajo una clave de idempotencia',
            'Reintenta con backoff y después envía a la cola de mensajes fallidos',
            'Divide los flujos largos en pasos duraderos',
            'Alerta sobre la cola de mensajes fallidos, no sobre cada reintento',
        ];

        const CASES = [
            { case: 'Un formulario de contacto debe crear un lead en el CRM y enviar un email de bienvenida', solution: 'Webhook del formulario → cola → dos pasos independientes' },
            { case: 'Un pedido pagado debe emitir una factura y actualizar una hoja de cálculo', solution: 'Webhook del pago → flujo duradero que llama al núcleo' },
            { case: 'El proveedor de pagos envía el mismo webhook dos veces', solution: 'Clave de idempotencia guardada antes de procesar' },
            { case: 'La API del CRM está caída durante una hora', solution: 'La cola reintenta con backoff y no se pierde nada' },
            { case: 'Cada noche, sincronizar el stock de un proveedor', solution: 'Cron trigger → cola → pasos por lotes' },
        ];

        const Content = () => (
            <>
                <P>
                    La mayoría de los flujos de negocio siguen siendo alguien copiando datos de una herramienta a otra: un formulario al CRM,
                    un pedido a una hoja de cálculo, un pago a una factura. La <strong className="text-gray-900">lógica serverless</strong> conecta
                    esas herramientas sin un servidor encendido todo el día. Llega un evento, una función reacciona, el{' '}
                    <A href="/academia/nucleo-modular/arquitectura-nucleo-modular/">núcleo modular</A> aplica las reglas de negocio y las integraciones entregan
                    el resultado.
                </P>

                <H2>Casos de uso para desarrolladores</H2>
                <Table
                    columns={[{ key: 'case', label: 'Flujo' }, { key: 'solution', label: 'Solución serverless', accent: true }]}
                    rows={CASES}
                />

                <H2>La forma de un flujo fiable</H2>
                <P>
                    Todos los flujos siguen el mismo camino: <strong className="text-gray-900">disparador → cola → pasos → resultado</strong>.
                    El disparador (un webhook, un formulario, un calendario) debe responder rápido, así que solo verifica la petición y pone un
                    mensaje en una cola. El consumidor hace el trabajo lento, y la cola lo reintenta cuando falla una API externa.
                </P>
                <CodeBlock title="src/webhook.ts">{`export default {
  async fetch(request, env) {
    const body = await request.text();
    if (!(await verifySignature(body, request.headers.get('x-signature'), env.WEBHOOK_SECRET))) {
      return new Response('Bad signature', { status: 401 });
    }
    const event = JSON.parse(body);
    await env.ORDERS_QUEUE.send({ id: event.id, type: event.type, data: event.data });
    return new Response('Accepted', { status: 202 });
  },

  async queue(batch, env) {
    for (const msg of batch.messages) {
      if (await env.PROCESSED.get(msg.body.id)) { msg.ack(); continue; }  // ya procesado
      try {
        await handleOrder(msg.body, env);  // núcleo: factura, CRM, email
        await env.PROCESSED.put(msg.body.id, '1', { expirationTtl: 7 * 86400 });
        msg.ack();
      } catch {
        msg.retry({ delaySeconds: 30 });  // tras el máximo de reintentos va a la cola de mensajes fallidos
      }
    }
  },
};`}</CodeBlock>

                <H2>Las cuatro reglas</H2>
                <UL items={[
                    <><strong className="text-gray-900">Verificar.</strong> Comprueba la firma HMAC de cada webhook. Una URL de webhook sin autenticar es una puerta abierta a tu núcleo.</>,
                    <><strong className="text-gray-900">Confirmar rápido.</strong> Los proveedores agotan el tiempo y reenvían a los pocos segundos. Devuelve <Code>202</Code> y haz el trabajo en la cola.</>,
                    <><strong className="text-gray-900">Ser idempotente.</strong> La entrega es al menos una vez, así que el mismo evento llegará dos veces. Registra una clave de idempotencia antes de actuar.</>,
                    <><strong className="text-gray-900">Reintentar y después apartar.</strong> Espera cada vez más entre reintentos y, tras el último, mueve el mensaje a una cola de mensajes fallidos que avise a alguien.</>,
                ]} />

                <H2>Cuando una cola no basta: flujos duraderos</H2>
                <P>
                    Un flujo con muchos pasos, esperas («envía un recordatorio dentro de tres días») o aprobaciones humanas se escribe mejor
                    como un flujo duradero, como Cloudflare Workflows, AWS Step Functions o Temporal. El resultado de cada paso se guarda, así
                    que un fallo en el paso cuatro reintenta el paso cuatro, no todo el flujo.
                </P>

                <Callout title="Cómo encaja con el resto de MC-SE">
                    Los disparadores se ejecutan en el <A href="/academia/edge-serverless/arquitectura-edge-serverless/">Edge Serverless</A>, las reglas
                    de negocio viven en el <A href="/academia/nucleo-modular/arquitectura-nucleo-modular/">Núcleo Modular</A> y los endpoints públicos de webhooks
                    están protegidos por las capas de <A href="/academia/?series=seguridad-apis">Seguridad de APIs</A>, sobre todo la limitación de tasa y la
                    validación de esquema.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
