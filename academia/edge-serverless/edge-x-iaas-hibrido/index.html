<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge × IaaS (híbrido) - Academia Lameyer</title>
    <meta name="description" content="Poner funciones serverless en el edge delante de las VMs y bases de datos existentes, llegar a ellas de forma privada con Cloudflare Tunnel e Hyperdrive, y migrar ruta a ruta sin reescribir.">
    <link rel="canonical" href="https://lameyer.net/academia/edge-serverless/edge-x-iaas-hibrido/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Pon un Worker delante antes de cambiar nada detrás',
            'Elimina las IP públicas: llega a los servidores a través de Tunnel',
            'Conecta las bases de datos a través de Hyperdrive, no en cada petición',
            'Mueve una ruta cada vez, detrás de un flag',
            'Compara las respuestas antiguas y nuevas antes de cambiar',
            'Redimensiona o retira cada servidor a medida que se mueven sus rutas',
        ];

        const STAGES = [
            { stage: '1. Delante', edge: 'El Worker hace de proxy de todo', iaas: 'Sin cambios, ahora privado detrás de Tunnel', gain: 'Seguridad, caché, un único punto de entrada' },
            { stage: '2. Descargar', edge: 'Autenticación, caché, redirecciones, cron', iaas: 'Solo atiende peticiones de negocio', gain: 'Menos carga, servidores más pequeños' },
            { stage: '3. Estrangular', edge: 'Ruta a ruta, lógica nueva en Workers o en el núcleo', iaas: 'Menos rutas cada mes', gain: 'Modernizar sin big bang' },
            { stage: '4. Asentar', edge: 'Edge + núcleo modular', iaas: 'Solo lo que de verdad necesita un servidor (o nada)', gain: 'Menor coste fijo' },
        ];

        const Content = () => (
            <>
                <P>
                    La mayoría de los clientes no parten de cero. Tienen infraestructura (IaaS): VMs con un ERP, una aplicación PHP de 2015,
                    una base de datos Postgres con diez años de pedidos. «Reescribirlo todo en serverless» no es un plan que nadie deba
                    aceptar. El camino práctico es <strong className="text-gray-900">híbrido</strong>: poner funciones serverless en el edge
                    delante de lo que existe, hacer privados los servidores y mover responsabilidades al edge ruta a ruta. Es el patrón
                    strangler fig, aplicado con las herramientas de la serie <A href="/academia/edge-serverless/arquitectura-edge-serverless/">Edge Serverless</A>.
                </P>

                <H2>Cuatro etapas</H2>
                <Table
                    columns={[{ key: 'stage', label: 'Etapa', accent: true }, { key: 'edge', label: 'Edge (serverless)' }, { key: 'iaas', label: 'Servidores (IaaS)' }, { key: 'gain', label: 'Beneficio' }]}
                    rows={STAGES}
                />
                <P>
                    Cada etapa es útil por sí sola. Un cliente que se detiene tras la etapa 2 ya tiene un sistema más seguro, más rápido y más barato.
                </P>

                <H2>Etapa 1: una puerta de entrada y servidores privados</H2>
                <P>
                    Primero, el Worker se convierte en el único punto de entrada público y simplemente lo reenvía todo. Después los servidores
                    pierden sus IP públicas: un conector de <A href="/academia/seguridad-apis/tunel-cloudflare/">Cloudflare Tunnel</A> en cada VM abre
                    una conexión de salida, así que nada necesita un puerto de entrada abierto. Los atacantes ya no pueden saltarse el edge
                    para atacar directamente el origen.
                </P>
                <CodeBlock title="Configuración de cloudflared en la VM heredada">{`tunnel: legacy-app
credentials-file: /etc/cloudflared/legacy-app.json
ingress:
  - hostname: legacy-origin.internal.example.com
    service: http://localhost:8080
  - service: http_status:404`}</CodeBlock>

                <H2>Llega a la base de datos sin abrirla</H2>
                <P>
                    Las nuevas funciones edge suelen necesitar los datos de la base de datos existente. Hyperdrive mantiene un pool de
                    conexiones cerca de la base de datos, para que cientos de Workers de vida corta no agoten su límite de conexiones, y puede
                    llegar a una base de datos privada a través de un Tunnel. Los datos se quedan donde están, como sistema de registro, hasta
                    que haya un motivo para moverlos (consulta <A href="/academia/edge-serverless/almacenamiento-edge-kv-d1-r2/">Almacenamiento edge</A>).
                </P>
                <CodeBlock title="wrangler.jsonc (extracto)">{`"hyperdrive": [
  { "binding": "LEGACY_DB", "id": "<hyperdrive-config-id>" }   // apunta a Postgres a través de Tunnel
]`}</CodeBlock>

                <H2>Etapa 3: mueve una ruta cada vez</H2>
                <P>
                    El gateway decide, por ruta, si responde el servidor antiguo o el código nuevo. Un flag en KV hace que cada cambio sea
                    reversible en segundos, sin desplegar.
                </P>
                <CodeBlock title="src/index.ts">{`app.all('*', async (c) => {
  const migrated = (await c.env.CONFIG.get<string[]>('migrated-routes', 'json')) ?? [];
  const path = new URL(c.req.url).pathname;
  if (migrated.some((p) => path.startsWith(p))) {
    return c.env.CORE.fetch(c.req.raw);                    // nuevo: núcleo modular
  }
  return fetch('https://legacy-origin.internal.example.com' + path, c.req.raw);   // antiguo: VM a través de Tunnel
});`}</CodeBlock>
                <Callout title="Compara en sombra antes de cambiar">
                    En las rutas de lectura, envía cada petición a la implementación antigua y a la nueva durante unos días, devuelve la
                    respuesta antigua y registra cualquier diferencia (<Code>ctx.waitUntil</Code> lo mantiene fuera del camino crítico del
                    usuario). Cambia cuando el registro de diferencias se quede vacío.
                </Callout>

                <H2>Qué debería quedarse en servidores</H2>
                <UL items={[
                    <><strong className="text-gray-900">Los grandes sistemas de registro con estado</strong> (la base de datos principal, un ERP) a menudo están mejor en IaaS gestionado, con acceso privado.</>,
                    <><strong className="text-gray-900">El cómputo largo o pesado</strong> (vídeo, grandes trabajos de ML) que no cabe en los límites de una función. Aquí los contenedores o las VMs siguen teniendo sentido.</>,
                    <><strong className="text-gray-900">El software con licencia</strong> que solo funciona en un sistema operativo concreto.</>,
                ]} />
                <P>
                    El objetivo no es cero servidores. Es que cada servidor que quede tenga un motivo para existir, sea privado y haga solo el
                    trabajo que lo necesita.
                </P>

                <H2>Medirlo</H2>
                <P>
                    Controla las rutas migradas frente a las restantes, las peticiones que llegan al origen heredado (deberían bajar cada mes),
                    las IP públicas y los puertos de entrada abiertos (objetivo cero), y la factura mensual de IaaS a medida que se reducen los
                    servidores. Medida en dinero, la migración híbrida se paga sola por etapas en lugar de exigir un gran presupuesto por adelantado.
                </P>

                <Callout title="Relacionado">
                    La lógica nueva que sustituye a las rutas antiguas va en el <A href="/academia/nucleo-modular/arquitectura-nucleo-modular/">Núcleo Modular</A>,
                    no en el edge. Las integraciones con sistemas locales reutilizan el mismo Tunnel, como se muestra en{' '}
                    <A href="/academia/edge-serverless/funciones-x-paas-integracion/">Funciones × PaaS de integración</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
