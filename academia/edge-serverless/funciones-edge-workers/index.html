<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones edge (Workers) - Academia Lameyer</title>
    <meta name="description" content="Cómo se ejecutan los Cloudflare Workers sobre isolates de V8, qué implican sus límites para el diseño y cómo los service bindings dividen una plataforma en funciones pequeñas que se llaman entre sí de forma privada.">
    <link rel="canonical" href="https://lameyer.net/academia/edge-serverless/funciones-edge-workers/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Un Worker por responsabilidad, no uno por endpoint',
            'Conecta los Workers con service bindings, no con URLs públicas',
            'Guarda los secretos con wrangler secret, nunca en el código',
            'Transmite los cuerpos grandes en streaming en lugar de cargarlos en memoria',
            'Delega el trabajo lento en una cola con waitUntil o Queues',
            'Activa Smart Placement en los Workers que hablan con un solo backend',
        ];

        const MODELS = [
            { model: 'VM (IaaS)', unit: 'Un servidor entero', start: 'Minutos', you: 'SO, parches, escalado, capacidad' },
            { model: 'Contenedor (PaaS / FaaS)', unit: 'Una imagen de proceso', start: 'De cientos de ms a segundos', you: 'Imagen, versión del runtime, concurrencia' },
            { model: 'Isolate (Workers)', unit: 'Un sandbox de V8', start: 'Normalmente menos de 5 ms', you: 'Solo el código' },
        ];

        const Content = () => (
            <>
                <P>
                    Toda plataforma tiene una puerta de entrada: el primer código que se ejecuta cuando llega una petición, un webhook o un
                    evento programado. En un stack tradicional esa puerta es un servidor que alquilas (IaaS) o una plataforma de contenedores
                    que configuras (PaaS). En MC-SE es una <strong className="text-gray-900">función edge</strong>: un pequeño programa
                    desplegado a la vez en todas las ubicaciones de Cloudflare. Este artículo explica cómo se ejecutan los Workers, qué
                    implican sus límites para el diseño y cómo dividir una plataforma en varios de ellos.
                </P>

                <H2>Isolates, no servidores</H2>
                <P>
                    Un Worker no tiene su propia VM ni su propio contenedor. Se ejecuta en un isolate de V8, el mismo sandbox que usa una
                    pestaña del navegador, y miles de isolates comparten un proceso. Por eso un Worker arranca en milisegundos y por eso no
                    hay capacidad que planificar: cada petición recibe un isolate en la ubicación más cercana al usuario.
                </P>
                <Table
                    columns={[{ key: 'model', label: 'Modelo' }, { key: 'unit', label: 'Unidad' }, { key: 'start', label: 'Tiempo de arranque', accent: true }, { key: 'you', label: 'Gestionas tú' }]}
                    rows={MODELS}
                />

                <H2>Los límites dan forma al diseño</H2>
                <P>
                    Los isolates cambian flexibilidad por velocidad. Cada petición tiene un presupuesto de tiempo de CPU (milisegundos en el
                    plan gratuito, configurable hasta minutos en los planes de pago), unos 128 MB de memoria y un tope de subpeticiones
                    salientes. No hay sistema de archivos local ni procesos de larga duración. Consulta la página de límites actual de
                    Cloudflare antes de fiarte de una cifra. Las consecuencias para el diseño no cambian:
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Haz poco por petición.</strong> Enrutar, comprobar, transformar, reenviar. El trabajo pesado (PDFs, importaciones grandes) va a una cola.</>,
                    <><strong className="text-gray-900">Transmite, no acumules.</strong> Pasa <Code>request.body</Code> directamente en lugar de cargar en memoria una subida de 50 MB.</>,
                    <><strong className="text-gray-900">Mantén el estado fuera.</strong> Todo lo que deba sobrevivir a la petición vive en el <A href="/academia/edge-serverless/almacenamiento-edge-kv-d1-r2/">almacenamiento edge</A> o en el núcleo.</>,
                    <><strong className="text-gray-900">Esperar es gratis.</strong> El tiempo de CPU cuenta el cómputo, no el tiempo esperando un <Code>fetch</Code>, así que el código de integración con mucha E/S es barato.</>,
                ]} />

                <H2>Un Worker mínimo con router</H2>
                <P>
                    Para cualquier cosa que pase de una ruta, un router pequeño como Hono mantiene el código legible. Funciona en Workers sin
                    adaptadores y apenas añade nada al bundle.
                </P>
                <CodeBlock title="src/index.ts">{`import { Hono } from 'hono';

type Env = { CORE: Fetcher; CONFIG: KVNamespace; API_TOKEN: string };
const app = new Hono<{ Bindings: Env }>();

app.get('/health', (c) => c.json({ ok: true }));

app.get('/v1/products/:id', async (c) => {
  // Llama al núcleo a través de un service binding: sin salto público.
  return c.env.CORE.fetch(new Request('https://core/products/' + c.req.param('id')));
});

app.post('/v1/orders', async (c) => {
  const res = await c.env.CORE.fetch('https://core/orders', {
    method: 'POST',
    body: c.req.raw.body,            // en streaming, sin cargarlo en memoria
    headers: { 'content-type': 'application/json' },
  });
  return new Response(res.body, res);
});

export default app;`}</CodeBlock>

                <H2>Divide por responsabilidad con service bindings</H2>
                <P>
                    Una plataforma rara vez cabe mucho tiempo en un solo Worker. Un <strong className="text-gray-900">service binding</strong> permite
                    que un Worker llame a otro directamente, dentro de Cloudflare, sin URL pública, consulta DNS ni autenticación extra. Al
                    Worker llamado ni siquiera se puede llegar desde internet si no le das una ruta. Es una forma limpia de separar un gateway
                    público de las funciones internas.
                </P>
                <CodeBlock title="wrangler.jsonc (gateway)">{`{
  "name": "gateway",
  "main": "src/index.ts",
  "compatibility_date": "2026-09-01",
  "services": [
    { "binding": "CORE", "service": "core-adapter" },
    { "binding": "CRM", "service": "connector-crm" }
  ],
  "kv_namespaces": [{ "binding": "CONFIG", "id": "<namespace-id>" }],
  "placement": { "mode": "smart" },
  "observability": { "enabled": true }
}`}</CodeBlock>
                <Callout title="Smart Placement">
                    Ejecutar en el edge solo ayuda si la función no se pasa el tiempo hablando con una base de datos en otro continente. Con{' '}
                    <Code>placement.mode = "smart"</Code>, Cloudflare ejecuta el Worker cerca del backend al que más llama, mientras los
                    usuarios siguen conectándose a la ubicación más cercana. Úsalo en los adaptadores que están delante de un núcleo o de una
                    base de datos.
                </Callout>

                <H2>Qué dividir y qué no</H2>
                <UL items={[
                    <><strong className="text-gray-900">Divide</strong> por confianza y ciclo de vida: el gateway público, cada conector de terceros, las herramientas de administración.</>,
                    <><strong className="text-gray-900">No dividas</strong> por endpoint. Veinte Workers de una ruta son veinte configuraciones y veinte despliegues para un solo cambio.</>,
                    <><strong className="text-gray-900">Mantén las reglas de negocio en el núcleo.</strong> Un Worker que calcula precios duplica el <A href="/academia/nucleo-modular/arquitectura-nucleo-modular/">núcleo modular</A> y acaba divergiendo de él.</>,
                ]} />

                <H2>Medirlo</H2>
                <P>
                    Controla el tiempo real P50 y P95 por ruta, el tiempo de CPU por petición (determina el coste), la tasa de errores por
                    Worker y las subpeticiones por petición. Una ruta cuyo tiempo de CPU no deja de subir está haciendo un trabajo que
                    corresponde al núcleo o a una cola.
                </P>

                <Callout title="Siguiente paso">
                    Una puerta de entrada necesita reglas sobre quién entra. <A href="/academia/edge-serverless/enrutado-cache-autenticacion-edge/">Enrutado,
                    caché y autenticación en el edge</A> convierte este Worker en un gateway. Para ver el mismo patrón aplicado a vender
                    integraciones, lee <A href="/academia/edge-serverless/funciones-x-paas-integracion/">Funciones × PaaS de integración</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
