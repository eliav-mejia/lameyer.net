<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura de Edge Serverless - Academia Lameyer</title>
    <meta name="description" content="Edge Serverless: qué va en una función edge y qué va en el núcleo. Enrutado, autenticación, caché y tareas cron en el edge, con KV, D1 y R2 para el estado.">
    <link rel="canonical" href="https://lameyer.net/academia/edge-serverless/arquitectura-edge-serverless/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Mantén ligeras las funciones edge: enrutar, comprobar, cachear, reenviar',
            'Pon las reglas de negocio en el núcleo, no en el edge',
            'Elige el almacenamiento según la consistencia que necesites (KV, D1, R2)',
            'Cachea las respuestas GET públicas con TTL explícitos',
            'Pasa las tareas periódicas a Cron Triggers',
            'Registra un ID de petición a través del edge y el núcleo',
        ];

        const PLACEMENT = [
            { task: 'Redirecciones, enrutado A/B, geolocalización', where: 'Edge', why: 'Solo necesita la petición y se ejecuta en todas las ubicaciones' },
            { task: 'Verificar un JWT o una clave de API', where: 'Edge', why: 'Rechaza las peticiones malas antes de que le cuesten nada al núcleo' },
            { task: 'Cachear respuestas del catálogo o de la academia', where: 'Edge', why: 'Se sirven desde la ubicación más cercana, sin ir al origen' },
            { task: 'Feature flags y configuración', where: 'Edge (KV)', why: 'Muchas lecturas; tolera unos segundos de desfase' },
            { task: 'Crear una factura, cobrar una tarjeta', where: 'Núcleo', why: 'Necesita transacciones y todas las reglas de negocio' },
            { task: 'Informes nocturnos, limpieza, sincronización', where: 'Edge (Cron) llamando al núcleo', why: 'Ningún servidor encendido entre tarea y tarea' },
        ];

        const Content = () => (
            <>
                <P>
                    El <strong className="text-gray-900">Edge Serverless</strong> es la «SE» de MC-SE. En lugar de un servidor en una región,
                    pequeñas funciones se ejecutan en centros de datos cercanos a cada usuario, arrancan en milisegundos y escalan a cero.
                    Nadie parchea un sistema operativo, y un pico de tráfico es problema del proveedor. La contrapartida es que cada función
                    tiene límites estrictos de CPU y memoria, así que la pregunta siempre es: <em>¿qué va en el edge y qué va en el núcleo?</em>
                </P>

                <H2>Casos de uso para desarrolladores: ¿edge o núcleo?</H2>
                <Table
                    columns={[{ key: 'task', label: 'Tarea' }, { key: 'where', label: 'Se ejecuta en', accent: true }, { key: 'why', label: 'Por qué' }]}
                    rows={PLACEMENT}
                />

                <H2>Una función edge ligera</H2>
                <P>
                    Una buena función edge hace cuatro cosas: enrutar, comprobar, cachear y reenviar. Aquí un Worker de Cloudflare valida una
                    clave de API guardada en KV, sirve las respuestas GET cacheadas y reenvía todo lo demás al{' '}
                    <A href="/academia/nucleo-modular/arquitectura-nucleo-modular/">núcleo modular</A>.
                </P>
                <CodeBlock title="src/worker.ts">{`export default {
  async fetch(request, env, ctx) {
    const key = request.headers.get('x-api-key');
    if (!key || !(await env.API_KEYS.get(key))) {
      return new Response('Unauthorized', { status: 401 });
    }

    const cache = caches.default;
    if (request.method === 'GET') {
      const hit = await cache.match(request);
      if (hit) return hit;
    }

    const res = await fetch(new Request(env.CORE_URL + new URL(request.url).pathname, request));
    if (request.method === 'GET' && res.ok) ctx.waitUntil(cache.put(request, res.clone()));
    return res;
  },

  async scheduled(event, env, ctx) {
    ctx.waitUntil(fetch(env.CORE_URL + '/jobs/nightly-sync', { method: 'POST' }));
  },
};`}</CodeBlock>

                <H2>Estado en el edge</H2>
                <UL items={[
                    <><strong className="text-gray-900">KV</strong> para valores con muchas lecturas y consistencia eventual: configuración, feature flags, búsquedas de claves de API.</>,
                    <><strong className="text-gray-900">D1</strong> (SQLite) cuando el edge necesita consultas relacionales sobre su propio conjunto de datos pequeño.</>,
                    <><strong className="text-gray-900">R2</strong> para archivos y objetos: subidas, exportaciones, PDFs generados, sin costes de salida.</>,
                    <><strong className="text-gray-900">Durable Objects</strong> cuando algo concreto necesita consistencia fuerte, como un contador, un bloqueo o una sala de chat.</>,
                ]} />

                <H2>Operarlo</H2>
                <P>
                    Serverless no significa invisible. Pasa un ID de petición del edge al núcleo, conserva logs y trazas de ambos y vigila el
                    tiempo de CPU por petición, porque determina tanto la latencia como el coste. <Code>wrangler tail</Code> muestra los logs
                    en directo mientras depuras.
                </P>

                <H2>Profundiza</H2>
                <UL items={[
                    <><A href="/academia/edge-serverless/funciones-edge-workers/">Funciones edge</A>: cómo se ejecutan los Workers, sus límites y cómo dividir una plataforma con service bindings.</>,
                    <><A href="/academia/edge-serverless/enrutado-cache-autenticacion-edge/">Enrutado, caché y autenticación</A>: convertir un Worker en el API gateway.</>,
                    <><A href="/academia/edge-serverless/almacenamiento-edge-kv-d1-r2/">Almacenamiento edge</A>: elegir entre KV, D1, R2, Durable Objects e Hyperdrive.</>,
                    <><A href="/academia/edge-serverless/tareas-programadas-cron/">Tareas programadas</A>: jubilar el servidor de sincronización siempre encendido.</>,
                    <><A href="/academia/edge-serverless/logs-trazas-costes/">Logs, trazas y costes</A>: ver por dentro la plataforma y cuánto cuesta cada cliente.</>,
                ]} />
                <P>
                    Tres cruces aplican todo esto a las plataformas que construimos para clientes: un{' '}
                    <A href="/academia/edge-serverless/funciones-x-paas-integracion/">PaaS de integración hecho de funciones edge</A>, un{' '}
                    <A href="/academia/edge-serverless/edge-x-iaas-hibrido/">camino híbrido para servidores existentes (IaaS)</A> y un{' '}
                    <A href="/academia/edge-serverless/medicion-x-saas-multiinquilino/">SaaS multiinquilino con medición de uso</A>.
                </P>

                <Callout title="Cómo encaja con el resto de MC-SE">
                    El edge es también donde se ejecutan las capas de <A href="/academia/?series=seguridad-apis">Seguridad de APIs</A>, desde la
                    protección DDoS hasta la limitación de tasa. El trabajo en segundo plano que no debe bloquear una petición va en{' '}
                    <A href="/academia/automatizacion-flujos/automatizacion-serverless-flujos/">Automatización de flujos</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
