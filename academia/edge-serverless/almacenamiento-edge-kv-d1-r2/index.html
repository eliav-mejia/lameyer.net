<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacenamiento edge (KV, D1, R2) - Academia Lameyer</title>
    <meta name="description" content="Elegir entre Cloudflare KV, D1, R2, Durable Objects e Hyperdrive: consistencia, latencia y cuándo mantener los datos en tu base de datos actual.">
    <link rel="canonical" href="https://lameyer.net/academia/edge-serverless/almacenamiento-edge-kv-d1-r2/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Elige el almacén primero por la consistencia que necesitas',
            'Nunca uses KV para contadores ni saldos',
            'Mantén el sistema de registro en un solo lugar',
            'Pon los archivos en R2 y entrega URLs firmadas',
            'Llega a las bases de datos existentes a través de Hyperdrive',
            'Anota qué datos viven dónde y por qué',
        ];

        const STORES = [
            { store: 'KV', is: 'Clave-valor global', consistency: 'Eventual (los cambios pueden tardar hasta un minuto en verse en todas partes)', use: 'Configuración, feature flags, búsquedas de claves de API, listas cacheadas' },
            { store: 'D1', is: 'Base de datos SQLite', consistency: 'Fuerte en la primaria, réplicas de lectura opcionales', use: 'Datos relacionales propios del edge: inquilinos, ajustes, apps pequeñas' },
            { store: 'R2', is: 'Objetos compatibles con S3', consistency: 'Fuerte por objeto', use: 'Subidas, exportaciones, facturas en PDF, copias de seguridad. Sin costes de salida' },
            { store: 'Durable Objects', is: 'Una instancia con estado por ID', consistency: 'Fuerte, de un solo hilo', use: 'Contadores, bloqueos, sesiones, coordinación por inquilino' },
            { store: 'Hyperdrive', is: 'Acceso con pool a tu Postgres/MySQL', consistency: 'La de tu base de datos', use: 'Sistemas de registro existentes, bases de datos alojadas en IaaS' },
        ];

        const Content = () => (
            <>
                <P>
                    Las funciones no tienen estado, así que toda plataforma serverless acaba haciéndose la misma pregunta: <em>¿dónde viven
                    los datos?</em> Cloudflare ofrece varios almacenes y no son intercambiables. Elegir por costumbre («siempre usamos una base
                    de datos») o por novedad («KV es rápido») es como las plataformas acaban con precios desactualizados o condiciones de
                    carrera. Elige según lo que necesitan los datos, y la consistencia va primero.
                </P>

                <H2>Las opciones de un vistazo</H2>
                <Table
                    columns={[{ key: 'store', label: 'Almacén', accent: true }, { key: 'is', label: 'Qué es' }, { key: 'consistency', label: 'Consistencia' }, { key: 'use', label: 'Úsalo para' }]}
                    rows={STORES}
                />

                <H2>Un camino de decisión</H2>
                <UL items={[
                    <><strong className="text-gray-900">¿Es un archivo o un blob?</strong> R2. Guarda la clave en una base de datos, nunca los bytes.</>,
                    <><strong className="text-gray-900">¿Todos los lectores deben ver la última escritura al instante</strong> (stock, saldo, un bloqueo)? Un Durable Object, D1 o tu base de datos actual. Nunca KV.</>,
                    <><strong className="text-gray-900">¿Se lee constantemente y cambia poco?</strong> KV, con el sistema de registro en otro sitio.</>,
                    <><strong className="text-gray-900">¿Ya vive en una base de datos que operas hoy?</strong> Déjalo ahí y conéctate a través de Hyperdrive. Muévelo solo si hay un motivo.</>,
                    <><strong className="text-gray-900">¿Son datos relacionales propios de la capa edge</strong> (inquilinos, claves de API, ajustes)? D1.</>,
                ]} />

                <H2>KV: lecturas rápidas, acuerdo lento</H2>
                <P>
                    KV está hecho para leer. Los valores se cachean en las ubicaciones donde se leen, así que una consulta suele ser muy
                    rápida. El precio es que una escritura puede tardar un rato en verse en todas partes. Eso está bien para buscar una clave
                    de API o un feature flag, y es peligroso para cualquier cosa que se incremente o decremente.
                </P>
                <CodeBlock title="Búsqueda de clave de API con alternativa">{`let key = await env.API_KEYS.get(hash, 'json');
if (!key) {
  // Aún no está en KV (clave nueva) o nunca existió: pregunta una vez al sistema de registro.
  key = await env.DB.prepare('SELECT tenant, plan, revoked FROM api_keys WHERE hash = ?')
    .bind(hash).first();
  if (key) ctx.waitUntil(env.API_KEYS.put(hash, JSON.stringify(key), { expirationTtl: 300 }));
}`}</CodeBlock>
                <Callout title="La revocación necesita un plan">
                    Si una clave revocada está cacheada en KV durante cinco minutos, sigue funcionando hasta cinco minutos. Usa TTL cortos
                    para los valores sensibles para la seguridad, o consulta un Durable Object para las revocaciones cuando el riesgo
                    justifique la llamada extra.
                </Callout>

                <H2>D1 y Durable Objects para los datos que deben coincidir</H2>
                <P>
                    D1 es SQLite gestionado por otros, ideal para los datos de los que es dueña la capa de plataforma: inquilinos, planes,
                    ajustes de conectores. Una base de datos D1 tiene un límite de tamaño (unos 10 GB en el momento de escribir esto) y está
                    pensada para dividirse horizontalmente, por ejemplo una base de datos por inquilino. Los Durable Objects van más allá: cada
                    objeto es una instancia, en un lugar, que atiende una petición cada vez, lo que hace trivial acertar con contadores y bloqueos.
                </P>
                <CodeBlock title="Un contador por inquilino en un Durable Object">{`export class TenantUsage extends DurableObject {
  async increment(units: number) {
    const used = ((await this.ctx.storage.get<number>('used')) ?? 0) + units;
    await this.ctx.storage.put('used', used);
    return used;     // sin carreras: las peticiones a un objeto se ejecutan de una en una
  }
}`}</CodeBlock>

                <H2>R2 para archivos, sin costes de salida</H2>
                <P>
                    R2 habla la API de S3, así que los SDK y herramientas existentes funcionan sin cambios, y no cobra por los datos
                    transferidos hacia fuera. En plataformas de integración que mueven muchas exportaciones, facturas e imágenes entre
                    sistemas, eso elimina una de las partidas más grandes de una factura típica de IaaS. Deja que los clientes suban y
                    descarguen directamente con URLs prefirmadas, para que los archivos nunca pasen por la memoria de un Worker.
                </P>

                <H2>Hyperdrive: conserva la base de datos que ya tienes</H2>
                <P>
                    Muchos clientes ya tienen una base de datos Postgres o MySQL en una VM o en un servicio gestionado en la nube, y es el
                    sistema de registro por buenos motivos. Abrir una conexión nueva desde cada invocación de función la agotaría enseguida.
                    <strong className="text-gray-900"> Hyperdrive</strong> mantiene un pool de conexiones cerca de la base de datos y permite
                    a los Workers usar un driver normal contra ella. Combinado con Cloudflare Tunnel, la base de datos ni siquiera necesita
                    una IP pública. Ese patrón se trata en <A href="/academia/edge-serverless/edge-x-iaas-hibrido/">Edge × IaaS (híbrido)</A>.
                </P>
                <CodeBlock title="Postgres a través de Hyperdrive">{`import postgres from 'postgres';

export default {
  async fetch(request, env) {
    const sql = postgres(env.HYPERDRIVE.connectionString);
    const rows = await sql\`SELECT id, name, price FROM catalog.products WHERE active LIMIT 50\`;
    return Response.json(rows);
  },
};`}</CodeBlock>

                <H2>Medirlo</H2>
                <P>
                    Controla la latencia de lectura por almacén, la tasa de aciertos de KV, la latencia de las consultas y el uso del pool de
                    Hyperdrive, y el almacenamiento y las operaciones de R2 por inquilino. Lo más importante: mantén un mapa de datos sencillo
                    con cada entidad, su sistema de registro y sus copias. La mayoría de los bugs de almacenamiento en plataformas serverless
                    vienen de dos lugares que creen ser dueños de los mismos datos, la misma regla que la{' '}
                    <A href="/academia/nucleo-modular/propiedad-datos-migraciones/">propiedad de datos</A> en el núcleo.
                </P>

                <Callout title="Siguiente paso">
                    Con el estado resuelto, la plataforma puede ejecutar trabajo según su propio calendario. <A href="/academia/edge-serverless/tareas-programadas-cron/">Tareas
                    programadas</A> sustituye el servidor de sincronización siempre encendido.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
