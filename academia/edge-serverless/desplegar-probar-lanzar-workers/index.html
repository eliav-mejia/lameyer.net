<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desplegar, probar y lanzar - Academia Lameyer</title>
    <meta name="description" content="Un pipeline de publicación para Cloudflare Workers: ejecución local sobre el runtime real, tests con Vitest, entornos de staging y producción, despliegues graduales y rollback con un solo comando.">
    <link rel="canonical" href="https://lameyer.net/academia/edge-serverless/desplegar-probar-lanzar-workers/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Ejecuta y prueba en local sobre workerd, el mismo runtime que producción',
            'Mantén staging y producción como entornos con nombre en una sola configuración',
            'Despliega solo desde CI, nunca desde un portátil',
            'Aplica las migraciones de base de datos antes que el código que las necesita',
            'Publica primero para un porcentaje pequeño y después amplía',
            'Conoce el comando de rollback antes de necesitarlo',
        ];

        const PIPELINE = [
            { stage: 'Local', command: 'wrangler dev', gate: 'Se ejecuta sobre workerd con KV, D1 y R2 locales' },
            { stage: 'Tests', command: 'vitest run', gate: 'Tests unitarios y de integración dentro del runtime de Workers' },
            { stage: 'Staging', command: 'wrangler deploy --env staging', gate: 'Smoke tests contra bindings reales' },
            { stage: 'Canary', command: 'wrangler versions deploy (10 %)', gate: 'La tasa de errores y la latencia se mantienen estables' },
            { stage: 'Producción', command: 'wrangler versions deploy (100 %)', gate: 'Rollback listo: wrangler rollback' },
        ];

        const Content = () => (
            <>
                <P>
                    Serverless elimina los servidores, no los errores. Un mal despliegue llega a todas las ubicaciones de Cloudflare en
                    segundos, algo estupendo para los arreglos y terrible para los bugs. La respuesta no es desplegar menos, sino hacer que
                    cada despliegue sea pequeño, probado y reversible. Este artículo cierra la serie con el{' '}
                    <strong className="text-gray-900">pipeline de publicación</strong> del que dependen todas las demás piezas.
                </P>

                <H2>El pipeline de un vistazo</H2>
                <Table
                    columns={[{ key: 'stage', label: 'Etapa' }, { key: 'command', label: 'Comando', accent: true }, { key: 'gate', label: 'Barrera que superar' }]}
                    rows={PIPELINE}
                />

                <H2>Prueba sobre el runtime real</H2>
                <P>
                    Node.js no es el runtime de Workers: faltan algunas APIs y otras se comportan de forma distinta. El pool de Vitest para
                    Workers ejecuta tus tests dentro de workerd con bindings reales, así que un test que pasa en local pasa en producción por
                    los mismos motivos.
                </P>
                <CodeBlock title="test/gateway.test.ts">{`import { SELF, env } from 'cloudflare:test';
import { describe, it, expect } from 'vitest';

describe('gateway', () => {
  it('answers health checks', async () => {
    const res = await SELF.fetch('https://example.com/health');
    expect(res.status).toBe(200);
  });

  it('rejects requests without a token', async () => {
    const res = await SELF.fetch('https://example.com/v1/orders', { method: 'POST' });
    expect(res.status).toBe(401);
  });

  it('reads config from KV', async () => {
    await env.CONFIG.put('maintenance', 'false');
    const res = await SELF.fetch('https://example.com/v1/status');
    expect(await res.json()).toMatchObject({ maintenance: false });
  });
});`}</CodeBlock>

                <H2>Una configuración, dos entornos</H2>
                <P>
                    Staging y producción viven en el mismo <Code>wrangler.jsonc</Code> como entornos con nombre, cada uno con sus propios
                    bindings. Los secretos se definen por entorno (<Code>wrangler secret put API_TOKEN --env staging</Code>) y nunca se suben
                    al repositorio. Como ambos entornos salen de un único archivo, no pueden divergir en silencio.
                </P>
                <CodeBlock title="wrangler.jsonc">{`{
  "name": "gateway",
  "main": "src/index.ts",
  "compatibility_date": "2026-09-01",
  "kv_namespaces": [{ "binding": "CONFIG", "id": "<prod-namespace-id>" }],
  "env": {
    "staging": {
      "name": "gateway-staging",
      "routes": [{ "pattern": "staging-api.example.com", "custom_domain": true }],
      "kv_namespaces": [{ "binding": "CONFIG", "id": "<staging-namespace-id>" }]
    }
  }
}`}</CodeBlock>

                <H2>Despliega desde CI, de forma gradual</H2>
                <P>
                    CI es el único lugar autorizado para desplegar. En cada push a <Code>main</Code> ejecuta los tests, aplica las migraciones
                    de D1, despliega en staging y después sube una nueva versión de producción sin enviarle tráfico. Los despliegues graduales
                    reparten el tráfico entre la versión antigua y la nueva por porcentaje, así que un bug llega a uno de cada diez usuarios,
                    no a todos.
                </P>
                <CodeBlock title=".github/workflows/deploy.yml">{`name: deploy
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx vitest run
      - run: npx wrangler d1 migrations apply DB --remote --env staging
      - run: npx wrangler deploy --env staging
      - run: npx wrangler d1 migrations apply DB --remote
      # Sube la nueva versión; promuévela por pasos (10 % -> 100 %) tras revisar las métricas.
      - run: npx wrangler versions upload`}</CodeBlock>
                <Callout title="Primero las migraciones, y compatibles hacia atrás">
                    Durante un despliegue gradual, el código antiguo y el nuevo se ejecutan a la vez contra la misma base de datos. Haz que
                    cada migración sea aditiva (columna nueva, tabla nueva) para que la versión antigua siga funcionando; elimina la columna
                    antigua en un lanzamiento posterior, cuando ninguna versión la use. La misma regla aparece en{' '}
                    <A href="/academia/nucleo-modular/propiedad-datos-migraciones/">Propiedad de datos y migraciones</A>.
                </Callout>

                <H2>Hacer rollback</H2>
                <UL items={[
                    <><strong className="text-gray-900">Promueve por pasos:</strong> <Code>wrangler versions deploy</Code> te permite enviar el 10 %, después el 50 % y después el 100 % del tráfico a la nueva versión.</>,
                    <><strong className="text-gray-900">Vigila las cifras correctas:</strong> tasa de errores y latencia P95 por versión, de <A href="/academia/edge-serverless/logs-trazas-costes/">Logs, trazas y costes</A>.</>,
                    <><strong className="text-gray-900">Rollback en un comando:</strong> <Code>wrangler rollback</Code> devuelve el tráfico a la versión anterior en segundos.</>,
                    <><strong className="text-gray-900">Feature flags para las partes arriesgadas:</strong> un flag en KV desactiva un camino de código nuevo sin ningún despliegue.</>,
                ]} />

                <H2>Medirlo</H2>
                <P>
                    Controla las cuatro métricas de entrega: frecuencia de despliegue, tiempo desde el commit hasta producción, tasa de
                    cambios fallidos y tiempo de recuperación. En una plataforma serverless sana los despliegues son diarios, el tiempo de
                    entrega es de menos de una hora y recuperar el servicio es un rollback que se mide en minutos.
                </P>

                <Callout title="De vuelta al mapa">
                    Con esto se completa el recorrido de la petición y la plataforma que lo rodea. Vuelve a la{' '}
                    <A href="/academia/edge-serverless/arquitectura-edge-serverless/">visión general de Edge Serverless</A> o mira la serie aplicada a
                    un negocio en <A href="/academia/edge-serverless/funciones-x-paas-integracion/">PaaS de integración</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
