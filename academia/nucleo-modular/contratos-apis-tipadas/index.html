<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos y APIs tipadas - Academia Lameyer</title>
    <meta name="description" content="Definir una sola vez los contratos de los módulos como esquemas y generar a partir de ellos tipos de TypeScript, validación en tiempo de ejecución y documentos OpenAPI con los que las funciones edge y los flujos construyen sus clientes.">
    <link rel="canonical" href="https://lameyer.net/academia/nucleo-modular/contratos-apis-tipadas/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Escribe un esquema por entrada, salida y error',
            'Deriva los tipos del esquema, nunca a mano',
            'Valida en cada límite que cruza una red',
            'Devuelve los errores esperados como valores, no como excepciones',
            'Publica OpenAPI para cada módulo expuesto por HTTP',
            'Genera los clientes del edge y de los flujos en CI',
        ];

        const CALLERS = [
            { caller: 'Otro módulo (mismo proceso)', form: 'Import de TypeScript desde index.ts', check: 'En compilación' },
            { caller: 'Función edge (Worker)', form: 'Cliente generado a partir de OpenAPI', check: 'En compilación + esquema en el edge' },
            { caller: 'Flujo / consumidor de cola', form: 'Esquema del mensaje (JSON Schema)', check: 'Validación al consumir' },
            { caller: 'Integración externa', form: 'Documento OpenAPI + API Shield', check: 'Validación de esquema en Cloudflare' },
        ];

        const Content = () => (
            <>
                <P>
                    Un límite de módulo dice <em>dónde</em> está la puerta. Un <strong className="text-gray-900">contrato</strong> dice
                    exactamente qué puede pasar por ella: qué entradas se aceptan, qué se devuelve y qué errores pueden ocurrir. En un núcleo
                    modular, el mismo contrato tiene que servir a consumidores muy distintos: otros módulos en el mismo proceso, funciones
                    edge por HTTP, flujos que leen de una cola. El objetivo es escribirlo una vez y generar todo lo demás.
                </P>

                <H2>Un esquema, cuatro tipos de consumidor</H2>
                <Table
                    columns={[{ key: 'caller', label: 'Consumidor' }, { key: 'form', label: 'Forma del contrato' }, { key: 'check', label: 'Se comprueba', accent: true }]}
                    rows={CALLERS}
                />

                <H2>Primero el esquema, después los tipos</H2>
                <P>
                    Las interfaces de TypeScript escritas a mano desaparecen en tiempo de ejecución, así que no pueden validar una petición
                    que llega por la red. Una librería de esquemas como Zod (o Valibot, TypeBox, JSON Schema) te da las dos cosas: un
                    validador en tiempo de ejecución y un tipo estático derivado de él.
                </P>
                <CodeBlock title="core/billing/contract.ts">{`import { z } from 'zod';

export const InvoiceLine = z.object({
  sku: z.string().min(1),
  quantity: z.number().int().positive(),
  unitPrice: z.object({ amount: z.number().int(), currency: z.enum(['USD', 'EUR', 'MXN']) }),
});

export const CreateInvoiceInput = z.object({
  customerId: z.string().uuid(),
  lines: z.array(InvoiceLine).min(1).max(500),
  idempotencyKey: z.string().min(8),
});

export const Invoice = CreateInvoiceInput.omit({ idempotencyKey: true }).extend({
  id: z.string().uuid(),
  status: z.enum(['draft', 'issued', 'void']),
  total: InvoiceLine.shape.unitPrice,
});

export type CreateInvoiceInput = z.infer<typeof CreateInvoiceInput>;
export type Invoice = z.infer<typeof Invoice>;`}</CodeBlock>
                <P>
                    Fíjate en <Code>idempotencyKey</Code>: todo lo que un flujo pueda reintentar debe poder llamarse dos veces sin peligro.
                    El contrato es el lugar adecuado para convertirlo en un requisito en lugar de una convención.
                </P>

                <H2>Los errores forman parte del contrato</H2>
                <P>
                    Si un consumidor solo puede enterarse de <Code>CUSTOMER_BLOCKED</Code> leyendo la implementación, no forma parte del
                    contrato. Los fallos de negocio esperados deberían ser valores de retorno tipados. Las excepciones son para bugs y caídas.
                </P>
                <CodeBlock title="core/billing/contract.ts (continuación)">{`export const BillingError = z.discriminatedUnion('code', [
  z.object({ code: z.literal('CUSTOMER_NOT_FOUND'), customerId: z.string() }),
  z.object({ code: z.literal('CUSTOMER_BLOCKED'), reason: z.string() }),
  z.object({ code: z.literal('CURRENCY_MISMATCH') }),
]);

export type Result<T, E> = { ok: true; value: T } | { ok: false; error: E };

export interface Billing {
  createInvoice(input: CreateInvoiceInput): Promise<Result<Invoice, z.infer<typeof BillingError>>>;
}`}</CodeBlock>
                <P>
                    Por HTTP, cada código de error se corresponde con un estado (<Code>404</Code>, <Code>409</Code>, <Code>422</Code>) y un
                    cuerpo <Code>application/problem+json</Code>, para que las funciones edge puedan manejarlos sin adivinar.
                </P>

                <H2>Del esquema a OpenAPI</H2>
                <P>
                    Para los módulos que el edge o las integraciones llaman por HTTP, genera un documento OpenAPI a partir de los mismos
                    esquemas, por ejemplo con <Code>zod-to-openapi</Code> o con el soporte integrado de tu framework (Hono, Fastify, NestJS).
                    El documento es una salida del build que se sube al repositorio, así que cada cambio aparece en la revisión de código.
                </P>
                <CodeBlock title="Paso de build">{`pnpm --filter @core/billing gen:openapi   # escribe contracts/billing.openapi.yaml
pnpm --filter @edge/api gen:client        # openapi-typescript -> cliente fetch tipado`}</CodeBlock>
                <CodeBlock title="edge/api/src/invoices.ts">{`import createClient from 'openapi-fetch';
import type { paths } from '@contracts/billing';

const core = createClient<paths>({ baseUrl: env.CORE_URL });

const { data, error } = await core.POST('/invoices', {
  body: { customerId, lines, idempotencyKey: crypto.randomUUID() },
});
// Renombrar "lines" en el núcleo ahora rompe este build, no producción.`}</CodeBlock>

                <H2>El mismo documento protege la API</H2>
                <P>
                    El archivo OpenAPI tiene un segundo trabajo. Súbelo a la <A href="/academia/seguridad-apis/proteccion-endpoints-api/">validación de
                    esquema de Cloudflare API Shield</A> y las peticiones que no encajen con el contrato se rechazarán en el edge antes de
                    llegar al núcleo. Un solo archivo controla ahora los tipos, la documentación, la generación de clientes y la seguridad.
                </P>

                <H2>Mantén los contratos pequeños</H2>
                <UL items={[
                    <><strong className="text-gray-900">Expón intenciones, no tablas.</strong> <Code>issueInvoice(id)</Code>, no <Code>updateInvoice({'{ status }'})</Code>. Los consumidores no deberían necesitar conocer la máquina de estados.</>,
                    <><strong className="text-gray-900">Devuelve lo que necesitan los consumidores.</strong> Cada campo extra es algo más que nunca podrás quitar sin una versión mayor.</>,
                    <><strong className="text-gray-900">Nada de IDs ni flags internos.</strong> Los números de secuencia de la base de datos y los feature flags filtran la implementación y la congelan.</>,
                ]} />

                <Callout title="Dónde viven los contratos">
                    Los esquemas y los clientes generados los comparten varios desplegables, así que van en paquetes del workspace, que se
                    tratan a continuación en <A href="/academia/nucleo-modular/paquetes-compartidos-espacios-trabajo/">Paquetes compartidos y espacios de trabajo</A>. Cómo
                    cambiar un contrato sin romper a sus consumidores es el tema de{' '}
                    <A href="/academia/nucleo-modular/pruebas-contrato-versionado/">Pruebas de contrato y versionado</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
