<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paquetes compartidos y espacios de trabajo - Academia Lameyer</title>
    <meta name="description" content="Mover el código compartido a paquetes del workspace con exports y responsables explícitos, usando pnpm workspaces y Turborepo para construir solo lo que tocó un cambio.">
    <link rel="canonical" href="https://lameyer.net/academia/nucleo-modular/paquetes-compartidos-espacios-trabajo/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Elimina la carpeta utils/, un paquete cada vez',
            'Da a cada paquete un único propósito y un responsable',
            'Declara los puntos de entrada públicos en el campo exports',
            'Usa workspace:* para las dependencias internas',
            'Construye y prueba en CI solo los paquetes afectados',
            'Registra los cambios con changesets',
        ];

        const KINDS = [
            { pkg: '@acme/kernel', holds: 'Dinero, IDs, fechas, tipo Result', rule: 'Diminuto y estable. Los cambios necesitan revisión de arquitectura.' },
            { pkg: '@contracts/billing', holds: 'Esquemas + tipos OpenAPI generados', rule: 'Propiedad del equipo del módulo billing.' },
            { pkg: '@acme/logger', holds: 'Logging estructurado con IDs de petición', rule: 'Funciona en Node y en Workers.' },
            { pkg: '@acme/config', holds: 'ESLint, tsconfig, reglas de dependencias', rule: 'Solo para desarrollo. Nunca se importa en ejecución.' },
        ];

        const Content = () => (
            <>
                <P>
                    Toda base de código acaba creando una carpeta <Code>utils/</Code> o <Code>common/</Code>. Empieza con un formateador de
                    fechas y termina siendo el código más importado y con menos dueño del sistema, donde cambiar un helper vuelve a desplegarlo
                    todo. En un núcleo modular el código compartido sigue existiendo, pero vive en <strong className="text-gray-900">paquetes
                    del workspace</strong>: unidades pequeñas, con nombre y responsable, con una API pública explícita y versionadas en el mismo
                    repositorio que los módulos que las usan.
                </P>

                <H2>Qué merece ser un paquete</H2>
                <P>
                    Comparte código solo cuando dos o más desplegables (el núcleo, un Worker del edge, un consumidor de flujos) necesitan de
                    verdad el mismo comportamiento. Paquetes típicos en un repositorio MC-SE:
                </P>
                <Table
                    columns={[{ key: 'pkg', label: 'Paquete', mono: true }, { key: 'holds', label: 'Contiene' }, { key: 'rule', label: 'Regla' }]}
                    rows={KINDS}
                />
                <Callout title="Duplicar es más barato que la abstracción equivocada">
                    Que dos módulos tengan código parecido no es motivo para crear un paquete. Si el código cambia por motivos de negocio
                    distintos, conserva las copias. Comparte solo lo que debe seguir siendo idéntico, como el redondeo de importes o un esquema de contrato.
                </Callout>

                <H2>Estructura del workspace</H2>
                <CodeBlock title="Repositorio">{`.
├── pnpm-workspace.yaml
├── turbo.json
├── apps/
│   ├── core/              # el monolito modular (billing, catalog, accounts...)
│   ├── edge-api/          # Worker de Cloudflare delante del núcleo
│   └── workflows/         # consumidores de colas y flujos duraderos
└── packages/
    ├── kernel/
    ├── logger/
    ├── config/
    └── contracts/
        ├── billing/
        └── catalog/`}</CodeBlock>
                <CodeBlock title="pnpm-workspace.yaml">{`packages:
  - "apps/*"
  - "packages/*"
  - "packages/contracts/*"`}</CodeBlock>

                <H2>Los exports explícitos mantienen honestos a los paquetes</H2>
                <P>
                    El campo <Code>exports</Code> de <Code>package.json</Code> hace con los paquetes lo que <Code>index.ts</Code> hace con los
                    módulos: lo que no aparece en la lista no se puede importar, ni desde Node, ni desde los bundlers, ni desde TypeScript (con{' '}
                    <Code>moduleResolution: "bundler"</Code> o <Code>"node16"</Code>).
                </P>
                <CodeBlock title="packages/kernel/package.json">{`{
  "name": "@acme/kernel",
  "version": "1.4.0",
  "type": "module",
  "exports": {
    ".":       { "types": "./dist/index.d.ts", "default": "./dist/index.js" },
    "./money": { "types": "./dist/money.d.ts", "default": "./dist/money.js" }
  },
  "sideEffects": false
}`}</CodeBlock>
                <CodeBlock title="apps/edge-api/package.json (extracto)">{`"dependencies": {
  "@acme/kernel": "workspace:*",
  "@contracts/billing": "workspace:*"
}`}</CodeBlock>
                <P>
                    <Code>workspace:*</Code> enlaza el paquete local, así que un cambio en un contrato y el código del edge que lo usa pueden
                    entrar en un solo pull request. Los Workers del edge tienen límites estrictos de tamaño del bundle, así que{' '}
                    <Code>sideEffects: false</Code> y unos puntos de entrada pequeños permiten al bundler descartar todo lo que el Worker no usa.
                </P>

                <H2>Construye solo lo que cambió</H2>
                <P>
                    La objeción habitual a un único repositorio es un CI lento. Un ejecutor de tareas como Turborepo (o Nx) conoce el grafo de
                    dependencias y cachea los resultados, así que un cambio en <Code>packages/logger</Code> solo reconstruye y prueba los
                    paquetes y apps que dependen de él.
                </P>
                <CodeBlock title="turbo.json">{`{
  "tasks": {
    "build": { "dependsOn": ["^build"], "outputs": ["dist/**"] },
    "test":  { "dependsOn": ["build"] },
    "lint":  {}
  }
}`}</CodeBlock>
                <CodeBlock title="CI">{`pnpm turbo run lint test build --filter="...[origin/main]"`}</CodeBlock>
                <P>
                    El filtro <Code>...[origin/main]</Code> significa «todo lo que cambió desde main, más todo lo que depende de ello». En un
                    pull request típico son unos pocos paquetes, no el repositorio entero.
                </P>

                <H2>Versiones y changelogs</H2>
                <P>
                    Los paquetes internos que solo se consumen dentro del repositorio no necesitan estrictamente número de versión, pero los
                    paquetes de contrato sí: las funciones edge desplegadas y las integraciones externas dependen de una versión concreta.{' '}
                    <Code>changesets</Code> pide a cada pull request que declare qué paquetes cambiaron y si el cambio es patch, minor o major,
                    y genera los changelogs a partir de ello.
                </P>
                <CodeBlock title=".changeset/brave-invoices-sing.md">{`---
"@contracts/billing": minor
---
Añade \`dueDate\` opcional a CreateInvoiceInput.`}</CodeBlock>

                <H2>Medir el progreso</H2>
                <UL items={[
                    <><strong className="text-gray-900">Tiempo de CI por pull request</strong>: debería bajar a medida que los builds de lo afectado sustituyen a los builds completos.</>,
                    <><strong className="text-gray-900">Líneas que quedan en utils/</strong>: deberían llegar a cero.</>,
                    <><strong className="text-gray-900">Código de validación duplicado</strong>: debería sustituirse por un paquete de contrato por módulo.</>,
                ]} />

                <Callout title="Siguiente paso">
                    Los paquetes comparten código, pero nunca deben compartir tablas. <A href="/academia/nucleo-modular/propiedad-datos-migraciones/">Propiedad
                    de datos y migraciones</A> explica cómo cada módulo es dueño de sus datos y cómo acceden a ellos los demás módulos.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
