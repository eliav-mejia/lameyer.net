<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Tunnel - Academia Lameyer</title>
    <meta name="description" content="Ocultar el origen de tu API y cerrar todos los puertos de entrada con la conexión solo de salida de Cloudflare Tunnel.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Ejecuta cloudflared junto a la API',
            'Haz que la API escuche solo en localhost',
            'Deniega todo el tráfico de entrada en el cortafuegos del host',
            'Termina las reglas de ingress con un 404 genérico',
            'Añade tokens de servicio de Access para los clientes máquina',
            'Cambia la IP del origen si alguna vez fue pública',
        ];

        const Content = () => (
            <>
                <P>
                    Todas las capas de esta serie protegen el tráfico que pasa por Cloudflare. Todas comparten un punto débil: si un
                    atacante averigua la IP real de tu servidor de origen, puede enviarle peticiones directamente y saltarse por
                    completo el{' '}
                    <a href="/academia/seguridad-apis/capa-edge-ddos-dns/" className="text-blue-600 font-bold hover:underline">edge</a>,
                    el WAF, API Shield y la limitación de tasa. Cloudflare Tunnel elimina esa posibilidad haciendo que el origen sea
                    inalcanzable desde internet.
                </P>

                <H2>De dentro hacia fuera en lugar de fuera hacia dentro</H2>
                <P>
                    Un servidor tradicional abre un puerto, como el 443, y espera a que internet se conecte. Con Cloudflare Tunnel,
                    un pequeño demonio llamado <Code>cloudflared</Code> se ejecuta junto a tu API y abre conexiones <strong className="text-gray-900">de salida</strong> hacia
                    varios centros de datos cercanos de Cloudflare. Las peticiones para tu hostname viajan por esas conexiones ya abiertas.
                    Nada se conecta nunca <em>a</em> tu servidor.
                </P>
                <UL items={[
                    'Puedes cerrar todos los puertos de entrada. No hay nada que escanear ni nada que inundar.',
                    'La IP de tu origen nunca aparece en el DNS. El hostname apunta al túnel, no al servidor.',
                    'Las conexiones son redundantes, así que perder un centro de datos no tumba la API.',
                ]} />

                <H2>Configurar un túnel</H2>
                <P>Después de instalar <Code>cloudflared</Code> en el servidor de la API:</P>
                <CodeBlock title="Terminal">{`cloudflared tunnel login
cloudflared tunnel create api-origin
cloudflared tunnel route dns api-origin api.example.com`}</CodeBlock>
                <P>Después indica al túnel adónde enviar el tráfico:</P>
                <CodeBlock title="~/.cloudflared/config.yml">{`tunnel: <TUNNEL-UUID>
credentials-file: /root/.cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: api.example.com
    service: http://localhost:8000
  # Todo lo demás recibe un 404 en lugar de llegar a un servicio
  - service: http_status:404`}</CodeBlock>
                <CodeBlock title="Terminal">{`cloudflared tunnel run api-origin`}</CodeBlock>
                <P>
                    También puedes crear y gestionar túneles desde el panel de Zero Trust, que te da un único comando de instalación
                    con un token y sin archivo de configuración.
                </P>

                <H2>Cierra las puertas al salir</H2>
                <P>Un túnel solo te protege si el antiguo acceso está realmente cerrado:</P>
                <UL items={[
                    <>Haz que la API escuche en <Code>127.0.0.1</Code>, no en <Code>0.0.0.0</Code>, para que solo acepte conexiones de <Code>cloudflared</Code> en la misma máquina.</>,
                    <>Configura el cortafuegos del host o de la nube para denegar todo el tráfico de entrada. <Code>cloudflared</Code> solo necesita acceso de salida, por el puerto 7844.</>,
                    'Si el servidor tuvo alguna vez un registro DNS público, muévelo a una IP nueva. Los registros DNS históricos aún pueden revelar la antigua.',
                ]} />

                <Callout title="Autentica máquinas, no solo personas">
                    Pon una política de Cloudflare Access delante del hostname de la API y emite <strong>tokens de servicio</strong> para
                    tus clientes de la API. Cada cliente envía las cabeceras <Code>CF-Access-Client-Id</Code> y <Code>CF-Access-Client-Secret</Code>,
                    y Cloudflare rechaza todo lo que no tenga un token válido antes de que entre en el túnel.
                </Callout>

                <H2>El recorrido completo</H2>
                <P>
                    Con el túnel en marcha, el único camino hacia tu API atraviesa todas las capas: protección DDoS y DNS en el edge,
                    filtrado WAF y de bots, validación de esquema, limitación de tasa y, por último, el propio túnel. Un atacante que quiera
                    tus datos tiene que superar las cinco.{' '}
                    <a href="/academia/" className="text-blue-600 font-bold hover:underline">Vuelve al panel</a> para repasar cualquier capa.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
