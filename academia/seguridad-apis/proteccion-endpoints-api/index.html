<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protección de endpoints de API - Academia Lameyer</title>
    <meta name="description" content="Proteger la lógica de negocio de una API con Cloudflare API Shield: descubrimiento de endpoints, validación de esquema y mTLS.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Revisa los endpoints descubiertos y añádelos a Endpoint Management',
            'Retira o documenta cada API en la sombra',
            'Sube un esquema OpenAPI v3',
            'Ejecuta la validación de esquema en modo registro y después bloquea',
            'Emite certificados de cliente mTLS para los clientes conocidos de la API',
        ];

        const Content = () => (
            <>
                <P>
                    El <a href="/academia/seguridad-apis/capa-waf-bots-capa-7/" className="text-blue-600 font-bold hover:underline">WAF</a> sabe
                    cómo son los ataques en general. No sabe que tu endpoint <Code>/v1/orders</Code> solo acepta un cuerpo
                    JSON con un <Code>quantity</Code> numérico. Cloudflare API Shield cubre ese hueco. Es un conjunto de
                    defensas creado específicamente para el tráfico programático, y juzga cada petición según cómo se supone que
                    debe comportarse <em>tu</em> API.
                </P>

                <H2>Descubrimiento: no puedes proteger lo que no sabes que existe</H2>
                <P>
                    Las APIs acumulan endpoints con el tiempo: versiones antiguas que nadie retiró, rutas de depuración y
                    endpoints internos expuestos por accidente. Estas <strong className="text-gray-900">APIs en la sombra</strong> sin
                    documentar suelen ser la parte menos protegida de un sistema.
                </P>
                <P>
                    API Discovery analiza el tráfico que pasa por Cloudflare y construye un catálogo de los endpoints que realmente
                    se están llamando, incluidos los que faltan en tu documentación. Guardarlos en Endpoint Management te da
                    analíticas por endpoint y un lugar donde aplicar las protecciones que siguen.
                </P>

                <H2>Validación de esquema: descarta todo lo que no encaje</H2>
                <P>
                    Sube un esquema OpenAPI v3 que describa los métodos, parámetros y cuerpo de petición permitidos en cada endpoint.
                    Cloudflare compara cada petición con él y puede registrar o bloquear todo lo que no coincida. Por ejemplo:
                </P>
                <CodeBlock title="openapi.yaml (extracto)">{`paths:
  /v1/orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              additionalProperties: false
              properties:
                product_id: { type: string, maxLength: 36 }
                quantity:   { type: integer, minimum: 1, maximum: 100 }`}</CodeBlock>
                <P>
                    Con este esquema, una petición que envía <Code>quantity: -5</Code>, un <Code>product_id</Code> de 10.000 caracteres
                    o un campo extra <Code>is_admin</Code> nunca llega a tu código. Así es como la validación de esquema bloquea los
                    ataques a la lógica de negocio y frena los intentos de extraer datos mediante parámetros inesperados.
                </P>

                <H2>mTLS: demuestra quién es el cliente</H2>
                <P>
                    Las claves de API pueden filtrarse. El TLS mutuo añade un segundo factor que vive en el propio cliente: cada
                    cliente de confianza recibe un certificado emitido por una autoridad de certificación gestionada por Cloudflare, y
                    las peticiones sin un certificado válido se rechazan antes de que se ejecute ninguna lógica de la aplicación.
                </P>
                <CodeBlock title="Regla personalizada · acción: Block">{`(http.host eq "api.example.com"
 and not cf.tls_client_auth.cert_verified)`}</CodeBlock>
                <P>
                    mTLS funciona mejor cuando controlas los clientes: apps móviles, servidores de socios y dispositivos IoT. No es
                    adecuado para una API pública en la que cualquiera puede registrarse.
                </P>

                <Callout title="Disponibilidad según el plan">
                    Las funciones de API Shield están disponibles en distintos planes y varias son complementos de Enterprise.
                    Consulta la sección Security de tu panel de Cloudflare para ver cuáles incluye tu zona.
                </Callout>

                <H2>Dónde se detiene API Shield</H2>
                <P>
                    Una petición puede ser perfectamente válida y aun así abusiva si llega miles de veces por minuto. Controlar el
                    volumen por cliente es trabajo del{' '}
                    <a href="/academia/seguridad-apis/limitacion-de-tasa/" className="text-blue-600 font-bold hover:underline">limitación de tasa</a>.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
