<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSR y generación estática - Academia Lameyer</title>
    <meta name="description" content="Renderizado en servidor y generación estática: por qué las páginas que solo se renderizan en el cliente son frágiles para los rastreadores de búsqueda e IA, y cómo prerenderizar un sitio React en build.">
    <link rel="canonical" href="https://lameyer.net/academia/busqueda-visibilidad/ssr-generacion-estatica/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Comprueba lo que devuelve curl, no lo que muestra el navegador',
            'Prerenderiza las páginas de contenido en build',
            'Compila el JSX en build, no en el navegador',
            'Hidrata en lugar de renderizar desde cero',
            'Pon el título, la descripción y la canónica en el HTML',
            'Verifica con la inspección de URLs de Search Console',
        ];

        const MODES = [
            { mode: 'CSR', html: 'Una carcasa vacía; JavaScript construye la página', when: 'Apps con sesión y paneles que no deben indexarse' },
            { mode: 'SSR', html: 'HTML completo renderizado en cada petición', when: 'Contenido que cambia en cada petición o muy a menudo' },
            { mode: 'SSG', html: 'HTML completo renderizado una vez, en build', when: 'Blogs, documentación y páginas de aterrizaje' },
            { mode: 'Incremental / bajo demanda', html: 'HTML estático, reconstruido por página cuando cambia el contenido', when: 'Catálogos grandes donde reconstruir todo es lento' },
        ];

        const Content = () => (
            <>
                <P>
                    Abre esta página y después mira su código fuente. Encontrarás <Code>{'<div id="root"></div>'}</Code> y unas cuantas
                    etiquetas script. Todo lo que estás leyendo se construyó en tu navegador: Babel compiló el JSX y después React lo
                    renderizó. A ti te funciona, pero para cualquier cosa que lea el HTML en bruto, esta página está casi vacía. Esta academia es
                    nuestro propio caso de estudio.
                </P>

                <H2>Quién ve la carcasa vacía</H2>
                <UL items={[
                    <><strong className="text-gray-900">Google</strong> sí ejecuta JavaScript, pero en un paso de renderizado separado, después del rastreo. El renderizado puede retrasarse y, si un script falla o agota el tiempo, el contenido nunca se ve.</>,
                    <><strong className="text-gray-900">Muchos otros rastreadores</strong>, incluidos muchos rastreadores de IA y algunos buscadores, solo leen el HTML que descargan y no ejecutan JavaScript.</>,
                    <><strong className="text-gray-900">Las vistas previas de enlaces</strong> en apps de chat y redes sociales leen las etiquetas Open Graph del HTML en bruto. Las etiquetas añadidas por JavaScript no se ven.</>,
                    <><strong className="text-gray-900">Los pipelines de embeddings</strong> que descargan páginas para construir un índice de búsqueda también suelen recibir la carcasa, salvo que ejecuten un navegador headless.</>,
                ]} />
                <P>Comprobarlo lleva un solo comando. Si el texto de tu artículo no está en la salida, los rastreadores que no ejecutan JavaScript tampoco lo verán:</P>
                <CodeBlock title="Lo que ve un rastreador que no renderiza">{`curl -s https://lameyer.net/academia/busqueda-visibilidad/ssr-generacion-estatica/ | grep -c "Quién ve la carcasa vacía"
# 0  -> el encabezado solo existe después de que se ejecute JavaScript`}</CodeBlock>

                <H2>Las opciones de renderizado</H2>
                <Table
                    columns={[{ key: 'mode', label: 'Modo', accent: true }, { key: 'html', label: 'Primera respuesta HTML' }, { key: 'when', label: 'Encaja bien en' }]}
                    rows={MODES}
                />
                <P>
                    Una academia no tiene contenido por usuario, así que la generación estática es la elección natural. El servidor sigue siendo
                    un simple alojamiento de archivos (GitHub Pages, Cloudflare Pages, un bucket de S3) y cada página llega completa.
                </P>

                <H2>Prerenderizar un sitio React existente</H2>
                <P>
                    No hace falta reescribir los componentes para adoptar un framework. Los mismos componentes se pueden renderizar a una
                    cadena en Node durante el build. Un build mínimo tiene tres pasos: compilar el JSX una vez, renderizar cada ruta a HTML y
                    escribir los archivos.
                </P>
                <CodeBlock title="scripts/prerender.mjs (esbozo)">{`import { build } from 'esbuild';
import { mkdir, readFile, writeFile } from 'node:fs/promises';

// 1. Compilar el JSX una vez en build en lugar de en el navegador de cada visitante
await build({ entryPoints: ['src/client.jsx'], bundle: true, minify: true, outfile: 'dist/js/academia.js' });
await build({ entryPoints: ['src/server.jsx'], bundle: true, platform: 'node', format: 'esm', outfile: 'build/server.mjs' });

// 2. Renderizar cada artículo a HTML (server.jsx llama a renderToString de react-dom/server)
const { ACADEMIA_POSTS, renderPostToString } = await import('../build/server.mjs');
const template = await readFile('src/template.html', 'utf8');

// 3. Escribir un index.html completo por artículo
for (const post of ACADEMIA_POSTS) {
  await mkdir('dist' + post.path, { recursive: true });
  const html = template.replace('<!--app-->', renderPostToString(post.path));
  await writeFile('dist' + post.path + 'index.html', html);
}`}</CodeBlock>
                <P>
                    En el navegador, llama a <Code>hydrateRoot</Code> en lugar de a <Code>createRoot</Code>. React conecta los manejadores de
                    eventos al HTML que ya existe en lugar de reconstruirlo, así que las partes interactivas, como los filtros de la academia,
                    siguen funcionando.
                </P>
                <Callout title="Un extra para la velocidad">
                    Compilar el JSX en build también elimina el compilador Babel del navegador, pensado para prototipos, no para producción.
                    Es una descarga grande y mucho trabajo en el hilo principal que dejas de pagar en cada visita. Consulta{' '}
                    <A href="/academia/busqueda-visibilidad/core-web-vitals-velocidad-pagina/">Core Web Vitals y velocidad de página</A>.
                </Callout>

                <H2>Pon también los metadatos en el HTML</H2>
                <P>
                    El <Code>{'<title>'}</Code>, la meta descripción, el enlace canónico, las etiquetas Open Graph y el JSON-LD deben estar en
                    el HTML generado. Esta academia escribe a mano el título y la descripción en el head de cada archivo, y por eso sobreviven.
                    Todo lo que se fija desde un efecto, como <Code>document.title</Code>, llega demasiado tarde para un rastreador que no renderiza.
                </P>

                <H2>Dónde se detiene el renderizado</H2>
                <P>
                    El HTML renderizado en servidor solo sirve si es HTML con significado. Los encabezados, landmarks y enlaces reales se
                    tratan en <A href="/academia/busqueda-visibilidad/marcado-html-semantico/">Marcado HTML semántico</A>. Y si ya generas cada página en build,
                    puedes construir un índice de búsqueda a partir de la misma salida:{' '}
                    <A href="/academia/busqueda-visibilidad/generacion-estatica-x-busqueda-vectorial/">Generación estática × búsqueda vectorial</A>.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
