<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreabilidad e indexación - Academia Lameyer</title>
    <meta name="description" content="Rastreabilidad e indexación: robots.txt, sitemaps XML, URLs canónicas, códigos de estado, rutas con hash y enlaces internos que deciden si las páginas se encuentran.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Enlaza cada página desde al menos otra página',
            'Usa rutas reales, no rutas con hash #/',
            'Publica sitemap.xml y referéncialo en robots.txt',
            'Escapa & como &amp; dentro del sitemap',
            'Define una única URL canónica absoluta por página',
            'Devuelve un estado 404 real para las páginas que no existen',
            'Usa noindex, no robots.txt, para dejar páginas fuera',
        ];

        const STEPS = [
            { step: 'Descubrir', how: 'Enlaces desde otras páginas, sitemaps', breaks: 'Páginas huérfanas, enlaces solo en JavaScript, rutas con hash' },
            { step: 'Rastrear', how: 'robots.txt lo permite y el servidor responde', breaks: 'Reglas Disallow, errores 5xx, respuestas lentas' },
            { step: 'Renderizar', how: 'Se procesa el HTML (y quizá el JavaScript)', breaks: 'Contenido solo en JS del cliente, scripts bloqueados' },
            { step: 'Indexar', how: 'La página se elige como versión canónica', breaks: 'Duplicados, noindex, soft 404, contenido escaso' },
        ];

        const Content = () => (
            <>
                <P>
                    Un buscador solo puede posicionar una página que ha encontrado, descargado y decidido conservar. Cada paso puede fallar
                    en silencio: la página funciona bien en tu navegador y simplemente nunca aparece en los resultados. Este artículo trata
                    la fontanería, con este sitio como ejemplo práctico.
                </P>

                <H2>Cuatro pasos, cuatro formas de fallar</H2>
                <Table
                    columns={[{ key: 'step', label: 'Paso', accent: true }, { key: 'how', label: 'Requiere' }, { key: 'breaks', label: 'Fallos habituales' }]}
                    rows={STEPS}
                />

                <H2>Descubrimiento: enlaces y URLs reales</H2>
                <P>
                    Los rastreadores encuentran páginas siguiendo enlaces <Code>{'<a href>'}</Code>. Una página a la que no enlaza ninguna
                    otra (una página <strong className="text-gray-900">huérfana</strong>) puede que solo se encuentre a través de un sitemap,
                    y recibe poco peso. El panel de la academia y los enlaces anterior/siguiente al final de cada artículo existen en parte por esto.
                </P>
                <P>
                    Las rutas con hash son una trampa habitual. Los buscadores ignoran la parte de la URL que va después de <Code>#</Code>, así
                    que <Code>/#/development</Code> y <Code>/#/stack</Code> son para ellos la misma URL: la página de inicio. Si el contenido
                    también vive en una ruta real como <Code>/pages/development/</Code>, enlaza a esa ruta.
                </P>

                <H2>robots.txt y sitemap.xml</H2>
                <P>
                    <Code>robots.txt</Code> dice qué pueden descargar los rastreadores; el sitemap enumera lo que quieres que encuentren.
                    Mantén el primero permisivo y el segundo completo:
                </P>
                <CodeBlock title="/robots.txt">{`User-agent: *
Allow: /

Sitemap: https://lameyer.net/sitemap.xml`}</CodeBlock>
                <CodeBlock title="/sitemap.xml (extracto)">{`<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://lameyer.net/academia/</loc>
    <lastmod>2026-10-02</lastmod>
  </url>
  <url>
    <loc>https://lameyer.net/academia/busqueda-visibilidad/rastreabilidad-indexacion/</loc>
    <lastmod>2026-10-02</lastmod>
  </url>
</urlset>`}</CodeBlock>
                <Callout title="Nombres de carpeta con & y paréntesis">
                    Algunas rutas pueden contener <Code>&</Code>, <Code>(</Code> y <Code>)</Code>. Son válidos en las URLs, pero un sitemap es
                    XML, así que <Code>&</Code> debe escribirse como <Code>&amp;amp;</Code> o el archivo entero no se podrá analizar. Genera el
                    sitemap a partir de <Code>ACADEMIA_POSTS</Code> con un escape XML correcto en lugar de escribirlo a mano.
                </Callout>

                <H2>URLs canónicas: una página, una dirección</H2>
                <P>
                    El mismo contenido suele estar disponible en varias URLs: con y sin barra final, con parámetros de seguimiento o con
                    parámetros de filtro como <Code>/academia/?type=crawl</Code>. Un enlace canónico indica la versión preferida:
                </P>
                <CodeBlock title="En el head de cada página">{`<link rel="canonical" href="https://lameyer.net/academia/busqueda-visibilidad/rastreabilidad-indexacion/">`}</CodeBlock>
                <P>
                    Usa URLs absolutas y sé coherente con las barras finales. Para las páginas de filtros en concreto, consulta{' '}
                    <A href="/academia/busqueda-visibilidad/rastreabilidad-x-busqueda-facetas/">Rastreabilidad × búsqueda por facetas</A>.
                </P>

                <H2>Códigos de estado y soft 404</H2>
                <P>
                    Una página que no existe debe devolver HTTP 404. Las single-page apps suelen servir su carcasa con estado 200 para
                    cualquier ruta y después muestran «No encontrado» con JavaScript. Los buscadores lo tratan como un soft 404 y pueden
                    malgastar rastreos en él. Los alojamientos estáticos como GitHub Pages devuelven un 404 real con tu <Code>404.html</Code>,
                    siempre que no dirijas todas las rutas a un único archivo.
                </P>

                <H2>Dejar páginas fuera del índice</H2>
                <P>
                    <Code>Disallow</Code> en robots.txt impide el rastreo, no la indexación: una URL bloqueada aún puede aparecer en los
                    resultados si otros sitios enlazan a ella, y el rastreador no puede ver una etiqueta <Code>noindex</Code> en una página
                    que no puede descargar. Para dejar una página fuera, permite el rastreo y añade{' '}
                    <Code>{'<meta name="robots" content="noindex">'}</Code>.
                </P>

                <H2>Comprueba, no adivines</H2>
                <P>
                    La herramienta de inspección de URLs de Search Console muestra si una URL está indexada, qué canónica eligió Google y
                    cómo era el HTML renderizado. El informe de indexación de páginas enumera cada URL excluida con el motivo. Una vez que
                    las páginas se indexan, los <A href="/academia/busqueda-visibilidad/datos-estructurados/">datos estructurados</A> ayudan a los buscadores a
                    entender qué es cada una.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
