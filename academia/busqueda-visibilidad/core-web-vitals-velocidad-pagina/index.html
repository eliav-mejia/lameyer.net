<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Web Vitals y velocidad de página - Academia Lameyer</title>
    <meta name="description" content="Core Web Vitals para sitios de documentación y para desarrolladores: umbrales de LCP, INP y CLS, datos de campo frente a datos de laboratorio y las causas habituales de las páginas lentas.">
    <link rel="canonical" href="https://lameyer.net/academia/busqueda-visibilidad/core-web-vitals-velocidad-pagina/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Juzga las páginas por los datos de campo en el percentil 75',
            'Haz que el elemento LCP forme parte del HTML inicial',
            'Construye el CSS y el JS por adelantado',
            'Usa preconnect hacia los orígenes de fuentes y recursos',
            'Da dimensiones explícitas a imágenes y embeds',
            'Divide las tareas largas del hilo principal en otras más pequeñas',
        ];

        const VITALS = [
            { metric: 'LCP', name: 'Largest Contentful Paint', good: '≤ 2,5 s', poor: '> 4 s', measures: 'Cuándo aparece el contenido principal (la imagen o el bloque de texto más grande).' },
            { metric: 'INP', name: 'Interaction to Next Paint', good: '≤ 200 ms', poor: '> 500 ms', measures: 'Lo rápido que responde la página a clics, toques y pulsaciones de teclas.' },
            { metric: 'CLS', name: 'Cumulative Layout Shift', good: '≤ 0,1', poor: '> 0,25', measures: 'Cuánto se mueve inesperadamente el contenido visible.' },
        ];

        const Content = () => (
            <>
                <P>
                    La documentación para desarrolladores se lee con prisa, a menudo en un portátil conectado al móvil. Una página que
                    muestra una pantalla en blanco durante tres segundos o que salta mientras carga pierde lectores, y la experiencia de
                    página es una de las muchas señales que tienen en cuenta los buscadores. Las Core Web Vitals son las tres métricas de
                    Google para esa experiencia.
                </P>

                <H2>Las tres métricas</H2>
                <Table
                    columns={[{ key: 'metric', label: 'Métrica', accent: true }, { key: 'measures', label: 'Qué mide' }, { key: 'good', label: 'Buena', accent: true }, { key: 'poor', label: 'Mala' }]}
                    rows={VITALS}
                />
                <P>
                    Una página aprueba cuando al menos el 75 % de las visitas reales son «buenas» en las tres. INP sustituyó a First Input
                    Delay (FID) como Core Web Vital en marzo de 2024. A diferencia de FID, tiene en cuenta todas las interacciones de la
                    visita, no solo la primera.
                </P>

                <H2>Datos de campo frente a datos de laboratorio</H2>
                <P>
                    Lighthouse ejecuta una única carga simulada en un dispositivo. Es útil para depurar, pero no es lo que viven los
                    usuarios. Los datos de campo proceden de visitas reales: el Chrome UX Report (CrUX), que muestran PageSpeed Insights y
                    Search Console, o tus propias mediciones con la librería <Code>web-vitals</Code>:
                </P>
                <CodeBlock title="Enviar datos de campo">{`import { onLCP, onINP, onCLS } from 'web-vitals';

function send(metric) {
  // name, value, rating ("good" | "needs-improvement" | "poor"), id ...
  navigator.sendBeacon('/vitals', JSON.stringify(metric));
}

onLCP(send);
onINP(send);
onCLS(send);`}</CodeBlock>

                <H2>LCP: acorta la cadena hasta el primer pintado</H2>
                <P>
                    En esta academia, el elemento más grande es el título del artículo. Antes de que pueda aparecer, el navegador tiene que
                    descargar React, React DOM, Babel y el runtime de Tailwind, después descargar y compilar dos archivos JSX y solo
                    entonces renderizar. Cada paso espera al anterior. Las soluciones típicas, por orden de impacto:
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Sirve HTML, no instrucciones para construirlo.</strong> El prerenderizado pone el título en la primera respuesta (<A href="/academia/busqueda-visibilidad/ssr-generacion-estatica/">SSR y generación estática</A>).</>,
                    <><strong className="text-gray-900">Construye los recursos por adelantado.</strong> El Play CDN de Tailwind y Babel en el navegador están pensados para prototipos. Un paso de build produce un archivo CSS estático pequeño y JavaScript precompilado.</>,
                    <><strong className="text-gray-900">Conecta pronto.</strong> Añade <Code>{'<link rel="preconnect">'}</Code> para los orígenes de fuentes y CDN, para que el establecimiento de la conexión se solape con el análisis del HTML.</>,
                    <><strong className="text-gray-900">Prioriza la imagen principal</strong>, si la hay, con <Code>fetchpriority="high"</Code>, y nunca la cargues de forma diferida.</>,
                ]} />

                <H2>INP: mantén libre el hilo principal</H2>
                <P>
                    Las interacciones lentas casi siempre vienen de tareas largas de JavaScript. Un manejador de clic que filtra una lista
                    grande y vuelve a renderizarlo todo bloquea el siguiente pintado hasta que termina. Mantén los manejadores pequeños,
                    actualiza primero la parte visible y aplaza el resto. El trabajo pesado, como buscar en un índice, puede pasar a un Web
                    Worker. El cruce{' '}
                    <A href="/academia/busqueda-visibilidad/core-web-vitals-x-busqueda-sitio/">Core Web Vitals × búsqueda en el sitio</A> lo aplica a una caja de búsqueda.
                </P>

                <H2>CLS: reserva espacio antes de que llegue el contenido</H2>
                <P>
                    El desplazamiento del diseño ocurre cuando algo aparece y empuja hacia abajo el contenido existente: una imagen sin
                    dimensiones, una fuente web tardía con otras métricas, un banner insertado arriba. Da a las imágenes atributos{' '}
                    <Code>width</Code> y <Code>height</Code> (o un <Code>aspect-ratio</Code>), usa <Code>font-display: swap</Code> con una
                    fuente de respaldo de tamaño parecido y reserva espacio para todo lo que se carga más tarde.
                </P>

                <Callout title="La velocidad también afecta al rastreo">
                    Las respuestas más rápidas permiten a los rastreadores descargar más páginas en el mismo tiempo. En sitios de
                    documentación grandes, esto influye directamente en lo rápido que se descubren las páginas nuevas. Consulta{' '}
                    <A href="/academia/busqueda-visibilidad/rastreabilidad-indexacion/">Rastreabilidad e indexación</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
