<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmarks × búsqueda como código - Academia Lameyer</title>
    <meta name="description" content="Ejecutar un benchmark curado de búsqueda de código en CI en cada pull request de configuración de búsqueda, con umbrales por segmento y una línea base versionada.">
    <link rel="canonical" href="https://lameyer.net/academia/busqueda-visibilidad/benchmarks-x-busqueda-como-codigo/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/academia.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Lanza la evaluación con cualquier cambio bajo search/',
            'Compara con una línea base versionada de main',
            'Pon la barrera por segmentos, no solo en la media',
            'Tolera el ruido pequeño y falla con las caídas reales',
            'Exige una etiqueta explícita para aceptar una regresión',
            'Actualiza la línea base solo al fusionar',
        ];

        const REPORT = [
            { slice: 'Todas las consultas (n=184)', base: '0,712', cand: '0,731', delta: '+0,019', status: '✓' },
            { slice: 'python', base: '0,744', cand: '0,770', delta: '+0,026', status: '✓' },
            { slice: 'typescript', base: '0,689', cand: '0,701', delta: '+0,012', status: '✓' },
            { slice: 'go', base: '0,655', cand: '0,618', delta: '−0,037', status: '✗ falla (máx. −0,02)' },
        ];

        const Content = () => (
            <>
                <P>
                    <A href="/academia/busqueda-visibilidad/busqueda-como-codigo-sac/">Búsqueda como código</A> pone en git todos los ajustes de relevancia.
                    Un <A href="/academia/busqueda-visibilidad/curacion-benchmarks-reap-harvest/">benchmark curado</A> te dice si un ajuste ayuda.
                    Júntalos y obtienes lo que los equipos de software tienen desde hace años: una batería de tests que se ejecuta en cada
                    pull request y bloquea la fusión cuando algo se rompe. Aquí, «se rompe» significa «encuentra peores resultados».
                </P>

                <H2>El flujo de trabajo</H2>
                <P>
                    El job solo se ejecuta cuando cambia la configuración de búsqueda. Construye un índice temporal a partir de la rama,
                    lanza todas las consultas del benchmark contra él y compara las puntuaciones con la línea base registrada en <Code>main</Code>:
                </P>
                <CodeBlock title=".github/workflows/search-relevance.yml">{`name: search-relevance
on:
  pull_request:
    paths: ["search/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r search/requirements.txt

      - name: Construir el índice candidato desde esta rama
        run: python search/tools/build_index.py --config search/ --out .eval/candidate

      - name: Puntuar el candidato contra la línea base de main
        run: >
          python search/tools/evaluate.py
          --index .eval/candidate
          --queries search/benchmark/queries.jsonl
          --baseline search/benchmark/baseline.json
          --max-drop 0.02
          --report .eval/report.md

      - name: Publicar el informe en el pull request
        if: always()
        run: gh pr comment "$PR" --body-file .eval/report.md
        env:
          GH_TOKEN: \${{ github.token }}
          PR: \${{ github.event.pull_request.number }}`}</CodeBlock>
                <Callout title="Indexa el snapshot, no el código de hoy">
                    Los elementos del benchmark están fijados al commit del que se cosecharon. El script de build indexa esos snapshots, así
                    que un cambio en el código de la aplicación nunca mueve las puntuaciones; solo las mueve un cambio en la configuración de búsqueda.
                </Callout>

                <H2>Pon la barrera por segmentos, no solo en la media</H2>
                <P>
                    Una media puede ocultar una regresión. Una nueva lista de sinónimos puede ayudar mucho a las consultas de Python y romper
                    en silencio las de Go. Puntúa cada segmento (lenguaje, repositorio, tipo de consulta) por separado y aplica el umbral a cada uno:
                </P>
                <Table
                    columns={[{ key: 'slice', label: 'nDCG@10 · segmento', mono: true }, { key: 'base', label: 'main' }, { key: 'cand', label: 'rama' }, { key: 'delta', label: 'Δ', accent: true }, { key: 'status', label: 'Estado' }]}
                    rows={REPORT}
                />
                <P>
                    Este pull request mejora la puntuación global y aun así falla, y esa es la idea: alguien tiene que mirar las consultas de
                    Go antes de publicarlo.
                </P>

                <H2>Ruido, umbrales y regresiones aceptadas</H2>
                <UL items={[
                    <><strong className="text-gray-900">Haz que las ejecuciones sean repetibles.</strong> Fija las semillas aleatorias y la versión del modelo de embeddings. La búsqueda aproximada de vecinos más cercanos aún puede variar ligeramente entre builds, así que permite una pequeña tolerancia.</>,
                    <><strong className="text-gray-900">Los segmentos pequeños tienen ruido.</strong> Con 15 consultas, que cambie una sola mueve mucho la puntuación. Define un tamaño mínimo de segmento antes de bloquear e informa de los segmentos más pequeños sin hacer fallar el job.</>,
                    <><strong className="text-gray-900">Algunas regresiones merecen la pena.</strong> Una mejora de modelo puede costar un 1 % en un segmento y ganar un 8 % en otros. Deja que quien revisa la acepte explícitamente con una etiqueta en el PR, para que la decisión quede registrada.</>,
                    <><strong className="text-gray-900">Mueve la línea base solo al fusionar.</strong> Un segundo job en <Code>main</Code> vuelve a ejecutar la evaluación y hace commit del nuevo <Code>baseline.json</Code>.</>,
                ]} />

                <H2>Cambiar el modelo de embeddings</H2>
                <P>
                    Un nuevo <A href="/academia/busqueda-visibilidad/busqueda-semantica-vectorial/">modelo de embeddings</A> implica regenerar los embeddings de todos
                    los fragmentos, el cambio más caro que puedes hacer. Como <Code>embedding.yaml</Code> forma parte de la configuración, pasa
                    por el mismo pipeline: el job construye un índice candidato completo con el nuevo modelo y ves el impacto por segmento antes
                    de pagar por reindexar producción.
                </P>

                <H2>Lo que te aporta</H2>
                <P>
                    Los cambios de búsqueda pasan a ser tan seguros y revisables como los cambios de código. El historial de{' '}
                    <Code>baseline.json</Code> es una gráfica de la calidad de tu búsqueda en el tiempo, y cada punto enlaza con el pull
                    request que lo provocó.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
