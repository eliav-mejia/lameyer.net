<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timeline · Lameyer</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="lameyer-fondo.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="circuit-bg" id="fondo"></div>

    <!-- Título en bucle de la etapa actual (baja opacidad) -->
    <div class="marquesina" aria-hidden="true"><div class="pista" id="pista"></div></div>

    <header class="cabecera">
        <a class="logo" href="/pages/development/">LAMEYER<span>/timeline</span></a>
        <span class="bloque" id="bloque" hidden></span>
        <a class="editar" id="aEditar" href="editor.html" title="Crear o editar un conjunto de datos">Editar datos</a>
        <select class="datos" id="sDatos" title="Conjunto de datos" aria-label="Conjunto de datos"></select>
        <nav class="chips" id="chips" aria-label="Etapas"></nav>
    </header>

    <canvas id="lienzo" aria-label="Línea de tiempo"></canvas>

    <aside class="panel glass" id="panel" aria-live="polite"></aside>

    <div class="leyenda glass">
        <div class="kicker">Lectura</div>
        <div class="fila"><i class="op op1"></i><i class="op op2"></i><i class="op op3"></i> opacidad = avance</div>
        <div class="fila"><svg width="44" height="18" viewBox="0 0 44 18"><path d="M0 9 H8 C14 9 14 3 20 3 H44 M8 9 C14 9 14 9 20 9 H44 M8 9 C14 9 14 15 20 15 H44" fill="none" stroke="currentColor" stroke-width="1.4"/></svg> se divide en 2–3 al avanzar</div>
        <div class="fila"><svg width="44" height="6" viewBox="0 0 44 6"><path d="M0 3 H44" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 4"/></svg> por recorrer</div>
        <div class="fila"><i class="op op3" style="filter: blur(1.5px); opacity: .35; width: 44px"></i> etapa futura (fuera del ciclo)</div>
        <div class="fila"><b class="critica" style="margin: 0">◆ 40 %</b> rama crítica y su peso</div>
    </div>

    <div class="control glass" role="toolbar" aria-label="Control de la animación">
        <button id="bAnt" title="Etapa anterior (←)">⏮</button>
        <button id="bPlay" title="Pausa / reproducir (espacio)">❚❚</button>
        <button id="bSig" title="Etapa siguiente (→)">⏭</button>
        <select id="sVel" title="Velocidad">
            <option value="0.1">0.10×</option>
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
        </select>
        <span class="sep"></span>
        <span class="etq">Etapas</span>
        <button id="bMenos" title="Alejar (rueda / −)">−</button>
        <input id="rZoom" type="range" min="0" max="1000" value="300" aria-label="Zoom">
        <button id="bMas" title="Acercar (rueda / +)">+</button>
        <span class="etq">Rama</span>
        <span class="sep"></span>
        <button id="bRama" class="ancho" title="Entrar / salir de la rama (Enter / Esc)">Entrar a rama</button>
        <button id="bSeguir" class="ancho activo" title="La cámara sigue el flujo (F)">Seguir flujo</button>
    </div>

    <p class="ayuda">Rueda: acercar a una rama o salir a las etapas · Arrastrar: mover · Clic en una rama: entrar · ↑ ↓ cambiar de rama</p>

    <div class="aviso" id="aviso" hidden></div>

    <!-- Carga: datos/indice.js → datos/<id>.js (?datos=<id>, o el primero del índice) → linea.js -->
    <script src="reglas.js"></script>
    <script src="datos/indice.js"></script>
    <script>
    (() => {
      const lista = window.TIMELINES || [];
      const pedido = new URLSearchParams(location.search).get('datos');
      const actual = lista.find(d => d.id === pedido) || lista[0];
      const sel = document.getElementById('sDatos');
      lista.forEach(d => sel.add(new Option(d.titulo, d.id, false, d === actual)));
      sel.hidden = lista.length < 2;
      document.getElementById('aEditar').href = `editor.html?datos=${encodeURIComponent(actual ? actual.id : '')}`;
      sel.onchange = () => { location.search = `?datos=${encodeURIComponent(sel.value)}`; };
      const aviso = txt => { const a = document.getElementById('aviso'); a.hidden = false; a.innerHTML += `<p>${txt}</p>`; };
      if (!actual) return aviso('datos/indice.js no tiene conjuntos registrados.');
      if (pedido && pedido !== actual.id) aviso(`«${pedido}» no está en datos/indice.js; se muestra «${actual.id}».`);
      const cargar = (src, luego) => {
        const s = document.createElement('script');
        s.src = src; s.onload = luego; s.onerror = () => aviso(`No se pudo cargar ${src}.`);
        document.body.appendChild(s);
      };
      cargar(`datos/${actual.id}.js`, () => cargar('linea.js'));
    })();
    </script>
</body>
</html>
