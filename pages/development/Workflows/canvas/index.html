<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Business Model Canvas - Lameyer</title>
    <!-- js/acceso.jsx (rule 'optional'): login pop-up once per browser session, with a close button. Without login the canvas works but saves nothing. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <!-- Opened from disk (file://) the site scripts (/js/…) and in-browser Babel cannot load and the page stays white:
         open the canvas on its own instead (blank, notes not saved, no account). -->
    <script>if (location.protocol === 'file:') location.replace('app.html' + location.hash);</script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root">
        <noscript>
            <h1>Business Model Canvas</h1>
            <p>Activa JavaScript para abrir el Business Model Canvas. Inicia sesión con los datos de tu cuenta para guardar tus notas.</p>
            <p><a href="/cuenta/">Mi cuenta</a></p>
        </noscript>
    </div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel">
        // The canvas itself (copy of animations/canvas/) lives in app.html. The access rule is 'optional': it opens with or without a session.
        // An iframe keeps its full-window CSS (html, body, main, h1) away from the site's Layout.
        // Notes stay in this browser, one canvas per account (localStorage 'lameyer-canvas/2/<user id>'); a new account starts empty.
        // Each account gets its own canvas: app.html reads window.lameyerCanvasCuenta (same origin) and keys its notes by it.
        // Logging in or out (pop-up, header or another tab) swaps the iframe for that account's canvas.
        // auth.current() only reads localStorage, so checking it every second costs nothing and covers the same tab too.
        const currentId = () => { const u = typeof auth !== 'undefined' ? auth.current() : null; return u ? u.id : null; };
        // app.html next to this page, also when it is served as /…/canvas (no trailing slash).
        const pagePath = window.location.pathname;
        const appUrl = (/\.html?$/i.test(pagePath) ? pagePath.replace(/[^/]*$/, '') : pagePath.replace(/\/?$/, '/')) + 'app.html' + window.location.hash;

        const CanvasPage = () => {
            const [cuenta, setCuenta] = useState(currentId);
            useEffect(() => {
                const check = () => setCuenta(currentId());
                const timer = setInterval(check, 1000);
                window.addEventListener('storage', check);
                return () => { clearInterval(timer); window.removeEventListener('storage', check); };
            }, []);
            window.lameyerCanvasCuenta = cuenta;
            return (
            <section className="max-w-[110rem] mx-auto pb-10 relative z-10">
                <h1 className="sr-only">Business Model Canvas</h1>
                <iframe
                    key={cuenta || 'sin-cuenta'}
                    src={appUrl}
                    title="Business Model Canvas"
                    className="block w-full rounded-[2rem] border border-gray-200 bg-white shadow-sm"
                    style={{ height: 'max(560px, calc(100dvh - 10rem))' }}
                />
                <p className="mt-4 text-center text-xs text-gray-500 font-medium">
                    {cuenta
                        ? <>Tus notas se guardan en este navegador, en tu cuenta. Usa «Exportar» para llevarlas a otro equipo. · <a href="/cuenta/" className="font-bold text-blue-600 hover:underline">Mi cuenta</a></>
                        : <>Sin sesión: las notas no se guardan al recargar. Usa «Exportar» o <a href="/cuenta/" className="font-bold text-blue-600 hover:underline">inicia sesión</a> para guardarlas.</>}
                </p>
            </section>
            );
        };

        renderPage(CanvasPage);
    </script>
</body>
</html>
