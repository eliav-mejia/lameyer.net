<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componentes y repuestos electrónicos en Madrid - Lameyer</title>
    <meta name="description" content="Tienda de componentes y repuestos en Madrid: memoria RAM, almacenamiento, refrigeración, baterías, redes, monitores, teclados y auriculares. Devolución en 30 días.">
    <link rel="canonical" href="https://lameyer.net/pages/components/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/tienda.jsx"></script>
    <script type="text/babel">
        // Catalogue, cart and cards come from /js/tienda.jsx; products, categories and groups from /public/db/.
        const SORTS = [
            { id: 'featured', label: 'Destacados' },
            { id: 'price-asc', label: 'Precio: menor a mayor' },
            { id: 'price-desc', label: 'Precio: mayor a menor' },
            { id: 'name', label: 'Nombre' },
        ];
        const PAGE_SIZE = 8;   // standard products per page: 4 columns × 2 rows on desktop, 2 × 4 on mobile

        // Category from the URL (?cat=memoria) so each category can be linked directly.
        const categoryFromUrl = () => new URLSearchParams(window.location.search).get('cat') || 'todos';

        const Chevron = ({ open }) => (
            <svg className={`w-4 h-4 flex-none text-gray-400 transition-transform duration-300 ${open ? 'rotate-180' : ''}`} viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><path d="M2 4l4 4 4-4" /></svg>
        );

        // Accordion filter: one section per group (Componentes del PC, Redes, Equipo básico, Herramientas) + availability.
        const FilterAccordion = ({ idPrefix, catalog, counts, total, category, onCategory, inStock, setInStock }) => {
            const activeGroup = (catalog.categories.find(c => c.id === category) || {}).group_id;
            const [open, setOpen] = useState(() => new Set([activeGroup || (catalog.groups[0] || {}).id, 'stock']));
            const toggle = (id) => setOpen(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });

            const option = (active) => `w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-semibold text-left transition-colors ${active ? 'bg-blue-600 text-white' : 'text-gray-700 hover:bg-blue-50 hover:text-blue-600'}`;
            // A plain function (not a component) so toggling keeps keyboard focus on the same button.
            const section = (id, title, count, children) => (
                <div key={id} className="border-b border-gray-100 last:border-b-0">
                    <h3>
                        <button type="button" onClick={() => toggle(id)} aria-expanded={open.has(id)} aria-controls={`${idPrefix}-filter-${id}`}
                            className="w-full flex items-center justify-between gap-3 py-4 text-left text-xs font-black uppercase tracking-widest text-gray-900 hover:text-blue-600 transition-colors">
                            <span>{title}</span>
                            <span className="flex items-center gap-2">
                                {count !== undefined && <span translate="no" className="text-[10px] font-bold text-gray-400">{count}</span>}
                                <Chevron open={open.has(id)} />
                            </span>
                        </button>
                    </h3>
                    <div id={`${idPrefix}-filter-${id}`} hidden={!open.has(id)} className="pb-4 space-y-1">{children}</div>
                </div>
            );

            return (
                <div className="rounded-3xl border border-gray-100 bg-white shadow-lg shadow-gray-200/40 px-4 pt-3 pb-1">
                    <button type="button" onClick={() => onCategory('todos')} aria-pressed={category === 'todos'} className={option(category === 'todos') + ' mb-1'}>
                        <span className="flex-1">Todo el catálogo</span><span translate="no" className="text-xs opacity-70">{total}</span>
                    </button>
                    {catalog.groups.map(g => {
                        const cats = catalog.categories.filter(c => c.group_id === g.id);
                        return section(g.id, g.label, cats.reduce((n, c) => n + (counts[c.id] || 0), 0),
                                cats.map(c => (
                                    <button key={c.id} type="button" onClick={() => onCategory(c.id)} aria-pressed={category === c.id} className={option(category === c.id)}>
                                        <span aria-hidden="true" className="w-5 text-center">{c.icon}</span>
                                        <span className="flex-1">{c.label}</span>
                                        <span translate="no" className="text-xs opacity-70">{counts[c.id] || 0}</span>
                                    </button>
                                )));
                    })}
                    {section('stock', 'Disponibilidad', undefined,
                        <label className="flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-semibold text-gray-700 cursor-pointer hover:bg-blue-50">
                            <input type="checkbox" checked={inStock} onChange={e => setInStock(e.target.checked)} className="w-4 h-4 accent-blue-600" />
                            Solo productos en stock
                        </label>)}
                </div>
            );
        };

        // Special edition: limited units, one compact row each (ProductRow). Edge and badge colour follow the stock (1 wine, 2 blue, 0 grey).
        const SpecialEditionList = ({ products, money, cartState }) => (
            <section aria-labelledby="special-title" className="mt-16">
                <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                    <div>
                        <p className="text-[10px] font-bold uppercase tracking-[0.4em] text-[#881337] mb-2">Unidades limitadas</p>
                        <h2 id="special-title" className="text-3xl md:text-4xl font-black text-gray-900 tracking-tighter">Edición especial</h2>
                        <p className="text-gray-500 font-medium mt-2 max-w-xl">Series cortas que no se reponen. Cuando se agotan, desaparecen del catálogo.</p>
                    </div>
                    <ul className="flex flex-wrap gap-2 text-[10px] font-bold uppercase tracking-widest" aria-label="Leyenda de stock">
                        {[1, 2, 0].map(n => { const s = stockInfo(n); return <li key={n} className={`px-3 py-1 rounded-full ${s.className}`}>{s.label}</li>; })}
                    </ul>
                </div>
                <ul className="space-y-1.5">
                    {products.map(p => <ProductRow key={p.id} product={p} money={money} onAdd={cartState.add} inCart={cartState.cart[p.id] || 0} />)}
                </ul>
            </section>
        );

        const ShopPage = () => {
            const catalog = useCatalog();
            const money = useCurrency();
            const cartState = useCart(catalog);
            const [category, setCategory] = useState(categoryFromUrl);
            const [query, setQuery] = useState('');
            const [sort, setSort] = useState('featured');
            const [inStock, setInStock] = useState(false);
            const [page, setPage] = useState(1);
            const [filtersOpen, setFiltersOpen] = useState(false);
            const gridRef = useRef(null);

            const chooseCategory = (id) => {
                setCategory(id);
                setFiltersOpen(false);
                const url = new URL(window.location.href);
                if (id === 'todos') url.searchParams.delete('cat'); else url.searchParams.set('cat', id);
                window.history.replaceState(null, '', url);
            };
            useEffect(() => { setPage(1); }, [category, query, sort, inStock]);

            const q = query.trim().toLowerCase();
            const activeCat = catalog.categories.find(c => c.id === category);
            // Search + availability apply first, so the filter counts show what each category would return.
            const searched = catalog.products
                .filter(p => !inStock || p.stock > 0)
                .filter(p => !q || `${p.name} ${p.compat} ${(p.compatible_models || []).join(' ')} ${p.sku} ${p.description}`.toLowerCase().includes(q));
            const counts = searched.reduce((acc, p) => ({ ...acc, [p.category_id]: (acc[p.category_id] || 0) + 1 }), {});
            const visible = searched.filter(p => !activeCat || p.category_id === activeCat.id);
            if (sort === 'price-asc') visible.sort((a, b) => a.price_eur - b.price_eur);
            if (sort === 'price-desc') visible.sort((a, b) => b.price_eur - a.price_eur);
            if (sort === 'name') visible.sort((a, b) => a.name.localeCompare(b.name, 'es'));

            const standard = visible.filter(p => !isSpecial(p));
            const special = visible.filter(isSpecial);
            const pages = Math.max(1, Math.ceil(standard.length / PAGE_SIZE));
            const current = Math.min(page, pages);
            const pageItems = standard.slice((current - 1) * PAGE_SIZE, current * PAGE_SIZE);
            const goTo = (n) => { setPage(n); gridRef.current && gridRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
            const pagerBtn = (active) => `min-w-[2.5rem] h-10 px-3 rounded-full text-xs font-black transition-colors ${active ? 'bg-blue-600 text-white' : 'bg-white border border-gray-200 text-gray-700 hover:border-blue-500 hover:text-blue-600'} disabled:opacity-40 disabled:pointer-events-none`;

            const filters = (idPrefix) => catalog.status === 'ready' && (
                <FilterAccordion idPrefix={idPrefix} catalog={catalog} counts={counts} total={searched.length} category={activeCat ? category : 'todos'} onCategory={chooseCategory} inStock={inStock} setInStock={setInStock} />
            );

            return (
                <>
                    <PageHero
                        eyebrow="COMPONENTES · MADRID"
                        title="Repuestos y"
                        accent="Componentes"
                        intro="Componentes del PC, redes y equipo básico: memoria, almacenamiento, monitores, teclados, auriculares y más. Envío en España y recogida en Madrid."
                    />

                    {/* Trust strip */}
                    <section className="relative z-20 mb-12">
                        <div className="max-w-7xl mx-auto grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                            {[
                                ['📦', 'Envío desde Madrid', 'A toda España'],
                                ['↩️', `Devolución ${RETURN_DAYS} días`, 'Sujeta a revisión'],
                                ['🛡️', 'Garantía legal 3 años', 'Productos nuevos'],
                                ['💱', 'Precios en EUR o MXN', 'Según la bandera'],
                            ].map(([icon, title, text]) => (
                                <div key={title} className="bg-white p-4 md:p-5 rounded-3xl shadow-xl border border-gray-50 flex items-center gap-3 md:gap-4">
                                    <div className="w-10 h-10 flex-none bg-blue-50 rounded-xl flex items-center justify-center text-lg" aria-hidden="true">{icon}</div>
                                    <div>
                                        <p className="text-xs md:text-sm font-black text-gray-900 leading-tight">{title}</p>
                                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-tight mt-1">{text}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section className="pb-32 relative z-20">
                        <div className="max-w-7xl mx-auto lg:grid lg:grid-cols-[15rem_1fr] lg:gap-8 items-start">
                            {/* Filters: sidebar on desktop */}
                            <aside className="hidden lg:block lg:sticky lg:top-[140px]" aria-label="Filtros">{filters('d')}</aside>

                            <div className="min-w-0">
                                {/* Toolbar */}
                                <div className="flex flex-col xl:flex-row gap-3 mb-4">
                                    <label className="relative flex-1">
                                        <span className="sr-only">Buscar</span>
                                        <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
                                        <input
                                            type="search"
                                            value={query}
                                            onChange={e => setQuery(e.target.value)}
                                            placeholder="Buscar pieza, modelo o SKU (DDR5, monitor, ThinkPad…)"
                                            className="w-full pl-11 pr-4 py-3 rounded-full border border-gray-200 bg-white text-sm text-gray-900 font-medium focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                                        />
                                    </label>
                                    <div className="flex gap-3">
                                        <label className="relative inline-flex items-center flex-1 sm:flex-none">
                                            <span className="sr-only">Ordenar</span>
                                            <select value={sort} onChange={e => setSort(e.target.value)} className="w-full appearance-none cursor-pointer pl-4 pr-9 sm:pl-5 sm:pr-10 py-3 rounded-full border border-gray-200 bg-white text-[11px] sm:text-xs font-bold uppercase tracking-wider sm:tracking-widest text-gray-700 hover:border-blue-500 focus:outline-none focus:border-blue-500 transition-colors">
                                                {SORTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                            </select>
                                            <svg className="pointer-events-none absolute right-4 w-3 h-3 text-gray-400" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 4l4 4 4-4" /></svg>
                                        </label>
                                        <CurrencyBadge money={money} className="flex-1 sm:flex-none" />
                                    </div>
                                </div>

                                {/* Filters: collapsible accordion on mobile and tablet */}
                                <div className="lg:hidden mb-6">
                                    <button type="button" onClick={() => setFiltersOpen(o => !o)} aria-expanded={filtersOpen} aria-controls="mobile-filters"
                                        className="w-full flex items-center justify-between px-5 py-3 rounded-full border border-gray-200 bg-white text-xs font-black uppercase tracking-widest text-gray-900 hover:border-blue-500 transition-colors">
                                        <span>Filtros{activeCat ? ` · ${activeCat.label}` : ''}{inStock ? ' · En stock' : ''}</span>
                                        <Chevron open={filtersOpen} />
                                    </button>
                                    <div id="mobile-filters" hidden={!filtersOpen} className="mt-3">{filters('m')}</div>
                                </div>

                                {/* Category heading */}
                                <div ref={gridRef} className="scroll-mt-40 flex flex-wrap items-end justify-between gap-4 mb-6">
                                    <div>
                                        <h2 className="text-3xl md:text-4xl font-black text-gray-900 tracking-tighter">{activeCat ? activeCat.label : 'Todo el catálogo'}</h2>
                                        <p className="text-gray-500 font-medium mt-1">{activeCat ? activeCat.description : 'Componentes del PC, redes, equipo básico y herramientas.'}</p>
                                    </div>
                                    {catalog.status === 'ready' && <p className="text-[10px] font-bold uppercase tracking-widest text-gray-400"><span translate="no">{visible.length}</span> productos</p>}
                                </div>

                                {catalog.status !== 'ready' ? (
                                    <CatalogStatus status={catalog.status} />
                                ) : visible.length === 0 ? (
                                    <div className="text-center py-20 rounded-[2.5rem] border border-dashed border-gray-200 bg-white/70">
                                        <p className="text-gray-500 font-medium mb-4">No encontramos esa pieza en el catálogo.</p>
                                        <a href={`https://wa.me/${SELLER.whatsapp}?text=${encodeURIComponent(`Hola Lameyer, busco: ${query}`)}`} target="_blank" rel="noopener noreferrer" className="inline-block px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase tracking-widest rounded-full shadow-md transition-colors">
                                            Pedir por WhatsApp
                                        </a>
                                    </div>
                                ) : (
                                    <>
                                        {/* Standard products: 2 columns on mobile, 4 on desktop, PAGE_SIZE per page */}
                                        {standard.length > 0 && (
                                            <>
                                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                                                    {pageItems.map((p, i) => <ProductTile key={p.id} product={p} catalog={catalog} money={money} onAdd={cartState.add} inCart={cartState.cart[p.id] || 0} eager={current === 1 && i < 4} />)}
                                                </div>
                                                {pages > 1 && (
                                                    <nav className="mt-6 flex flex-wrap items-center justify-center gap-2" aria-label="Páginas">
                                                        <button type="button" onClick={() => goTo(current - 1)} disabled={current === 1} className={pagerBtn(false)} aria-label="Página anterior">‹</button>
                                                        {Array.from({ length: pages }, (_, i) => i + 1).map(n => (
                                                            <button key={n} type="button" onClick={() => goTo(n)} aria-current={n === current ? 'page' : undefined} className={pagerBtn(n === current)}>{n}</button>
                                                        ))}
                                                        <button type="button" onClick={() => goTo(current + 1)} disabled={current === pages} className={pagerBtn(false)} aria-label="Página siguiente">›</button>
                                                    </nav>
                                                )}
                                            </>
                                        )}

                                        {special.length > 0 && <SpecialEditionList products={special} money={money} cartState={cartState} />}
                                    </>
                                )}

                                {/* Legal notes */}
                                <div className="mt-16 grid md:grid-cols-3 gap-4 text-sm">
                                    <a href={`${TERMS_URL}#precios`} className="p-6 rounded-3xl bg-white/80 border border-gray-100 hover:border-blue-500 transition-colors">
                                        <p className="font-black text-gray-900 mb-1">Precios y divisas</p>
                                        <p className="text-gray-500 font-medium">Precios en EUR con IVA. Otras divisas, orientativas{money.ratesDate ? ` (tipo BCE del ${money.ratesDate.split('-').reverse().join('/')})` : ''}.</p>
                                    </a>
                                    <a href={`${TERMS_URL}#devoluciones`} className="p-6 rounded-3xl bg-white/80 border border-gray-100 hover:border-blue-500 transition-colors">
                                        <p className="font-black text-gray-900 mb-1">Devoluciones en {RETURN_DAYS} días</p>
                                        <p className="text-gray-500 font-medium">Envía el producto a nuestra dirección en España o en Madrid para su revisión.</p>
                                    </a>
                                    <a href={`${TERMS_URL}#garantia`} className="p-6 rounded-3xl bg-white/80 border border-gray-100 hover:border-blue-500 transition-colors">
                                        <p className="font-black text-gray-900 mb-1">Garantía</p>
                                        <p className="text-gray-500 font-medium">3 años de garantía legal de conformidad para productos nuevos.</p>
                                    </a>
                                </div>
                                <p className="mt-6 text-[11px] text-gray-400 font-medium text-center max-w-3xl mx-auto">
                                    Las marcas y modelos se citan solo para indicar compatibilidad y pertenecen a sus titulares. Salvo indicación expresa, los repuestos son compatibles y no originales del fabricante.
                                    Las imágenes son ilustrativas y pueden no corresponder con la marca o el modelo exacto de la pieza.
                                    Consulta los <a href={TERMS_URL} className="font-bold text-blue-600 hover:underline">Términos y Condiciones</a>.
                                </p>

                                {/* Image credits (required by the CC BY / CC BY-SA licences) */}
                                {catalog.status === 'ready' && (
                                    <details className="mt-6 max-w-3xl mx-auto text-[11px] text-gray-400 font-medium">
                                        <summary className="cursor-pointer text-center font-bold uppercase tracking-widest hover:text-blue-600">Créditos de imágenes</summary>
                                        <ul className="mt-4 grid sm:grid-cols-2 gap-x-6 gap-y-1">
                                            {catalog.products.filter(p => p.image).map(p => (
                                                <li key={p.id}>
                                                    <span className="text-gray-500">{p.name} ({p.compat})</span>: <a href={p.image.source} target="_blank" rel="noopener noreferrer" className="hover:text-blue-600 underline">{p.image.author}</a>,{' '}
                                                    {p.image.license_url ? <a href={p.image.license_url} target="_blank" rel="noopener noreferrer" className="hover:text-blue-600 underline">{p.image.license}</a> : p.image.license}, vía Wikimedia Commons (recortada y con fondo blanco)
                                                </li>
                                            ))}
                                        </ul>
                                    </details>
                                )}
                            </div>
                        </div>
                    </section>

                    <CartButton cartState={cartState} />
                    <CartDrawer cartState={cartState} catalog={catalog} money={money} />
                </>
            );
        };

        renderPage(ShopPage);
    </script>
</body>
</html>
