<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components - Lameyer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel">
        // Each demo renders live and shows the Tailwind HTML to copy.
        const DEMOS = [
            {
                id: 'buttons',
                title: 'Botones',
                desc: 'Acción primaria, secundaria y fantasma.',
                preview: (
                    <div className="flex flex-wrap gap-4 items-center">
                        <button className="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full shadow-md hover:scale-105 transition-all">Primario</button>
                        <button className="px-8 py-3 bg-white border border-gray-200 hover:border-blue-500 text-gray-900 font-bold rounded-full transition-all">Secundario</button>
                        <button className="px-8 py-3 text-blue-600 hover:bg-blue-50 font-bold rounded-full transition-all">Fantasma</button>
                    </div>
                ),
                code: `<button class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full shadow-md hover:scale-105 transition-all">Primario</button>
<button class="px-8 py-3 bg-white border border-gray-200 hover:border-blue-500 text-gray-900 font-bold rounded-full transition-all">Secundario</button>
<button class="px-8 py-3 text-blue-600 hover:bg-blue-50 font-bold rounded-full transition-all">Fantasma</button>`,
            },
            {
                id: 'badges',
                title: 'Badges',
                desc: 'Etiquetas para estados, categorías y certificaciones.',
                preview: (
                    <div className="flex flex-wrap gap-3 items-center">
                        <span className="px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-[10px] font-bold uppercase tracking-widest">Nuevo</span>
                        <span className="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 text-[10px] font-bold uppercase tracking-widest">Activo</span>
                        <span className="px-3 py-1 rounded-full bg-amber-50 text-amber-600 text-[10px] font-bold uppercase tracking-widest">Beta</span>
                        <span className="px-5 py-1.5 border border-blue-200 text-blue-600 text-[10px] font-bold rounded-full tracking-[0.5em] uppercase bg-blue-50/50">Eyebrow</span>
                    </div>
                ),
                code: `<span class="px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-[10px] font-bold uppercase tracking-widest">Nuevo</span>
<span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 text-[10px] font-bold uppercase tracking-widest">Activo</span>
<span class="px-3 py-1 rounded-full bg-amber-50 text-amber-600 text-[10px] font-bold uppercase tracking-widest">Beta</span>
<span class="px-5 py-1.5 border border-blue-200 text-blue-600 text-[10px] font-bold rounded-full tracking-[0.5em] uppercase bg-blue-50/50">Eyebrow</span>`,
            },
            {
                id: 'card',
                title: 'Tarjeta de contenido',
                desc: 'La tarjeta usada en la animación de circuito del inicio.',
                preview: (
                    <div className="max-w-sm p-8 rounded-[2.5rem] border border-blue-500 bg-white/90 backdrop-blur-md shadow-2xl shadow-blue-500/10">
                        <div className="mb-4 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-blue-600 text-white">⚡</div>
                        <h3 className="text-xl font-black text-gray-900 mb-2">Flujo de Datos</h3>
                        <p className="text-sm text-gray-500 font-medium leading-relaxed">Transmisión optimizada para infraestructuras críticas.</p>
                    </div>
                ),
                code: `<div class="max-w-sm p-8 rounded-[2.5rem] border border-blue-500 bg-white/90 backdrop-blur-md shadow-2xl shadow-blue-500/10">
  <div class="mb-4 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-blue-600 text-white">⚡</div>
  <h3 class="text-xl font-black text-gray-900 mb-2">Flujo de Datos</h3>
  <p class="text-sm text-gray-500 font-medium leading-relaxed">Transmisión optimizada para infraestructuras críticas.</p>
</div>`,
            },
            {
                id: 'stat',
                title: 'Indicador',
                desc: 'Métrica destacada con etiqueta.',
                preview: (
                    <div className="bg-white p-6 rounded-3xl shadow-xl border border-gray-50 flex items-center gap-4 max-w-[220px]">
                        <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">99%</div>
                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-tight">Uptime en despliegues</p>
                    </div>
                ),
                code: `<div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-50 flex items-center gap-4 max-w-[220px]">
  <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">99%</div>
  <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-tight">Uptime en despliegues</p>
</div>`,
            },
            {
                id: 'input',
                title: 'Campo de formulario',
                desc: 'Input con etiqueta y estado de foco.',
                preview: (
                    <div className="w-full max-w-sm">
                        <label htmlFor="demo-email" className="block text-sm font-bold text-gray-700 mb-2">Correo</label>
                        <input id="demo-email" type="email" placeholder="nombre@empresa.com" className="w-full px-5 py-4 rounded-2xl border border-gray-200 bg-white text-gray-900 font-medium focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all" />
                    </div>
                ),
                code: `<label for="email" class="block text-sm font-bold text-gray-700 mb-2">Correo</label>
<input id="email" type="email" placeholder="nombre@empresa.com"
  class="w-full px-5 py-4 rounded-2xl border border-gray-200 bg-white text-gray-900 font-medium focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all" />`,
            },
            {
                id: 'alert',
                title: 'Alerta',
                desc: 'Mensajes informativos y de éxito.',
                preview: (
                    <div className="w-full max-w-md space-y-3">
                        <div className="flex gap-3 p-4 rounded-2xl bg-blue-50 border border-blue-100 text-sm text-blue-800 font-medium">
                            <span className="w-1 rounded-full bg-blue-500"></span>
                            Despliegue programado para esta noche.
                        </div>
                        <div className="flex gap-3 p-4 rounded-2xl bg-emerald-50 border border-emerald-100 text-sm text-emerald-800 font-medium">
                            <span className="w-1 rounded-full bg-emerald-500"></span>
                            Cambios guardados correctamente.
                        </div>
                    </div>
                ),
                code: `<div class="flex gap-3 p-4 rounded-2xl bg-blue-50 border border-blue-100 text-sm text-blue-800 font-medium">
  <span class="w-1 rounded-full bg-blue-500"></span>
  Despliegue programado para esta noche.
</div>`,
            },
            {
                id: 'glass',
                title: 'Panel glass',
                desc: 'Superficie translúcida como la barra de navegación. Requiere la clase .glass de site.css.',
                preview: (
                    <div className="relative w-full max-w-md h-40 rounded-3xl overflow-hidden bg-gradient-to-br from-blue-500 to-slate-900 flex items-center justify-center">
                        <div className="glass rounded-2xl px-8 py-5 text-gray-900 font-black tracking-tight">Glassmorphism</div>
                    </div>
                ),
                code: `<div class="glass rounded-2xl px-8 py-5 text-gray-900 font-black tracking-tight">Glassmorphism</div>

/* site.css */
.glass {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0, 0, 0, 0.05);
}`,
            },
        ];

        const CopyButton = ({ text }) => {
            const [copied, setCopied] = useState(false);

            const copy = async () => {
                try {
                    await navigator.clipboard.writeText(text);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1500);
                } catch (e) {
                    // Clipboard can be blocked (e.g. insecure context); the code is still selectable.
                }
            };

            return (
                <button
                    onClick={copy}
                    className="px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest bg-slate-700 hover:bg-blue-600 text-white transition-colors"
                >
                    {copied ? 'Copiado' : 'Copiar'}
                </button>
            );
        };

        const ComponentDemo = ({ demo }) => {
            const [showCode, setShowCode] = useState(false);

            return (
                <article id={demo.id} className="scroll-mt-40 rounded-[2.5rem] border border-gray-100 bg-white/90 backdrop-blur-md shadow-xl shadow-gray-200/40 overflow-hidden">
                    <div className="flex flex-wrap items-start justify-between gap-4 p-8 pb-0">
                        <div>
                            <h3 className="text-xl font-black text-gray-900 mb-1">{demo.title}</h3>
                            <p className="text-sm text-gray-500 font-medium">{demo.desc}</p>
                        </div>
                        <button
                            onClick={() => setShowCode(v => !v)}
                            aria-expanded={showCode}
                            className="px-5 py-2 rounded-full border border-gray-200 hover:border-blue-500 text-xs font-bold uppercase tracking-widest text-gray-600 hover:text-blue-600 transition-colors"
                        >
                            {showCode ? 'Ocultar código' : 'Ver código'}
                        </button>
                    </div>
                    <div className="p-8 md:p-12 flex items-center justify-center min-h-[180px]">
                        {demo.preview}
                    </div>
                    {showCode && (
                        <div className="bg-slate-900 p-6 animate-fade-in">
                            <div className="flex justify-end mb-3">
                                <CopyButton text={demo.code} />
                            </div>
                            <pre className="text-xs text-slate-300 overflow-x-auto leading-relaxed"><code>{demo.code}</code></pre>
                        </div>
                    )}
                </article>
            );
        };

        const ComponentsPage = () => (
            <>
                <PageHero
                    eyebrow="COMPONENTS"
                    title="Librería de"
                    accent="Componentes UI"
                    intro="Los bloques visuales del sistema de diseño Lameyer. Construidos con Tailwind CSS, listos para copiar y pegar."
                />

                <section className="pb-32 relative z-20">
                    <div className="max-w-5xl mx-auto">
                        {/* Quick index */}
                        <nav className="flex flex-wrap justify-center gap-3 mb-16" aria-label="Componentes">
                            {DEMOS.map(demo => (
                                <a
                                    key={demo.id}
                                    href={`#${demo.id}`}
                                    className="px-4 py-2 rounded-full bg-white border border-gray-200 hover:border-blue-500 hover:text-blue-600 text-xs font-bold uppercase tracking-widest text-gray-600 transition-colors"
                                >
                                    {demo.title}
                                </a>
                            ))}
                        </nav>

                        <div className="space-y-10">
                            {DEMOS.map(demo => <ComponentDemo key={demo.id} demo={demo} />)}
                        </div>
                    </div>
                </section>

                <RegisterCTA title="¿Necesita un sistema de diseño propio?" text="Creamos librerías de componentes a la medida de su marca." />
            </>
        );

        renderPage(ComponentsPage);
    </script>
</body>
</html>
