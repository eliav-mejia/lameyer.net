<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Generation × Vector Search - Lameyer Blog</title>
    <meta name="description" content="Using one static build to publish crawlable HTML and to feed a vector index: chunking by semantic headings, content hashes and incremental embedding.">
    <link rel="canonical" href="https://lameyer.net/blog/static-generation-x-vector-search.html">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Index the built HTML, not the source files',
            'Chunk at h2 sections inside article',
            'Give every heading an id and link chunks to it',
            'Prefix chunks with their heading path',
            'Embed only chunks whose hash changed',
            'Delete chunks for removed pages',
        ];

        const Content = () => (
            <>
                <P>
                    A documentation site usually has two audiences that need the same content in different shapes. Crawlers want complete
                    HTML pages. A <A href="/blog/semantic-vector-search.html">semantic search</A> index wants small, self-contained chunks
                    with a vector each. Teams often build these separately, and the search index drifts out of date. With{' '}
                    <A href="/blog/ssr-static-generation.html">static generation</A>, the build already produces every page, so it can
                    produce the index from the same output.
                </P>

                <H2>Why index the built HTML</H2>
                <UL items={[
                    <><strong className="text-gray-900">It is what readers see.</strong> Components, includes and data files are already resolved. Indexing source files misses generated tables, lists and shared snippets.</>,
                    <><strong className="text-gray-900">It has structure.</strong> If the pages use <A href="/blog/semantic-html-markup.html">semantic HTML</A>, the <Code>article</Code> element marks the content and the <Code>h2</Code> headings mark the sections. Navigation, footers and banners are easy to exclude.</>,
                    <><strong className="text-gray-900">It gives every chunk a URL.</strong> A heading with an <Code>id</Code> becomes a link like <Code>/blog/crawlability-indexing.html#canonical-urls-one-page-one-address</Code>, so search results can point to the exact section.</>,
                ]} />

                <H2>Chunking by heading</H2>
                <P>
                    Sections under an <Code>h2</Code> are written to be read on their own, which makes them good chunks. Each chunk gets a
                    header with the page title and the section heading, the same trick used for code chunks:
                </P>
                <CodeBlock title="scripts/chunks.mjs">{`import * as cheerio from 'cheerio';
import { createHash } from 'node:crypto';

export function chunksFromHtml(html, pageUrl) {
  const $ = cheerio.load(html);
  const title = $('article h1, h1').first().text().trim();
  const sections = [];
  let current = { heading: title, id: null, text: [] };

  $('article').children().each((_, el) => {
    if (el.tagName === 'h2') {
      sections.push(current);
      current = { heading: $(el).text().trim(), id: $(el).attr('id'), text: [] };
    } else {
      current.text.push($(el).text().trim());
    }
  });
  sections.push(current);

  return sections
    .filter(s => s.text.join('').length > 0)
    .map(s => {
      const body = title + ' › ' + s.heading + '\\n\\n' + s.text.join('\\n');
      return {
        url: s.id ? pageUrl + '#' + s.id : pageUrl,
        body,
        hash: createHash('sha256').update(body).digest('hex'),
      };
    });
}`}</CodeBlock>

                <H2>Incremental embedding with content hashes</H2>
                <P>
                    Embedding every chunk on every build is slow and costs money. Store the hash with each vector. On the next build,
                    embed only chunks whose hash is new, keep the rest, and delete chunks whose URL disappeared:
                </P>
                <CodeBlock title="scripts/sync-index.mjs (sketch)">{`const built = allPages.flatMap(p => chunksFromHtml(p.html, p.url));
const existing = await db.hashesByUrl();              // Map<url, hash>

const changed = built.filter(c => existing.get(c.url) !== c.hash);
const removed = [...existing.keys()].filter(url => !built.some(c => c.url === url));

const vectors = await embed(changed.map(c => c.body));  // one batched call
await db.upsert(changed.map((c, i) => ({ ...c, embedding: vectors[i] })));
await db.delete(removed);

console.log('embedded', changed.length, 'removed', removed.length, 'kept', built.length - changed.length);`}</CodeBlock>
                <P>
                    A typo fix now re-embeds one chunk instead of the whole site. Store the embedding model name with every row too: when
                    the model changes, every hash is effectively new and you rebuild everything on purpose.
                </P>

                <H2>Where the index lives</H2>
                <P>
                    For keyword search on a static site, the index can be static too. Tools such as Pagefind read the built HTML and write
                    a set of small index files that the browser loads on demand. Vector search is different, because each query has to be
                    embedded by the same model. That usually means a small API in front of a vector store, with the static site calling it.
                    Loading either kind of search without slowing the page is covered in{' '}
                    <A href="/blog/core-web-vitals-x-site-search.html">Core Web Vitals × Site Search</A>.
                </P>

                <Callout title="Same build, same truth">
                    Because pages and index come from one build, a page and its search entry can't disagree. Delete a page and its chunks
                    are deleted in the same deploy.
                </Callout>
            </>
        );

        renderPost('/blog/static-generation-x-vector-search.html', CONTROLS, Content);
    </script>
</body>
</html>
