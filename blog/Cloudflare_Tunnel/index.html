<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Tunnel - Lameyer Blog</title>
    <meta name="description" content="Hiding your API origin and closing every inbound port with Cloudflare Tunnel's outbound-only connection.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Run cloudflared next to the API',
            'Bind the API to localhost only',
            'Deny all inbound traffic in the host firewall',
            'End ingress rules with a catch-all 404',
            'Add Access service tokens for machine clients',
            'Rotate the origin IP if it was ever public',
        ];

        const Content = () => (
            <>
                <P>
                    Every layer in this series protects traffic that flows through Cloudflare. They all share one weakness: if an
                    attacker learns your origin server's real IP address, they can send requests straight to it and skip the{' '}
                    <a href="/blog/Edge_Layer_(DDoS_&_DNS)/" className="text-blue-600 font-bold hover:underline">edge</a>,
                    the WAF, API Shield and rate limiting entirely. Cloudflare Tunnel removes that possibility by making the
                    origin unreachable from the public internet.
                </P>

                <H2>Inside-out instead of outside-in</H2>
                <P>
                    A traditional server opens a port, such as 443, and waits for the internet to connect. With Cloudflare Tunnel,
                    a small daemon called <Code>cloudflared</Code> runs next to your API and makes <strong className="text-gray-900">outbound</strong> connections
                    to several nearby Cloudflare data centers. Requests for your hostname travel down those existing connections.
                    Nothing ever connects <em>to</em> your server.
                </P>
                <UL items={[
                    'Every inbound port can be closed. There is nothing to scan and nothing to flood.',
                    'Your origin IP never appears in DNS. The hostname points at the tunnel, not the server.',
                    'The connections are redundant, so losing one data center does not take the API down.',
                ]} />

                <H2>Setting up a tunnel</H2>
                <P>After installing <Code>cloudflared</Code> on the API server:</P>
                <CodeBlock title="Terminal">{`cloudflared tunnel login
cloudflared tunnel create api-origin
cloudflared tunnel route dns api-origin api.example.com`}</CodeBlock>
                <P>Then tell the tunnel where to send traffic:</P>
                <CodeBlock title="~/.cloudflared/config.yml">{`tunnel: <TUNNEL-UUID>
credentials-file: /root/.cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: api.example.com
    service: http://localhost:8000
  # Anything else gets a 404 instead of reaching a service
  - service: http_status:404`}</CodeBlock>
                <CodeBlock title="Terminal">{`cloudflared tunnel run api-origin`}</CodeBlock>
                <P>
                    You can also create and manage tunnels from the Zero Trust dashboard, which gives you a single install command
                    with a token and no config file.
                </P>

                <H2>Lock the doors behind you</H2>
                <P>A tunnel only protects you if the old way in is actually closed:</P>
                <UL items={[
                    <>Bind the API to <Code>127.0.0.1</Code>, not <Code>0.0.0.0</Code>, so it only accepts connections from <Code>cloudflared</Code> on the same machine.</>,
                    <>Set the host or cloud firewall to deny all inbound traffic. <Code>cloudflared</Code> only needs outbound access, on port 7844.</>,
                    'If the server ever had a public DNS record, move it to a new IP address. Historical DNS records can still reveal the old one.',
                ]} />

                <Callout title="Authenticate machines, not just people">
                    Put a Cloudflare Access policy in front of the API hostname and issue <strong>service tokens</strong> to your
                    API clients. Each client sends <Code>CF-Access-Client-Id</Code> and <Code>CF-Access-Client-Secret</Code> headers,
                    and Cloudflare rejects anything without a valid token before it enters the tunnel.
                </Callout>

                <H2>The complete path</H2>
                <P>
                    With the tunnel in place, the only route to your API runs through every layer: DDoS and DNS protection at the
                    edge, WAF and bot filtering, schema validation, rate limiting and finally the tunnel itself. An attacker who wants
                    your data has to get through all five.{' '}
                    <a href="/blog/" className="text-blue-600 font-bold hover:underline">Back to the dashboard</a> to review any layer.
                </P>
            </>
        );

        renderPost('/blog/Cloudflare_Tunnel/', CONTROLS, Content);
    </script>
</body>
</html>
