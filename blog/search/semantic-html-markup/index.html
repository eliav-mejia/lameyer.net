<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Markup - Lameyer Blog</title>
    <meta name="description" content="Semantic HTML for technical sites: landmarks, a real heading outline, links vs buttons, time, pre and code, so browsers, crawlers and chunkers read pages correctly.">
    <link rel="canonical" href="https://lameyer.net/blog/search/semantic-html-markup/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Use header, nav, main, article, aside and footer',
            'One h1 per page, no skipped heading levels',
            'Links navigate, buttons act',
            'Mark dates with time and a datetime attribute',
            'Wrap code samples in pre and code',
            'Set lang on the page and on foreign-language parts',
        ];

        const ELEMENTS = [
            { el: '<main>', meaning: 'The primary content of the page. Exactly one.' },
            { el: '<article>', meaning: 'A self-contained piece that makes sense on its own, such as a post.' },
            { el: '<nav>', meaning: 'A block of navigation links. Label it if there is more than one.' },
            { el: '<aside>', meaning: 'Related but secondary content: a checklist, related posts.' },
            { el: '<time datetime>', meaning: 'A machine-readable date next to the human-readable one.' },
            { el: '<pre><code>', meaning: 'Preformatted code. Add a language class for highlighters.' },
            { el: '<figure>', meaning: 'A diagram, table or listing with its <figcaption>.' },
        ];

        const Content = () => (
            <>
                <P>
                    A <Code>{'<div>'}</Code> styled to look like a heading looks right to a sighted reader and means nothing to everyone
                    else. Screen readers, search engine crawlers, browser reader modes and the chunkers that feed vector indexes all rely on
                    the <em>element</em>, not the styling, to understand a page. Semantic HTML is the cheapest way to make a page
                    understandable to all of them at once.
                </P>

                <H2>Div soup versus meaning</H2>
                <CodeBlock title="Before">{`<div class="top">
  <div class="logo" onclick="goHome()">Lameyer</div>
  <div class="link" onclick="go('/blog/')">Blog</div>
</div>
<div class="content">
  <div class="big-title">Rate Limiting</div>
  <div class="date">Sep 26, 2026</div>
  <div class="sub-title">Why counting by IP isn't enough</div>
</div>`}</CodeBlock>
                <CodeBlock title="After">{`<header>
  <a href="/">Lameyer</a>
  <nav aria-label="Main">
    <a href="/blog/">Blog</a>
  </nav>
</header>
<main>
  <article>
    <h1>Rate Limiting</h1>
    <time datetime="2026-09-26">Sep 26, 2026</time>
    <h2>Why counting by IP isn't enough</h2>
  </article>
</main>`}</CodeBlock>
                <P>
                    The second version can be styled to look identical. The difference is that every tool now knows where the navigation is,
                    which text is the title, when the post was published and how its sections nest.
                </P>

                <H2>The elements that matter most</H2>
                <Table
                    columns={[{ key: 'el', label: 'Element', mono: true }, { key: 'meaning', label: 'Meaning' }]}
                    rows={ELEMENTS}
                />

                <H2>Headings are an outline, not a font size</H2>
                <P>
                    Use one <Code>h1</Code> for the page title and nest <Code>h2</Code> and <Code>h3</Code> beneath it without skipping
                    levels. If a heading needs to look smaller, change its class, not its level. Screen reader users jump between headings
                    to skim, search engines use them to understand topics, and chunkers split documents at them. A broken outline breaks
                    all three.
                </P>

                <H2>Links navigate, buttons act</H2>
                <P>
                    Crawlers discover pages by following <Code>{'<a href>'}</Code>. A <Code>div</Code> with an <Code>onClick</Code> that
                    changes the URL is invisible to them and unreachable from the keyboard. The rule is simple: if it takes you to another
                    URL, use a link; if it changes something on the current page, such as a filter or a menu, use a <Code>{'<button>'}</Code>.
                    This blog follows that rule: post cards are links, filter chips are buttons.
                </P>

                <H2>Language and code</H2>
                <P>
                    The <Code>lang</Code> attribute tells browsers, screen readers and search engines which language they are reading.
                    When part of a page is in another language, mark it: <Code>{'<span lang="es">Sustentabilidad corporativa</span>'}</Code>.
                    For code, <Code>{'<pre><code class="language-python">'}</Code> keeps whitespace intact and tells highlighters,
                    crawlers and extractors that the block is code, not prose.
                </P>

                <Callout title="Semantic HTML helps your own search, too">
                    If you index your documentation for semantic search, clean <Code>h2</Code>/<Code>h3</Code> sections make natural
                    chunks, each with its own title. That is the idea behind{' '}
                    <A href="/blog/search/static-generation-x-vector-search/">Static Generation × Vector Search</A>.
                </Callout>

                <H2>Where markup stops</H2>
                <P>
                    Semantic elements describe the <em>structure</em> of a page. To describe what the page <em>is</em> (a blog post by
                    this author, published on this date, part of this series), add{' '}
                    <A href="/blog/search/structured-data/">Structured Data</A>. And none of this markup helps if it only exists after JavaScript
                    runs, which is why it pairs with <A href="/blog/search/ssr-static-generation/">SSR & Static Generation</A>.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
