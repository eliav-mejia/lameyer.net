<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawlability & Indexing - Lameyer Blog</title>
    <meta name="description" content="Crawlability and indexing: robots.txt, XML sitemaps, canonical URLs, status codes, hash routes and internal links that decide whether pages get found.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Link every page from at least one other page',
            'Use real paths, not #/ hash routes',
            'Publish sitemap.xml and reference it in robots.txt',
            'Escape & as &amp; inside the sitemap',
            'Set one absolute canonical URL per page',
            'Return a real 404 status for missing pages',
            'Use noindex, not robots.txt, to keep pages out',
        ];

        const STEPS = [
            { step: 'Discover', how: 'Links from other pages, sitemaps', breaks: 'Orphan pages, JavaScript-only links, hash routes' },
            { step: 'Crawl', how: 'robots.txt allows it, server answers', breaks: 'Disallow rules, 5xx errors, slow responses' },
            { step: 'Render', how: 'HTML (and possibly JavaScript) is processed', breaks: 'Content only in client-side JS, blocked scripts' },
            { step: 'Index', how: 'The page is chosen as the canonical version', breaks: 'Duplicates, noindex, soft 404s, thin content' },
        ];

        const Content = () => (
            <>
                <P>
                    A search engine can only rank a page it has found, fetched and decided to keep. Each step can fail silently: the page
                    works fine in your browser and simply never appears in results. This post covers the plumbing, with this site as the
                    running example.
                </P>

                <H2>Four steps, four ways to fail</H2>
                <Table
                    columns={[{ key: 'step', label: 'Step', accent: true }, { key: 'how', label: 'Requires' }, { key: 'breaks', label: 'Common failures' }]}
                    rows={STEPS}
                />

                <H2>Discovery: links and real URLs</H2>
                <P>
                    Crawlers find pages by following <Code>{'<a href>'}</Code> links. A page no other page links to (an{' '}
                    <strong className="text-gray-900">orphan</strong>) may only be found through a sitemap, and gets little weight.
                    The blog dashboard and the previous/next links at the end of each post exist partly for this reason.
                </P>
                <P>
                    Hash routes are a common trap. Search engines ignore the part of a URL after <Code>#</Code>, so{' '}
                    <Code>/#/development</Code> and <Code>/#/stack</Code> are the same URL to them: the home page. If the content also lives
                    at a real path such as <Code>/pages/development/</Code>, link to that path instead.
                </P>

                <H2>robots.txt and sitemap.xml</H2>
                <P>
                    <Code>robots.txt</Code> says what crawlers may fetch; the sitemap lists what you want them to find. Keep the first
                    permissive and the second complete:
                </P>
                <CodeBlock title="/robots.txt">{`User-agent: *
Allow: /

Sitemap: https://lameyer.net/sitemap.xml`}</CodeBlock>
                <CodeBlock title="/sitemap.xml (excerpt)">{`<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://lameyer.net/blog/</loc>
    <lastmod>2026-10-02</lastmod>
  </url>
  <url>
    <loc>https://lameyer.net/blog/search/crawlability-indexing/</loc>
    <lastmod>2026-10-02</lastmod>
  </url>
</urlset>`}</CodeBlock>
                <Callout title="Folder names with & and parentheses">
                    Paths on this blog contain <Code>&</Code>, <Code>(</Code> and <Code>)</Code>. They are valid in URLs, but a sitemap is
                    XML, so <Code>&</Code> must be written as <Code>&amp;amp;</Code> or the whole file fails to parse. Generate the
                    sitemap from <Code>BLOG_POSTS</Code> with a proper XML escape rather than by hand.
                </Callout>

                <H2>Canonical URLs: one page, one address</H2>
                <P>
                    The same content is often reachable at several URLs: with and without a trailing slash, with tracking parameters, or with
                    filter parameters such as <Code>/blog/?type=crawl</Code>. A canonical link names the preferred version:
                </P>
                <CodeBlock title="In each page's head">{`<link rel="canonical" href="https://lameyer.net/blog/search/crawlability-indexing/">`}</CodeBlock>
                <P>
                    Use absolute URLs and be consistent with trailing slashes. For filter pages specifically, see{' '}
                    <A href="/blog/search/crawlability-x-faceted-search/">Crawlability × Faceted Search</A>.
                </P>

                <H2>Status codes and soft 404s</H2>
                <P>
                    A missing page must return HTTP 404. Single-page apps often serve their shell with status 200 for every path and then
                    show "Not found" with JavaScript. Search engines treat that as a soft 404 and may waste crawls on it. Static hosts such as
                    GitHub Pages return a real 404 with your <Code>404.html</Code>, as long as you don't route everything to one file.
                </P>

                <H2>Keeping pages out of the index</H2>
                <P>
                    <Code>Disallow</Code> in robots.txt stops crawling, not indexing: a blocked URL can still appear in results if other
                    sites link to it, and the crawler can't see a <Code>noindex</Code> tag on a page it is not allowed to fetch. To keep a
                    page out, allow crawling and add <Code>{'<meta name="robots" content="noindex">'}</Code>.
                </P>

                <H2>Check, don't guess</H2>
                <P>
                    Search Console's URL Inspection tool shows whether a URL is indexed, which canonical Google chose and what the rendered
                    HTML looked like. The Page indexing report lists every excluded URL with the reason. Once pages are being indexed,{' '}
                    <A href="/blog/search/structured-data/">Structured Data</A> helps search engines understand what each one is.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
