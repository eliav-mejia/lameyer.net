<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de código y organización de repositorios - Blog de Lameyer</title>
    <meta name="description" content="Organizar, filtrar y buscar semánticamente código y repositorios: estructura, metadatos, calificadores, búsqueda vectorial y publicación de páginas que se puedan encontrar.">
    <link rel="canonical" href="https://lameyer.net/blog/search/code-search-repository-organization/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Elige una convención de estructura y documéntala en el README',
            'Añade CODEOWNERS para que cada ruta tenga un responsable',
            'Etiqueta los repositorios con topics, lenguaje y estado',
            'Enseña al equipo los calificadores de búsqueda de código',
            'Añade búsqueda semántica solo cuando los filtros funcionen',
            'Mide la calidad de la búsqueda con un benchmark',
        ];

        const STAGES = [
            { stage: 'Organizar', question: '¿Dónde vive este código y quién es su responsable?', post: 'Este artículo, más abajo' },
            { stage: 'Filtrar', question: 'Reducir millones de líneas a unos cientos de candidatos.', post: <A href="/blog/search/search-as-code-sac/">Search as Code</A> },
            { stage: 'Buscar por significado', question: 'Encontrar el código que hace X, se llame como se llame.', post: <A href="/blog/search/semantic-vector-search/">Búsqueda semántica y vectorial</A> },
            { stage: 'Medir', question: '¿El último cambio mejoró o empeoró los resultados?', post: <A href="/blog/search/benchmark-curation-reap-harvest/">Curación de benchmarks</A> },
            { stage: 'Publicar', question: '¿Pueden encontrar la documentación quienes están fuera del repositorio?', post: <A href="/blog/search/ssr-static-generation/">SSR y generación estática</A> },
        ];

        const Content = () => (
            <>
                <P>
                    La mayoría de los equipos no tienen un problema de búsqueda. Tienen un <strong className="text-gray-900">problema de organización</strong> que
                    aparece como un problema de búsqueda. Cuando el código está repartido en decenas de repositorios con nombres
                    incoherentes, sin responsables y sin metadatos, ningún buscador puede ordenarlo bien, sea semántico o no. Esta serie
                    sigue el camino desde un repositorio bien organizado hasta una página que personas, rastreadores y asistentes de IA
                    puedan encontrar.
                </P>

                <H2>El camino en cinco pasos</H2>
                <Table
                    columns={[{ key: 'stage', label: 'Paso', accent: true }, { key: 'question', label: 'Pregunta que responde' }, { key: 'post', label: 'Leer' }]}
                    rows={STAGES}
                />
                <P>
                    Los cuatro primeros pasos tratan de la <em>recuperación</em> dentro de tu organización. El último trata del <em>descubrimiento</em> en
                    la web abierta, y se divide a su vez en cinco temas: renderizado, marcado, velocidad, rastreabilidad y datos estructurados.
                </P>

                <H2>Organizar: estructura antes que búsqueda</H2>
                <P>
                    Elegir un monorepo o muchos repositorios importa menos que ser coherente. Una estructura predecible permite que un
                    filtro de ruta haga casi todo el trabajo: si cada servicio guarda sus handlers HTTP en <Code>src/handlers/</Code>,{' '}
                    <Code>path:src/handlers</Code> ya es una consulta precisa.
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Nombres.</strong> Usa un único esquema para los nombres de repositorio, por ejemplo <Code>equipo-dominio-tipo</Code> (<Code>payments-ledger-api</Code>).</>,
                    <><strong className="text-gray-900">Responsables.</strong> Un archivo <Code>CODEOWNERS</Code> asigna rutas a equipos. Dirige las solicitudes de revisión y responde a «¿a quién pregunto por esto?».</>,
                    <><strong className="text-gray-900">Metadatos.</strong> Los topics de GitHub, la descripción, la licencia y el lenguaje principal se pueden filtrar. Archiva los repositorios que ya no mantienes para poder excluirlos.</>,
                    <><strong className="text-gray-900">READMEs.</strong> El primer párrafo de un README suele ser el mejor resumen de un repositorio. También es lo primero que leen los buscadores y los modelos de embeddings.</>,
                ]} />
                <CodeBlock title=".github/CODEOWNERS">{`# Gana el último patrón que coincide
*                    @acme/platform
/src/payments/       @acme/payments
/src/search/         @acme/search-relevance
/docs/               @acme/devrel`}</CodeBlock>

                <H2>Filtrar: la relevancia más barata que vas a conseguir</H2>
                <P>
                    Antes de que se ejecute cualquier modelo de ranking, los filtros eliminan todo lo que no puede ser la respuesta. La
                    búsqueda de código de GitHub, por ejemplo, admite calificadores como <Code>org:</Code>, <Code>repo:</Code>, <Code>language:</Code>, <Code>path:</Code> y{' '}
                    <Code>symbol:</Code>, además de operadores booleanos y expresiones regulares:
                </P>
                <CodeBlock title="Búsqueda de código de GitHub">{`org:acme language:python path:src/payments symbol:retry_charge
org:acme /idempotency[_-]?key/ NOT path:test`}</CodeBlock>
                <P>
                    Los filtros solo funcionan cuando los metadatos existen, y por eso la organización va primero. Escribir estas consultas,
                    revisarlas y reutilizarlas es la idea detrás de <A href="/blog/search/search-as-code-sac/">Search as Code</A>.
                </P>

                <H2>Buscar por significado: cuando las palabras clave fallan</H2>
                <P>
                    La búsqueda por palabras clave falla cuando quien busca usa palabras distintas de quien escribió el código. Una búsqueda
                    de «reintentar pagos fallidos» no encontrará una función llamada <Code>reattempt_charge</Code>. Los modelos de embeddings
                    sitúan ambas en puntos cercanos de un espacio vectorial, así que la <A href="/blog/search/semantic-vector-search/">búsqueda semántica</A> sí la encuentra.
                    En la práctica, los mejores sistemas combinan las dos: palabras clave para los identificadores exactos y vectores para la intención.
                </P>

                <H2>Medir: relevancia que puedes demostrar</H2>
                <P>
                    Cada cambio en el troceado, los filtros, los sinónimos o el modelo de embeddings cambia los resultados. Sin un conjunto
                    fijo de consultas reales y respuestas correctas conocidas, no puedes saber si las cosas han mejorado.{' '}
                    <A href="/blog/search/benchmark-curation-reap-harvest/">La curación de benchmarks</A> explica cómo construir ese conjunto
                    a partir del historial de tu propio repositorio.
                </P>

                <H2>Publicar: que te encuentren fuera del repositorio</H2>
                <P>
                    La documentación, los changelogs y las páginas de proyecto son la forma en que la mayoría de la gente conoce tu código.
                    Necesitan HTML que exista antes de que se ejecute JavaScript (<A href="/blog/search/ssr-static-generation/">SSR y generación estática</A>),
                    un marcado con significado (<A href="/blog/search/semantic-html-markup/">HTML semántico</A>), buen
                    rendimiento (<A href="/blog/search/core-web-vitals-page-speed/">Core Web Vitals</A>), URLs a las que lleguen los
                    rastreadores (<A href="/blog/search/crawlability-indexing/">Rastreabilidad e indexación</A>) y una descripción legible
                    por máquinas (<A href="/blog/search/structured-data/">Datos estructurados</A>).
                </P>

                <Callout title="Donde se encuentran las etapas">
                    Las lecciones más útiles están entre etapas, así que esta serie también tiene artículos de cruce. Por ejemplo,{' '}
                    <A href="/blog/search/structured-data-x-repositories/">Datos estructurados × repositorios</A> aplica a las páginas
                    públicas los mismos metadatos que usas en los filtros internos, y{' '}
                    <A href="/blog/search/benchmarks-x-search-as-code/">Benchmarks × Search as Code</A> convierte tu benchmark en una barrera de CI.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
