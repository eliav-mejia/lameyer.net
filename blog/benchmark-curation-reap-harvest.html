<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Curation (REAP / Harvest) - Lameyer Blog</title>
    <meta name="description" content="Building a code search benchmark from repository history: harvesting real queries, filtering them with REAP, and scoring with Recall@k, MRR and nDCG.">
    <link rel="canonical" href="https://lameyer.net/blog/benchmark-curation-reap-harvest.html">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Harvest queries from real issues, PRs and search logs',
            'Pin every item to a commit snapshot',
            'Grade relevance, not just right or wrong',
            'Remove queries that leak the answer',
            'Deduplicate near-identical items',
            'Report Recall@k, MRR and nDCG@10 together',
        ];

        const SOURCES = [
            { source: 'Issue → merged PR', query: 'Issue title and first paragraph', gold: 'Files and functions the PR changed' },
            { source: 'Search logs', query: 'What people typed', gold: 'Results they opened and kept open' },
            { source: 'Chat and Q&A threads', query: '"Where do we…?" questions', gold: 'The code links in the accepted answer' },
            { source: 'Code review comments', query: '"Same as in X?" remarks', gold: 'The location the reviewer pointed to' },
        ];

        const METRICS = [
            { metric: 'Recall@k', measures: 'Share of queries with at least one relevant result in the top k.', use: 'First-stage retrieval. Did the candidate set contain the answer?' },
            { metric: 'MRR', measures: 'Average of 1 / rank of the first relevant result.', use: 'Single-answer lookups like "where is X defined?"' },
            { metric: 'nDCG@10', measures: 'Graded relevance, discounted by position, normalized to the ideal order.', use: 'Overall ranking quality when several results are useful.' },
        ];

        const Content = () => (
            <>
                <P>
                    A benchmark is a fixed set of queries with known good answers. It is the only way to tell whether a change to{' '}
                    <A href="/blog/semantic-vector-search.html">semantic search</A> or to your <A href="/blog/search-as-code-sac.html">search
                    config</A> made results better or worse. Public benchmarks are a good sanity check, but they don't contain your code,
                    your vocabulary or your users' questions. The most useful benchmark is the one you curate from your own repository history.
                </P>
                <P>
                    We split curation into two phases: <strong className="text-gray-900">Harvest</strong> collects many candidate items
                    cheaply, and <strong className="text-gray-900">REAP</strong> filters them down to a set you can trust.
                </P>

                <H2>Harvest: mine the history you already have</H2>
                <P>
                    Every closed issue with a linked pull request is a natural search task: the issue describes a problem in human words,
                    and the diff shows where in the code the answer was. Public datasets such as SWE-bench were built in a similar way from
                    GitHub issues and pull requests. Other good sources:
                </P>
                <Table
                    columns={[{ key: 'source', label: 'Source', accent: true }, { key: 'query', label: 'Query' }, { key: 'gold', label: 'Gold answer' }]}
                    rows={SOURCES}
                />
                <CodeBlock title="benchmark/queries.jsonl (one item)">{`{"id": "q-0142",
 "query": "card payments are retried forever when the PSP times out",
 "snapshot": "9f3c2e1",
 "source": "issue#2231 -> pr#2240",
 "relevant": [
   {"path": "src/payments/retry.py", "symbol": "PaymentRetrier.reattempt_charge", "grade": 3},
   {"path": "src/payments/psp_client.py", "symbol": "PspClient.charge", "grade": 2},
   {"path": "docs/payments/retries.md", "grade": 1}
 ]}`}</CodeBlock>
                <P>
                    The <Code>snapshot</Code> field matters. Code moves, so every item is evaluated against the commit it was harvested from,
                    using the code as it was <em>before</em> the fix.
                </P>

                <H2>REAP: from candidates to a benchmark</H2>
                <P>
                    Harvested items are noisy. Some issues are vague, some PRs touch twenty unrelated files, some queries name the file
                    they are looking for. We run every candidate through four checks, which we abbreviate as REAP:
                </P>
                <UL items={[
                    <><strong className="text-gray-900">R · Resolve.</strong> Check out the snapshot and confirm every gold path and symbol exists there. Drop items whose answer only appeared in the fix itself.</>,
                    <><strong className="text-gray-900">E · Evaluate.</strong> Keep only queries a person could reasonably answer. Discard one-word issues, duplicates of other issues and PRs that are mostly formatting or dependency bumps.</>,
                    <><strong className="text-gray-900">A · Annotate.</strong> Grade each relevant result: 3 = the answer, 2 = needed to understand it, 1 = related context. Have a second person grade a sample and measure how often you agree.</>,
                    <><strong className="text-gray-900">P · Prune.</strong> Remove items whose query contains the gold file name or symbol (they test string matching, not search), merge near-duplicates and balance the set across repositories and languages.</>,
                ]} />
                <Callout title="Watch for contamination">
                    If a query includes the exact identifier it is looking for, any keyword search will score perfectly on it. If your
                    benchmark is built from public repositories, embedding models may also have seen the answers during training. Private
                    history and the Prune step protect against both.
                </Callout>

                <H2>Scoring</H2>
                <P>No single number tells the whole story. Report three:</P>
                <Table
                    columns={[{ key: 'metric', label: 'Metric', accent: true }, { key: 'measures', label: 'What it measures' }, { key: 'use', label: 'Use it for' }]}
                    rows={METRICS}
                />
                <CodeBlock title="metrics.py">{`import math

def recall_at_k(ranked, relevant, k=10):
    return float(any(doc in relevant for doc in ranked[:k]))

def reciprocal_rank(ranked, relevant):
    for i, doc in enumerate(ranked, start=1):
        if doc in relevant:
            return 1 / i
    return 0.0

def ndcg_at_k(ranked, grades, k=10):
    """grades: dict of doc -> relevance grade (0-3)."""
    dcg = sum(grades.get(doc, 0) / math.log2(i + 1) for i, doc in enumerate(ranked[:k], start=1))
    ideal = sorted(grades.values(), reverse=True)[:k]
    idcg = sum(g / math.log2(i + 1) for i, g in enumerate(ideal, start=1))
    return dcg / idcg if idcg else 0.0`}</CodeBlock>

                <H2>How big, and how often?</H2>
                <P>
                    A few hundred well-curated items beat thousands of noisy ones. Start with 100 to 200, make sure each repository and
                    language you care about is represented, and add new items every month from fresh issues so the set keeps up with your
                    code. Keep a small held-out slice you never tune against, so you can detect overfitting.
                </P>

                <H2>From benchmark to safety net</H2>
                <P>
                    A benchmark you run by hand once a quarter catches problems months late. Running it automatically on every
                    search-config pull request turns it into a regression test. See{' '}
                    <A href="/blog/benchmarks-x-search-as-code.html">Benchmarks × Search as Code</A>.
                </P>
            </>
        );

        renderPost('/blog/benchmark-curation-reap-harvest.html', CONTROLS, Content);
    </script>
</body>
</html>
