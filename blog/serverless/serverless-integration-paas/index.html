<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones × PaaS de integración - Blog de Lameyer</title>
    <meta name="description" content="Construir una plataforma de integración con funciones edge: un Worker por conector, credenciales en secretos, mapeos en el código y un gateway compartido, para que añadir un sistema sea un despliegue, no un servidor.">
    <link rel="canonical" href="https://lameyer.net/blog/serverless/serverless-integration-paas/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Un Worker conector por sistema externo',
            'Todos los conectores hablan un único formato de evento interno',
            'Credenciales en secretos, limitadas a cada conector',
            'Mapeos de campos en archivos versionados, no en ramas del código',
            'Cada webhook entrante se verifica y se encola primero',
            'Una cola de mensajes fallidos y un botón de reenvío por conector',
        ];

        const COMPARE = [
            { option: 'Scripts punto a punto', cost: 'Bajo al principio, crece con cada pareja', risk: 'Nadie sabe qué habla con qué' },
            { option: 'Servidor de integración (IaaS)', cost: 'Fijo mensual, se paga aunque esté parado', risk: 'Un servidor que parchear, escalar y respaldar' },
            { option: 'iPaaS comercial', cost: 'Por tarea o por conector, a menudo alto', risk: 'Lógica atrapada en la interfaz de un proveedor' },
            { option: 'Plataforma de integración serverless', cost: 'Por petición y tiempo de CPU', risk: 'Necesita disciplina de ingeniería (este artículo)' },
        ];

        const Content = () => (
            <>
                <P>
                    Nuestro servicio principal es conectar sistemas: un ERP con un CRM, una tienda con un programa de contabilidad, un
                    formulario con una hoja de cálculo y un proveedor de facturación. Hecho script a script, esto se convierte en una maraña
                    que nadie puede mantener. Hecho en un servidor de integración alquilado, se convierte en una máquina que cuesta dinero
                    todo el mes para trabajar unos minutos por hora. Este cruce muestra cómo las piezas de la serie Serverless Edge (
                    <A href="/blog/serverless/edge-functions-workers/">funciones</A>,{' '}
                    <A href="/blog/serverless/routing-caching-auth-edge/">enrutado</A> y{' '}
                    <A href="/blog/serverless/edge-storage-kv-d1-r2/">almacenamiento</A>) se combinan en una{' '}
                    <strong className="text-gray-900">plataforma de integración que operas como servicio</strong>: un PaaS propio, sin servidores.
                </P>

                <H2>Por qué construirla en serverless</H2>
                <Table
                    columns={[{ key: 'option', label: 'Opción', accent: true }, { key: 'cost', label: 'Modelo de coste' }, { key: 'risk', label: 'Riesgo principal' }]}
                    rows={COMPARE}
                />
                <P>
                    El tráfico de integración llega a ráfagas: tranquilo durante horas y luego un lote de 5.000 pedidos a fin de mes. El
                    precio de serverless sigue esa forma, y no hay capacidad que planificar para el pico.
                </P>

                <H2>La arquitectura</H2>
                <CodeBlock title="Estructura de la plataforma">{`Sistemas externos                Plataforma (Workers)                  Tu núcleo
─────────────────                ──────────────────────────           ─────────────
Shopify ──webhook──►  gateway ──► connector-shopify ─┐
Stripe  ──webhook──►  (verifica,  connector-stripe  ─┼─► cola de eventos ─► core-adapter ──► Modular Core
HubSpot ◄──API─────    enruta,    connector-hubspot ◄┘        │
ERP     ◄──Tunnel──    limita)    connector-erp     ◄─────────┘
                                         │
                       D1: ajustes de conectores · KV: caché de tokens · R2: archivo de payloads`}</CodeBlock>
                <UL items={[
                    <><strong className="text-gray-900">Gateway.</strong> Un único Worker público: verifica firmas y tokens, aplica límites y enruta al conector correcto.</>,
                    <><strong className="text-gray-900">Conectores.</strong> Un Worker por sistema externo, accesible solo a través de service bindings. Cada uno traduce entre ese sistema y un único formato de evento interno.</>,
                    <><strong className="text-gray-900">Cola de eventos.</strong> Todo lo que entra se convierte en un evento en una cola, así que un destino lento o caído nunca bloquea al origen.</>,
                    <><strong className="text-gray-900">Adaptador del núcleo.</strong> Llama a los <A href="/blog/core/contracts-typed-apis/">contratos tipados</A> del núcleo modular. Las reglas de negocio se quedan allí.</>,
                ]} />

                <H2>Un único formato de evento interno</H2>
                <P>
                    Con N sistemas, la integración punto a punto necesita hasta N × (N − 1) traducciones. Con un formato interno único, cada
                    sistema necesita un conector que traduzca hacia y desde él. Eso es lo que hace que la décima integración sea tan barata
                    como la segunda.
                </P>
                <CodeBlock title="packages/contracts/events/order-paid.v1.json (extracto)">{`{
  "type": "order.paid.v1",
  "id": "evt_01J9...",            // clave de idempotencia, única por evento
  "source": "shopify",
  "occurredAt": "2026-10-04T15:20:11Z",
  "tenant": "acme",
  "data": {
    "orderId": "1042",
    "customer": { "email": "ana@example.com", "taxId": "XAXX010101000" },
    "lines": [{ "sku": "RAM-DDR5-32", "quantity": 2, "unitPrice": { "amount": 189900, "currency": "MXN" } }]
  }
}`}</CodeBlock>

                <H2>Mapeos como datos, credenciales como secretos</H2>
                <P>
                    Los sistemas de cada cliente están configurados de forma un poco distinta: un campo personalizado en el CRM, otro código
                    fiscal en el ERP. Pon esas diferencias en archivos de mapeo, versionados en git y cargados por inquilino desde D1 o KV, en
                    lugar de ramas <Code>if (tenant === 'acme')</Code> en el código. Las credenciales (claves de API, refresh tokens de OAuth)
                    van en secretos del Worker o en una tabla cifrada de D1, limitadas para que cada conector solo pueda leer las suyas.
                </P>
                <CodeBlock title="mappings/acme/hubspot.yaml">{`target: hubspot.deal
fields:
  dealname:        "Pedido {{data.orderId}}"
  amount:          "{{data.total.amount | cents_to_decimal}}"
  pipeline:        "default"
  rfc_cliente:     "{{data.customer.taxId}}"     # propiedad personalizada en el CRM de este inquilino
on_conflict: update_by_external_id`}</CodeBlock>

                <H2>Los fallos son normales; hazlos visibles</H2>
                <UL items={[
                    <><strong className="text-gray-900">Reintentos con backoff</strong> en cada consumidor de cola. Las APIs de terceros fallan todos los días.</>,
                    <><strong className="text-gray-900">Una cola de mensajes fallidos por conector</strong>, para que un mapeo roto de un sistema no detenga a los demás.</>,
                    <><strong className="text-gray-900">Un archivo en R2</strong> de cada payload entrante, para poder reenviar cualquier evento tras un arreglo.</>,
                    <><strong className="text-gray-900">Paneles por conector</strong> a partir de <A href="/blog/serverless/logs-tracing-cost/">logs estructurados</A>: eventos recibidos, entregados y fallidos, y antigüedad del pendiente más antiguo.</>,
                ]} />

                <H2>Añadir un sistema es un despliegue</H2>
                <P>
                    Un cliente nuevo quiere conectar su sistema de facturación. En esta plataforma eso es un Worker conector nuevo, un archivo
                    de mapeo y un secreto, todo mediante un pull request. No se aprovisiona ningún servidor ni se toca ningún conector
                    existente. Eso es lo que convierte las integraciones en un producto que puedes vender una y otra vez, no en un proyecto que
                    reconstruyes cada vez.
                </P>

                <H2>Medirlo</H2>
                <P>
                    Las cifras que importan a los clientes: tiempo para añadir un sistema nuevo (objetivo: días, no semanas), tasa de entrega
                    correcta por conector, latencia de extremo a extremo desde el evento de origen hasta la actualización en el destino y coste
                    mensual de la plataforma comparado con el servidor de integración o la suscripción iPaaS que sustituyó.
                </P>

                <Callout title="Relacionado">
                    El lado de los webhooks y las colas se trata a fondo en <A href="/blog/workflows/serverless-workflow-automation/">Automatización
                    de flujos</A>. Los endpoints públicos de webhooks están protegidos por las capas de{' '}
                    <A href="/blog/?series=security">Seguridad de APIs</A>. A los sistemas que solo existen en local se llega como se muestra en{' '}
                    <A href="/blog/serverless/serverless-in-front-of-iaas/">Edge × IaaS (híbrido)</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
