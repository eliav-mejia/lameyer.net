<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs, trazas y costes - Blog de Lameyer</title>
    <meta name="description" content="Observabilidad para una plataforma serverless: IDs de petición a través del edge, las colas y el núcleo, Workers Logs y Logpush, trazas OpenTelemetry y seguimiento del tiempo de CPU y del coste por cliente.">
    <link rel="canonical" href="https://lameyer.net/blog/serverless/logs-tracing-cost/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Crea un único ID de petición en el edge y pásalo a todas partes',
            'Registra objetos JSON, no frases',
            'Incluye inquilino, ruta y resultado en cada línea de log',
            'Envía los logs a almacenamiento a largo plazo con Logpush',
            'Vigila el tiempo de CPU por ruta, no solo el número de peticiones',
            'Revisa cada mes el coste por inquilino',
        ];

        const SIGNALS = [
            { signal: 'Logs', answers: '¿Qué pasó en esta petición?', tool: 'Workers Logs, wrangler tail, Logpush' },
            { signal: 'Trazas', answers: '¿En qué se fue el tiempo?', tool: 'Trazas de Workers, exportación OpenTelemetry' },
            { signal: 'Métricas', answers: '¿Va mejor o peor?', tool: 'Analíticas de Workers, Analytics Engine' },
            { signal: 'Coste', answers: '¿Quién está inflando la factura?', tool: 'Peticiones + tiempo de CPU, agrupados por inquilino' },
        ];

        const Content = () => (
            <>
                <P>
                    En un servidor puedes entrar y echar un vistazo. En una plataforma serverless no hay nada a lo que entrar: la función se
                    ejecutó en alguna ubicación, terminó en 30 milisegundos y ya no está. Si algo falla entre el edge, una cola y el núcleo, la
                    única forma de verlo es a través de lo que registró el código. La observabilidad tiene que diseñarse desde el principio, y
                    en serverless además te dice cuánto cuesta la plataforma y <strong className="text-gray-900">qué cliente</strong> está
                    generando ese coste.
                </P>

                <H2>Cuatro señales, cuatro preguntas</H2>
                <Table
                    columns={[{ key: 'signal', label: 'Señal', accent: true }, { key: 'answers', label: 'Responde' }, { key: 'tool', label: 'En Cloudflare' }]}
                    rows={SIGNALS}
                />

                <H2>Un ID de petición, de principio a fin</H2>
                <P>
                    Crea un ID en el edge, o reutiliza la cabecera <Code>cf-ray</Code>, y pásalo en cada salto: al núcleo como cabecera, en los
                    mensajes de las colas, en los pasos de los flujos. Así, una sola búsqueda encuentra toda la historia de una petición,
                    incluso cuando una parte se ejecutó una hora después en un consumidor de cola.
                </P>
                <CodeBlock title="src/log.ts">{`export function logger(request: Request, base: Record<string, unknown> = {}) {
  const requestId = request.headers.get('x-request-id') ?? request.headers.get('cf-ray') ?? crypto.randomUUID();
  const log = (level: string, msg: string, extra: Record<string, unknown> = {}) =>
    console.log(JSON.stringify({ level, msg, requestId, ...base, ...extra, ts: Date.now() }));
  return { requestId, info: (m, e) => log('info', m, e), error: (m, e) => log('error', m, e) };
}

// En el gateway
const log = logger(request, { tenant: user.tenant, route: '/v1/orders' });
const res = await env.CORE.fetch(url, { headers: { 'x-request-id': log.requestId } });
log.info('forwarded', { status: res.status });

// En un mensaje de cola
await env.SYNC_QUEUE.send({ requestId: log.requestId, orderId });`}</CodeBlock>
                <P>
                    El JSON estructurado importa. Workers Logs indexa los campos, así que puedes filtrar por <Code>tenant = "acme"</Code> y{' '}
                    <Code>status &gt;= 500</Code> en lugar de buscar texto.
                </P>

                <H2>Adónde van los logs</H2>
                <UL items={[
                    <><strong className="text-gray-900">Mientras depuras:</strong> <Code>wrangler tail</Code> muestra en directo los logs de producción, filtrados por estado o por texto.</>,
                    <><strong className="text-gray-900">En el día a día:</strong> activa <Code>observability</Code> en la configuración del Worker para conservar logs consultables en el panel durante un periodo de retención limitado.</>,
                    <><strong className="text-gray-900">A largo plazo y para auditorías:</strong> Logpush envía los logs a R2 o a tu plataforma de logs actual. Los clientes de integración suelen necesitar meses de historial para responder a «¿llegó alguna vez ese pedido al ERP?».</>,
                    <><strong className="text-gray-900">Procesado a medida:</strong> un Tail Worker recibe los eventos de otros Workers y puede ocultar datos, muestrearlos o reenviarlos.</>,
                ]} />
                <Callout title="No registres lo que debes proteger">
                    Los payloads de integración llevan nombres, direcciones y a veces identificadores fiscales. Registra identificadores y
                    resultados, no cuerpos completos, y oculta datos en un Tail Worker si hay que conservar un payload para depurar.
                </Callout>

                <H2>Las trazas muestran adónde va el tiempo</H2>
                <P>
                    Una petición lenta puede serlo en el edge, en una subpetición a un CRM o en la base de datos del núcleo. Los Workers pueden
                    emitir trazas automáticamente para las llamadas <Code>fetch</Code> y los bindings, y exportarlas en formato OpenTelemetry a
                    la herramienta de trazas que ya usas. Si el núcleo también habla OpenTelemetry y recibe las cabeceras de contexto de traza,
                    ves una sola traza desde la petición del usuario hasta la consulta SQL.
                </P>

                <H2>El coste también es una métrica</H2>
                <P>
                    El precio de serverless depende sobre todo de dos cifras: peticiones y milisegundos de CPU. Ambas se pueden medir por ruta
                    y por inquilino, algo que IaaS rara vez permite. La factura de una VM te dice cuánto costó el servidor. Una factura
                    serverless bien desglosada te dice cuánto costó cada cliente y cada funcionalidad.
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Tiempo de CPU por ruta.</strong> Una ruta cuyo tiempo de CPU se duplicó tras un lanzamiento es un bug de rendimiento y un bug de coste.</>,
                    <><strong className="text-gray-900">Peticiones por inquilino.</strong> La base de los precios por uso (consulta <A href="/blog/serverless/multi-tenant-saas-metering/">Medición × SaaS multiinquilino</A>).</>,
                    <><strong className="text-gray-900">Subpeticiones por petición.</strong> Un bucle que llama al CRM una vez por línea de pedido aparece aquí primero.</>,
                    <><strong className="text-gray-900">Crecimiento del almacenamiento.</strong> R2 y D1 crecen en silencio. Revísalos cada mes junto con la factura.</>,
                ]} />

                <H2>Medirlo</H2>
                <P>
                    La prueba de la observabilidad es el tiempo: ¿cuánto se tarda en responder a «qué le pasó al pedido 4815»? Apunta a
                    minutos, con una sola búsqueda. Controla el tiempo medio de detección y de resolución de incidencias, y la proporción de
                    incidencias detectadas por alertas y no por clientes.
                </P>

                <Callout title="Adónde lleva esto">
                    Con cifras por inquilino, una plataforma serverless se puede vender, no solo operar. Los cruces muestran cómo:{' '}
                    <A href="/blog/serverless/serverless-integration-paas/">PaaS de integración</A>,{' '}
                    <A href="/blog/serverless/serverless-in-front-of-iaas/">Edge × IaaS</A> y{' '}
                    <A href="/blog/serverless/multi-tenant-saas-metering/">SaaS multiinquilino</A>. Para seguir construyendo sobre el recorrido de
                    la petición, continúa con <A href="/blog/serverless/realtime-websockets-durable-objects/">Tiempo real en el edge</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
