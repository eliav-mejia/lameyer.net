<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routing, Caching & Auth at the Edge - Lameyer Blog</title>
    <meta name="description" content="Turning a Cloudflare Worker into an API gateway: version routing, JWT verification, per-key rate limits and cache rules, so the core only sees authenticated, uncached requests.">
    <link rel="canonical" href="https://lameyer.net/blog/serverless/routing-caching-auth-edge/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Verify every token at the edge, before routing',
            'Pass identity to the core in signed headers only',
            'Route by major version in the path',
            'Cache GETs by explicit rules, never by default',
            'Rate-limit per API key, not per IP',
            'Return the same error format from every route',
        ];

        const ORDER = [
            { step: '1. Normalize', what: 'Lowercase host, strip trailing slash, resolve version', why: 'Every later step sees one canonical URL' },
            { step: '2. Authenticate', what: 'Verify JWT or API key', why: 'Rejected requests cost almost nothing' },
            { step: '3. Rate limit', what: 'Count by key or tenant', why: 'Abuse stops before it reaches cache or core' },
            { step: '4. Cache', what: 'Serve GETs that are safe to share', why: 'Most reads never leave the edge' },
            { step: '5. Forward', what: 'Call the core with trusted headers', why: 'The core only sees work it must do' },
        ];

        const Content = () => (
            <>
                <P>
                    Once a Worker is the front door (see <A href="/blog/serverless/edge-functions-workers/">Edge Functions</A>), it can
                    do the job a separate API gateway product used to do: decide where each request goes, who is allowed to make it, and
                    whether the answer is already known. Done in the right order, the core ends up receiving only requests that are
                    <strong className="text-gray-900"> authenticated, within limits and not already cached</strong>.
                </P>

                <H2>The order matters</H2>
                <Table
                    columns={[{ key: 'step', label: 'Step', accent: true }, { key: 'what', label: 'What' }, { key: 'why', label: 'Why here' }]}
                    rows={ORDER}
                />
                <P>
                    Authentication comes before caching for any private data. Otherwise one user's cached response can be served to
                    another. Public data such as a product catalog can be cached before auth, and should be.
                </P>

                <H2>Verify tokens at the edge</H2>
                <P>
                    JWTs can be verified without calling anything: the Worker only needs the issuer's public keys. The <Code>jose</Code>{' '}
                    library works on Workers and caches the key set between requests in the same isolate.
                </P>
                <CodeBlock title="src/auth.ts">{`import { createRemoteJWKSet, jwtVerify } from 'jose';

const JWKS = createRemoteJWKSet(new URL('https://auth.example.com/.well-known/jwks.json'));

export async function authenticate(request: Request) {
  const token = request.headers.get('authorization')?.replace(/^Bearer /, '');
  if (!token) return null;
  try {
    const { payload } = await jwtVerify(token, JWKS, {
      issuer: 'https://auth.example.com/',
      audience: 'api.example.com',
    });
    return { sub: payload.sub as string, tenant: payload.tenant as string, scope: String(payload.scope || '') };
  } catch {
    return null;   // expired, wrong signature, wrong audience
  }
}`}</CodeBlock>
                <P>
                    After verification, the gateway forwards the identity to the core as headers (<Code>x-user-id</Code>,{' '}
                    <Code>x-tenant-id</Code>), and the core trusts them <em>only</em> because it can't be reached any other way: through a
                    service binding, or behind <A href="/blog/security/cloudflare-tunnel/">Cloudflare Tunnel</A>. If the core is reachable
                    directly, an attacker can send those headers too.
                </P>

                <H2>Rate limits per key, inside the Worker</H2>
                <P>
                    Zone-level <A href="/blog/security/rate-limiting/">rate limiting rules</A> protect the whole API. The Workers rate
                    limiting binding adds limits that know about your business, for example a different budget per plan:
                </P>
                <CodeBlock title="wrangler.jsonc (excerpt)">{`"ratelimits": [
  { "name": "FREE_LIMIT", "namespace_id": "1001", "simple": { "limit": 60,  "period": 60 } },
  { "name": "PRO_LIMIT",  "namespace_id": "1002", "simple": { "limit": 600, "period": 60 } }
]`}</CodeBlock>
                <CodeBlock title="src/index.ts (excerpt)">{`const limiter = user.plan === 'pro' ? env.PRO_LIMIT : env.FREE_LIMIT;
const { success } = await limiter.limit({ key: user.tenant });
if (!success) {
  return Response.json({ error: 'rate_limited' }, { status: 429, headers: { 'retry-after': '60' } });
}`}</CodeBlock>
                <P>
                    These counters are kept per Cloudflare location and are approximate by design. Use them to protect capacity and enforce
                    plan limits, not as an exact billing meter. For metering, see{' '}
                    <A href="/blog/serverless/multi-tenant-saas-metering/">Metering × Multi-tenant SaaS</A>.
                </P>

                <H2>Cache on purpose</H2>
                <UL items={[
                    <><strong className="text-gray-900">Public, shared reads</strong> (catalog, prices, docs): cache at the edge with a short TTL and purge on change.</>,
                    <><strong className="text-gray-900">Per-user reads</strong>: don't share-cache. If you must, include the user or tenant in the cache key.</>,
                    <><strong className="text-gray-900">Writes</strong>: never cache. Purge the affected keys after a successful write.</>,
                ]} />
                <CodeBlock title="Cache with an explicit key and TTL">{`const cacheKey = new Request('https://cache.internal/v1/catalog?' + url.searchParams.toString());
let res = await caches.default.match(cacheKey);
if (!res) {
  res = await env.CORE.fetch(request);
  if (res.ok) {
    res = new Response(res.body, res);
    res.headers.set('cache-control', 'public, max-age=60, stale-while-revalidate=300');
    ctx.waitUntil(caches.default.put(cacheKey, res.clone()));
  }
}
return res;`}</CodeBlock>

                <H2>Route by version and by customer</H2>
                <P>
                    Major versions live in the path (<Code>/v1/</Code>, <Code>/v2/</Code>), matching the{' '}
                    <A href="/blog/core/contract-testing-versioning/">contract versioning</A> of the core, and the gateway sends each to
                    the right adapter. For a platform sold to many customers, Cloudflare for SaaS custom hostnames let each customer use{' '}
                    <Code>api.theircompany.com</Code>, with TLS handled for you, while the gateway resolves the tenant from the hostname.
                </P>

                <H2>Measuring it</H2>
                <P>
                    The numbers that show the gateway is working: the share of requests answered at the edge (rejected, limited or cached),
                    cache hit ratio for public routes, and origin requests per second. When the edge answers most requests, the core can be
                    smaller and cheaper, which is the point.
                </P>

                <Callout title="Next step">
                    Gateways need fast lookups for keys, tenants and config. <A href="/blog/serverless/edge-storage-kv-d1-r2/">Edge
                    Storage</A> covers where that data should live.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
