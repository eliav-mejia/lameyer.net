<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrutado, caché y autenticación en el edge - Blog de Lameyer</title>
    <meta name="description" content="Convertir un Cloudflare Worker en un API gateway: enrutado por versión, verificación de JWT, límites por clave y reglas de caché, para que el núcleo solo reciba peticiones autenticadas y no cacheadas.">
    <link rel="canonical" href="https://lameyer.net/blog/serverless/routing-caching-auth-edge/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Verifica cada token en el edge, antes de enrutar',
            'Pasa la identidad al núcleo solo en cabeceras de confianza',
            'Enruta por versión mayor en la ruta',
            'Cachea los GET con reglas explícitas, nunca por defecto',
            'Limita por clave de API, no por IP',
            'Devuelve el mismo formato de error en todas las rutas',
        ];

        const ORDER = [
            { step: '1. Normalizar', what: 'Host en minúsculas, quitar la barra final, resolver la versión', why: 'Todos los pasos siguientes ven una única URL canónica' },
            { step: '2. Autenticar', what: 'Verificar el JWT o la clave de API', why: 'Las peticiones rechazadas casi no cuestan nada' },
            { step: '3. Limitar', what: 'Contar por clave o por inquilino', why: 'El abuso se detiene antes de llegar a la caché o al núcleo' },
            { step: '4. Cachear', what: 'Servir los GET que se pueden compartir', why: 'La mayoría de las lecturas nunca salen del edge' },
            { step: '5. Reenviar', what: 'Llamar al núcleo con cabeceras de confianza', why: 'El núcleo solo ve el trabajo que tiene que hacer' },
        ];

        const Content = () => (
            <>
                <P>
                    Cuando un Worker es la puerta de entrada (consulta <A href="/blog/serverless/edge-functions-workers/">Funciones edge</A>),
                    puede hacer el trabajo que antes hacía un producto de API gateway aparte: decidir adónde va cada petición, quién puede
                    hacerla y si la respuesta ya se conoce. Hecho en el orden correcto, el núcleo acaba recibiendo solo peticiones
                    <strong className="text-gray-900"> autenticadas, dentro de los límites y que no están ya en caché</strong>.
                </P>

                <H2>El orden importa</H2>
                <Table
                    columns={[{ key: 'step', label: 'Paso', accent: true }, { key: 'what', label: 'Qué' }, { key: 'why', label: 'Por qué aquí' }]}
                    rows={ORDER}
                />
                <P>
                    Para cualquier dato privado, la autenticación va antes que la caché. Si no, la respuesta cacheada de un usuario se puede
                    servir a otro. Los datos públicos, como un catálogo de productos, sí se pueden cachear antes de autenticar, y conviene hacerlo.
                </P>

                <H2>Verifica los tokens en el edge</H2>
                <P>
                    Los JWT se pueden verificar sin llamar a nada: el Worker solo necesita las claves públicas del emisor. La librería{' '}
                    <Code>jose</Code> funciona en Workers y cachea el conjunto de claves entre peticiones en el mismo isolate.
                </P>
                <CodeBlock title="src/auth.ts">{`import { createRemoteJWKSet, jwtVerify } from 'jose';

const JWKS = createRemoteJWKSet(new URL('https://auth.example.com/.well-known/jwks.json'));

export async function authenticate(request: Request) {
  const token = request.headers.get('authorization')?.replace(/^Bearer /, '');
  if (!token) return null;
  try {
    const { payload } = await jwtVerify(token, JWKS, {
      issuer: 'https://auth.example.com/',
      audience: 'api.example.com',
    });
    return { sub: payload.sub as string, tenant: payload.tenant as string, scope: String(payload.scope || '') };
  } catch {
    return null;   // caducado, firma incorrecta, audiencia incorrecta
  }
}`}</CodeBlock>
                <P>
                    Tras la verificación, el gateway reenvía la identidad al núcleo como cabeceras (<Code>x-user-id</Code>,{' '}
                    <Code>x-tenant-id</Code>), y el núcleo se fía de ellas <em>solo</em> porque no se puede llegar a él de otra forma: a
                    través de un service binding o detrás de <A href="/blog/security/cloudflare-tunnel/">Cloudflare Tunnel</A>. Si el núcleo
                    es accesible directamente, un atacante también puede enviar esas cabeceras.
                </P>

                <H2>Límites por clave, dentro del Worker</H2>
                <P>
                    Las <A href="/blog/security/rate-limiting/">reglas de rate limiting</A> a nivel de zona protegen toda la API. El binding
                    de rate limiting de Workers añade límites que conocen tu negocio, por ejemplo un presupuesto distinto por plan:
                </P>
                <CodeBlock title="wrangler.jsonc (extracto)">{`"ratelimits": [
  { "name": "FREE_LIMIT", "namespace_id": "1001", "simple": { "limit": 60,  "period": 60 } },
  { "name": "PRO_LIMIT",  "namespace_id": "1002", "simple": { "limit": 600, "period": 60 } }
]`}</CodeBlock>
                <CodeBlock title="src/index.ts (extracto)">{`const limiter = user.plan === 'pro' ? env.PRO_LIMIT : env.FREE_LIMIT;
const { success } = await limiter.limit({ key: user.tenant });
if (!success) {
  return Response.json({ error: 'rate_limited' }, { status: 429, headers: { 'retry-after': '60' } });
}`}</CodeBlock>
                <P>
                    Estos contadores se llevan por ubicación de Cloudflare y son aproximados por diseño. Úsalos para proteger la capacidad y
                    hacer cumplir los límites de cada plan, no como contador exacto para facturar. Para la medición, consulta{' '}
                    <A href="/blog/serverless/multi-tenant-saas-metering/">Medición × SaaS multiinquilino</A>.
                </P>

                <H2>Cachea a propósito</H2>
                <UL items={[
                    <><strong className="text-gray-900">Lecturas públicas y compartidas</strong> (catálogo, precios, documentación): cachea en el edge con un TTL corto y purga cuando cambien.</>,
                    <><strong className="text-gray-900">Lecturas por usuario</strong>: no uses caché compartida. Si no queda más remedio, incluye el usuario o el inquilino en la clave de caché.</>,
                    <><strong className="text-gray-900">Escrituras</strong>: nunca se cachean. Purga las claves afectadas tras una escritura correcta.</>,
                ]} />
                <CodeBlock title="Caché con clave y TTL explícitos">{`const cacheKey = new Request('https://cache.internal/v1/catalog?' + url.searchParams.toString());
let res = await caches.default.match(cacheKey);
if (!res) {
  res = await env.CORE.fetch(request);
  if (res.ok) {
    res = new Response(res.body, res);
    res.headers.set('cache-control', 'public, max-age=60, stale-while-revalidate=300');
    ctx.waitUntil(caches.default.put(cacheKey, res.clone()));
  }
}
return res;`}</CodeBlock>

                <H2>Enruta por versión y por cliente</H2>
                <P>
                    Las versiones mayores van en la ruta (<Code>/v1/</Code>, <Code>/v2/</Code>), en línea con el{' '}
                    <A href="/blog/core/contract-testing-versioning/">versionado de contratos</A> del núcleo, y el gateway envía cada una al
                    adaptador correcto. En una plataforma que se vende a muchos clientes, los hostnames personalizados de Cloudflare for SaaS
                    permiten que cada cliente use <Code>api.suempresa.com</Code>, con el TLS gestionado por ti, mientras el gateway resuelve
                    el inquilino a partir del hostname.
                </P>

                <H2>Medirlo</H2>
                <P>
                    Las cifras que demuestran que el gateway funciona: la proporción de peticiones respondidas en el edge (rechazadas,
                    limitadas o cacheadas), la tasa de aciertos de caché en las rutas públicas y las peticiones por segundo al origen. Cuando
                    el edge responde a la mayoría de las peticiones, el núcleo puede ser más pequeño y más barato, que es de lo que se trata.
                </P>

                <Callout title="Siguiente paso">
                    Los gateways necesitan búsquedas rápidas de claves, inquilinos y configuración. <A href="/blog/serverless/edge-storage-kv-d1-r2/">Almacenamiento
                    edge</A> explica dónde deberían vivir esos datos.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
