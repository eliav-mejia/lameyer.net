<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Edge Architecture - Lameyer Blog</title>
    <meta name="description" content="Serverless Edge: what belongs in an edge function and what belongs in the core. Routing, auth, caching and cron jobs at the edge, with KV, D1 and R2 for state.">
    <link rel="canonical" href="https://lameyer.net/blog/serverless/serverless-edge-architecture/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Keep edge functions thin: route, check, cache, forward',
            'Put business rules in the core, not at the edge',
            'Choose storage by consistency need (KV, D1, R2)',
            'Cache public GET responses with explicit TTLs',
            'Move periodic tasks to Cron Triggers',
            'Log a request ID through edge and core',
        ];

        const PLACEMENT = [
            { task: 'Redirects, A/B routing, geolocation', where: 'Edge', why: 'Needs only the request, runs in every location' },
            { task: 'Verifying a JWT or API key', where: 'Edge', why: 'Rejects bad requests before they cost the core anything' },
            { task: 'Caching catalog or blog responses', where: 'Edge', why: 'Served from the nearest location, no origin round trip' },
            { task: 'Feature flags and config', where: 'Edge (KV)', why: 'Read-heavy, tolerates a few seconds of staleness' },
            { task: 'Creating an invoice, charging a card', where: 'Core', why: 'Needs transactions and the full business rules' },
            { task: 'Nightly reports, cleanup, sync', where: 'Edge (Cron) calling core', why: 'No server to keep running between jobs' },
        ];

        const Content = () => (
            <>
                <P>
                    The <strong className="text-gray-900">Serverless Edge</strong> is the "SE" in MC-SE. Instead of one server in one
                    region, small functions run in data centers close to every user, start in milliseconds and scale to zero. Nobody
                    patches an operating system, and a traffic spike is the provider's problem. The trade-off is that each function has
                    tight CPU and memory limits, so the question is always: <em>what belongs at the edge, and what belongs in the core?</em>
                </P>

                <H2>Developer use cases: edge or core?</H2>
                <Table
                    columns={[{ key: 'task', label: 'Task' }, { key: 'where', label: 'Runs at', accent: true }, { key: 'why', label: 'Why' }]}
                    rows={PLACEMENT}
                />

                <H2>A thin edge function</H2>
                <P>
                    A good edge function does four things: route, check, cache and forward. Here a Cloudflare Worker validates an API key
                    stored in KV, serves cached GET responses and forwards everything else to the{' '}
                    <A href="/blog/core/modular-core-architecture/">modular core</A>.
                </P>
                <CodeBlock title="src/worker.ts">{`export default {
  async fetch(request, env, ctx) {
    const key = request.headers.get('x-api-key');
    if (!key || !(await env.API_KEYS.get(key))) {
      return new Response('Unauthorized', { status: 401 });
    }

    const cache = caches.default;
    if (request.method === 'GET') {
      const hit = await cache.match(request);
      if (hit) return hit;
    }

    const res = await fetch(new Request(env.CORE_URL + new URL(request.url).pathname, request));
    if (request.method === 'GET' && res.ok) ctx.waitUntil(cache.put(request, res.clone()));
    return res;
  },

  async scheduled(event, env, ctx) {
    ctx.waitUntil(fetch(env.CORE_URL + '/jobs/nightly-sync', { method: 'POST' }));
  },
};`}</CodeBlock>

                <H2>State at the edge</H2>
                <UL items={[
                    <><strong className="text-gray-900">KV</strong> for read-heavy, eventually consistent values: config, feature flags, API key lookups.</>,
                    <><strong className="text-gray-900">D1</strong> (SQLite) when the edge needs relational queries over its own small dataset.</>,
                    <><strong className="text-gray-900">R2</strong> for files and objects: uploads, exports, generated PDFs, with no egress fees.</>,
                    <><strong className="text-gray-900">Durable Objects</strong> when one thing needs strong consistency, such as a counter, a lock or a chat room.</>,
                ]} />

                <H2>Operating it</H2>
                <P>
                    Serverless does not mean invisible. Pass a request ID from the edge into the core, keep logs and traces for both,
                    and watch per-request CPU time, because it drives both latency and cost. <Code>wrangler tail</Code> streams live logs
                    while you debug.
                </P>

                <H2>Go deeper</H2>
                <UL items={[
                    <><A href="/blog/serverless/edge-functions-workers/">Edge Functions</A>: how Workers run, their limits, and splitting a platform with service bindings.</>,
                    <><A href="/blog/serverless/routing-caching-auth-edge/">Routing, Caching & Auth</A>: turning a Worker into the API gateway.</>,
                    <><A href="/blog/serverless/edge-storage-kv-d1-r2/">Edge Storage</A>: choosing between KV, D1, R2, Durable Objects and Hyperdrive.</>,
                    <><A href="/blog/serverless/scheduled-jobs-cron-triggers/">Scheduled Jobs</A>: retiring the always-on sync server.</>,
                    <><A href="/blog/serverless/logs-tracing-cost/">Logs, Tracing & Cost</A>: seeing inside the platform and what each customer costs.</>,
                ]} />
                <P>
                    Three crossovers apply all of this to the platforms we build for clients: an{' '}
                    <A href="/blog/serverless/serverless-integration-paas/">integration PaaS made of edge functions</A>, a{' '}
                    <A href="/blog/serverless/serverless-in-front-of-iaas/">hybrid path for existing servers (IaaS)</A>, and{' '}
                    <A href="/blog/serverless/multi-tenant-saas-metering/">multi-tenant SaaS with usage metering</A>.
                </P>

                <Callout title="How it connects to the rest of MC-SE">
                    The edge is also where the <A href="/blog/?series=security">API Security</A> layers run, from DDoS protection to rate
                    limiting. Background work that should not block a request belongs in{' '}
                    <A href="/blog/workflows/serverless-workflow-automation/">Workflow Automation</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
