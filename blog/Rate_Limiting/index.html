<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Limiting - Lameyer Blog</title>
    <meta name="description" content="Stopping brute force and API abuse with Cloudflare rate limiting rules keyed by IP, API key, cookie or header.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Put a strict limit on login and token endpoints',
            'Set separate limits for reads and writes',
            'Count by API key where your plan allows',
            'Base thresholds on real traffic, not guesses',
            'Return 429 with Retry-After from the origin too',
        ];

        const TIERS = [
            { endpoint: 'POST /v1/auth/login', limit: '5 requests / 10 s', why: 'Brute force and credential stuffing target this first.' },
            { endpoint: 'POST /v1/orders', limit: '30 requests / 1 min', why: 'Writes are expensive and rarely bursty for real clients.' },
            { endpoint: 'GET /v1/products', limit: '300 requests / 1 min', why: 'Reads are cheap, but unlimited reads invite scraping.' },
        ];

        const Content = () => (
            <>
                <P>
                    Every layer so far has asked <em>"is this request malicious?"</em> Rate limiting asks a different question:
                    <em> "is this client asking for too much?"</em> A login request with a valid-looking password is harmless once
                    and an attack ten thousand times. Rate limiting caps how many requests a client can make in a time window, and
                    throttles or blocks clients that go over it.
                </P>

                <H2>Anatomy of a rate limiting rule</H2>
                <P>A Cloudflare rate limiting rule has four parts:</P>
                <UL items={[
                    <><strong className="text-gray-900">Match.</strong> Which requests count, for example one path on your API host.</>,
                    <><strong className="text-gray-900">Characteristics.</strong> What identifies a client: its IP address, or on higher plans an API key header, session cookie, query parameter or other request property.</>,
                    <><strong className="text-gray-900">Threshold.</strong> How many requests are allowed per period.</>,
                    <><strong className="text-gray-900">Action.</strong> What happens when a client exceeds it: block, log or (for browsers only) challenge, for a set duration.</>,
                ]} />
                <CodeBlock title="Login endpoint · Block for 10 s">{`Expression:
(http.host eq "api.example.com"
 and http.request.uri.path eq "/v1/auth/login"
 and http.request.method eq "POST")

Characteristics:  IP
Threshold:        5 requests per 10 seconds
Action:           Block for 10 seconds`}</CodeBlock>

                <H2>Why counting by IP isn't enough</H2>
                <P>
                    Counting by IP is available on every plan and is a good start, but it has two weaknesses. Many legitimate
                    users can share one IP behind a corporate or mobile network. And attackers rotate through thousands of
                    residential proxy IPs, so each IP stays under the limit.
                </P>
                <P>
                    For an API, the stronger key is the <strong className="text-gray-900">API key itself</strong>. Counting per{' '}
                    <Code>x-api-key</Code> header means one leaked key can only be abused as fast as its limit allows, no matter
                    how many IPs the attacker uses. Counting by headers, cookies and other characteristics requires Cloudflare's
                    Advanced Rate Limiting.
                </P>

                <H2>Different endpoints, different limits</H2>
                <P>One global limit is either too loose for login or too tight for reads. An example starting point:</P>
                <div className="my-8 overflow-x-auto rounded-2xl border border-gray-100">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 text-[10px] uppercase tracking-[0.2em] text-gray-400">
                            <tr>
                                <th className="p-4 font-bold">Endpoint</th>
                                <th className="p-4 font-bold">Limit per client</th>
                                <th className="p-4 font-bold">Reason</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                            {TIERS.map(t => (
                                <tr key={t.endpoint}>
                                    <td className="p-4 font-mono text-xs font-bold text-gray-900 whitespace-nowrap">{t.endpoint}</td>
                                    <td className="p-4 font-bold text-blue-600 whitespace-nowrap">{t.limit}</td>
                                    <td className="p-4 text-gray-500 font-medium">{t.why}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
                <Callout title="Measure before you limit">
                    Run new rules with the Log action first and compare against your real traffic in Security Analytics.
                    A threshold set too low will block your own customers during normal peaks.
                </Callout>

                <H2>Where rate limiting stops</H2>
                <P>
                    All of these layers protect traffic that goes through Cloudflare. If an attacker finds your origin's real IP,
                    they can skip every one of them. Closing that door is the job of the final layer,{' '}
                    <a href="/blog/Cloudflare_Tunnel/" className="text-blue-600 font-bold hover:underline">Cloudflare Tunnel</a>.
                </P>
            </>
        );

        renderPost('/blog/Rate_Limiting/', CONTROLS, Content);
    </script>
</body>
</html>
