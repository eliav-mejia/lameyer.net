<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmarks × Search as Code - Lameyer Blog</title>
    <meta name="description" content="Running a curated code search benchmark in CI on every search-config pull request, with per-slice thresholds and a versioned baseline.">
    <link rel="canonical" href="https://lameyer.net/blog/benchmarks-x-search-as-code.html">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Trigger the eval on any change under search/',
            'Compare against a versioned baseline from main',
            'Gate on slices, not only on the average',
            'Allow tiny noise, fail on real drops',
            'Require an explicit label to accept a regression',
            'Refresh the baseline only on merge',
        ];

        const REPORT = [
            { slice: 'All queries (n=184)', base: '0.712', cand: '0.731', delta: '+0.019', status: '✓' },
            { slice: 'python', base: '0.744', cand: '0.770', delta: '+0.026', status: '✓' },
            { slice: 'typescript', base: '0.689', cand: '0.701', delta: '+0.012', status: '✓' },
            { slice: 'go', base: '0.655', cand: '0.618', delta: '−0.037', status: '✗ fails (max −0.02)' },
        ];

        const Content = () => (
            <>
                <P>
                    <A href="/blog/search-as-code-sac.html">Search as Code</A> puts every relevance setting in git.
                    A <A href="/blog/benchmark-curation-reap-harvest.html">curated benchmark</A> tells you whether a setting helps.
                    Put them together and you get what software teams have had for years: a test suite that runs on every pull request
                    and blocks the merge when something breaks. Here, "breaks" means "finds worse results".
                </P>

                <H2>The workflow</H2>
                <P>
                    The job runs only when search configuration changes. It builds a temporary index from the branch, runs every benchmark
                    query against it and compares the scores with the baseline recorded on <Code>main</Code>:
                </P>
                <CodeBlock title=".github/workflows/search-relevance.yml">{`name: search-relevance
on:
  pull_request:
    paths: ["search/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r search/requirements.txt

      - name: Build candidate index from this branch
        run: python search/tools/build_index.py --config search/ --out .eval/candidate

      - name: Score candidate against the main baseline
        run: >
          python search/tools/evaluate.py
          --index .eval/candidate
          --queries search/benchmark/queries.jsonl
          --baseline search/benchmark/baseline.json
          --max-drop 0.02
          --report .eval/report.md

      - name: Post report on the pull request
        if: always()
        run: gh pr comment "$PR" --body-file .eval/report.md
        env:
          GH_TOKEN: \${{ github.token }}
          PR: \${{ github.event.pull_request.number }}`}</CodeBlock>
                <Callout title="Index the snapshot, not today's code">
                    Benchmark items are pinned to the commit they were harvested from. The build script indexes those snapshots, so a
                    change in the application code never moves the scores, only a change in the search config does.
                </Callout>

                <H2>Gate on slices, not just the average</H2>
                <P>
                    An average can hide a regression. A new synonym list might help Python queries a lot and quietly break Go. Score each
                    slice (language, repository, query type) separately and apply the threshold to each one:
                </P>
                <Table
                    columns={[{ key: 'slice', label: 'nDCG@10 · slice', mono: true }, { key: 'base', label: 'main' }, { key: 'cand', label: 'branch' }, { key: 'delta', label: 'Δ', accent: true }, { key: 'status', label: 'Status' }]}
                    rows={REPORT}
                />
                <P>
                    This pull request improves the overall score and still fails, which is the point: someone has to look at the Go queries
                    before it ships.
                </P>

                <H2>Noise, thresholds and accepted regressions</H2>
                <UL items={[
                    <><strong className="text-gray-900">Make runs repeatable.</strong> Fix random seeds and pin the embedding model version. Approximate nearest-neighbour search can still vary slightly between builds, so allow a small tolerance.</>,
                    <><strong className="text-gray-900">Small slices are noisy.</strong> With 15 queries, one query flipping changes the score a lot. Set a minimum slice size before gating, and report smaller slices without failing on them.</>,
                    <><strong className="text-gray-900">Some regressions are worth it.</strong> A model upgrade might cost 1% on one slice and gain 8% elsewhere. Let a reviewer accept it explicitly with a PR label, so the decision is recorded.</>,
                    <><strong className="text-gray-900">Move the baseline on merge only.</strong> A second job on <Code>main</Code> re-runs the evaluation and commits the new <Code>baseline.json</Code>.</>,
                ]} />

                <H2>Changing the embedding model</H2>
                <P>
                    A new <A href="/blog/semantic-vector-search.html">embedding model</A> means re-embedding every chunk, which is the
                    most expensive change you can make. Because <Code>embedding.yaml</Code> is part of the config, it goes through the same
                    pipeline: the job builds a full candidate index with the new model and you see the per-slice impact before paying to
                    re-index production.
                </P>

                <H2>What this gives you</H2>
                <P>
                    Search changes become as safe and as reviewable as code changes. The history of <Code>baseline.json</Code> is a chart of
                    your search quality over time, and every point on it links to the pull request that caused it.
                </P>
            </>
        );

        renderPost('/blog/benchmarks-x-search-as-code.html', CONTROLS, Content);
    </script>
</body>
</html>
