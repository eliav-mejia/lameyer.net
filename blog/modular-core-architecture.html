<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Core Architecture - Lameyer Blog</title>
    <meta name="description" content="Modular Core: splitting business logic into domain modules with owned data and typed contracts, so serverless edge functions and workflows can call it safely.">
    <link rel="canonical" href="https://lameyer.net/blog/modular-core-architecture.html">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'List your domains before you draw any module',
            'Give every table exactly one owning module',
            'Expose each module only through a public contract',
            'Forbid deep imports with a lint rule',
            'Version contracts and test them in CI',
            'Extract a module to a service only when you must',
        ];

        const CASES = [
            { case: 'A change to invoicing breaks login', fix: 'Domain modules with enforced boundaries', step: 'Modules' },
            { case: 'Edge functions and workflows call internal functions directly', fix: 'A typed contract (OpenAPI or a TypeScript interface) per module', step: 'Contracts' },
            { case: 'The same validation code is copied into five repos', fix: 'Shared packages in one workspace', step: 'Packages' },
            { case: 'Three modules write to the same table', fix: 'One owner per table, others read through the contract', step: 'Data' },
            { case: 'A deploy breaks a consumer nobody knew about', fix: 'Contract tests and semantic versioning', step: 'Versioning' },
        ];

        const Content = () => (
            <>
                <P>
                    MC-SE stands for <strong className="text-gray-900">Modular Core + Serverless Edge</strong>. The edge is where requests
                    arrive and where automations run. The core is where the business rules live: pricing, invoicing, users, inventory.
                    The edge can only stay thin and fast if the core gives it clean, stable entry points. This series is about building
                    that core.
                </P>

                <H2>Developer use cases</H2>
                <Table
                    columns={[{ key: 'case', label: 'Symptom' }, { key: 'fix', label: 'Solution' }, { key: 'step', label: 'Step', accent: true }]}
                    rows={CASES}
                />

                <H2>Modules, not microservices</H2>
                <P>
                    A modular core is usually a <em>modular monolith</em>: one deployable, many modules. Each module maps to a business
                    domain (<Code>billing</Code>, <Code>catalog</Code>, <Code>accounts</Code>), owns its data and exposes a small public
                    API. You get most of the isolation of microservices without the network calls, distributed transactions and
                    deployment overhead. When a module truly needs to scale or deploy on its own, its contract already exists, so
                    extracting it is a move, not a rewrite.
                </P>
                <CodeBlock title="Layout">{`core/
  billing/
    index.ts        # public contract: the only file other modules import
    internal/       # implementation, never imported from outside
    migrations/     # billing owns its tables
  catalog/
    index.ts
    internal/
  accounts/
    index.ts
    internal/`}</CodeBlock>

                <H2>Contracts are the seam to the edge</H2>
                <P>
                    Every module publishes a contract: a TypeScript interface for in-process callers and, where the edge or a workflow
                    calls it over HTTP, an OpenAPI document. Edge functions generate their client from that document, so a renamed
                    field fails the build instead of failing in production.
                </P>
                <CodeBlock title="core/billing/index.ts">{`export interface Billing {
  createInvoice(input: { customerId: string; lines: Line[] }): Promise<Invoice>;
  getInvoice(id: string): Promise<Invoice | null>;
}`}</CodeBlock>

                <H2>Enforce the boundaries</H2>
                <UL items={[
                    <><strong className="text-gray-900">Imports.</strong> A lint rule (for example <Code>no-restricted-imports</Code> or dependency-cruiser) blocks <Code>billing/internal/*</Code> from outside <Code>billing/</Code>.</>,
                    <><strong className="text-gray-900">Data.</strong> Each table has one owning module. Others read through its contract or subscribe to its events, never with a cross-module SQL join.</>,
                    <><strong className="text-gray-900">Packages.</strong> Shared code (validation schemas, money types, logging) lives in workspace packages with their own version, not in a <Code>utils/</Code> folder everything imports.</>,
                    <><strong className="text-gray-900">Versioning.</strong> Contract tests run in CI, and breaking changes bump the major version so edge consumers can migrate on their own schedule.</>,
                ]} />

                <Callout title="How it connects to the rest of MC-SE">
                    The <A href="/blog/serverless-edge-architecture.html">Serverless Edge</A> series covers the functions that sit in
                    front of these contracts, and <A href="/blog/serverless-workflow-automation.html">Workflow Automation</A> covers
                    the queues and webhooks that call them in the background. Both are protected by the{' '}
                    <A href="/blog/?series=security">API Security</A> layers.
                </Callout>
            </>
        );

        renderPost('/blog/modular-core-architecture.html', CONTROLS, Content);
    </script>
</body>
</html>
