<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capa edge (DDoS y DNS) - Blog de Lameyer</title>
    <meta name="description" content="Cómo la red Anycast de Cloudflare absorbe los ataques DDoS de capa 3/4 y las inundaciones DNS antes de que lleguen a tu API.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Pasa por el proxy todos los registros DNS de la API (nube naranja)',
            'Activa DNSSEC en la zona',
            'Elimina los registros sin proxy que apunten al origen',
            'Cambia la IP del origen si alguna vez fue pública',
            'Revisa las alertas DDoS y la sensibilidad del conjunto de reglas gestionado',
        ];

        const Content = () => (
            <>
                <P>
                    Operar una API headless sin frontend deja tus claves y los datos del backend expuestos al scraping,
                    a la fuerza bruta y a ataques directos al origen. Cloudflare responde con un modelo de defensa en capas que
                    filtra el tráfico malicioso en varios puntos de control entre el cliente y tus servidores. El edge es el
                    primero y el más externo de esos puntos de control.
                </P>

                <H2>Anycast: una dirección, cientos de centros de datos</H2>
                <P>
                    Cloudflare anuncia las mismas direcciones IP desde todos los centros de datos de su red global. Con el
                    enrutado Anycast, cada paquete llega al centro de datos más cercano a su origen. Así, el tráfico de una
                    botnet repartida por todo el mundo se divide entre toda la red en lugar de converger en un único enlace, y
                    cada ubicación solo tiene que absorber su parte local del ataque.
                </P>

                <H2>Ataques volumétricos de capa 3 y capa 4</H2>
                <P>
                    Los ataques a nivel de red intentan agotar el ancho de banda o el estado de las conexiones en lugar de
                    explotar tu aplicación. Cloudflare los mitiga automáticamente, sin que tengas que escribir ninguna regla:
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Inundaciones SYN</strong> que llenan las tablas de conexiones con handshakes TCP a medio abrir.</>,
                    <><strong className="text-gray-900">Inundaciones UDP</strong> que saturan los enlaces con datagramas basura.</>,
                    <><strong className="text-gray-900">Ataques de reflexión y amplificación</strong> que abusan de servidores DNS, NTP o memcached abiertos para multiplicar el tráfico hacia la víctima.</>,
                ]} />
                <P>
                    Para un hostname con proxy, Cloudflare solo reenvía peticiones HTTP(S) a tu origen. Las inundaciones de
                    paquetes dirigidas a ese hostname se quedan en el edge y nunca consumen el ancho de banda de tu servidor.
                </P>

                <H2>DNS: el perímetro que nadie vigila</H2>
                <P>
                    El DNS autoritativo de Cloudflare funciona sobre la misma red Anycast, así que las inundaciones de
                    consultas DNS se absorben de la misma forma. Para una API, dos ajustes de DNS son los que más importan:
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Registros con proxy.</strong> Un registro con proxy (nube naranja) resuelve a las IP de Cloudflare, no a las tuyas. Un registro solo DNS (nube gris) publica la IP de tu origen a cualquiera que pregunte.</>,
                    <><strong className="text-gray-900">DNSSEC.</strong> Firma tu zona para que los resolvedores detecten respuestas falsificadas que redirigirían a los clientes de la API a otro sitio.</>,
                ]} />

                <Callout title="La fuga más habitual">
                    Un solo registro sin proxy, como <Code>direct.api.example.com</Code> o un registro de correo en el mismo servidor,
                    revela la IP del origen y permite a los atacantes saltarse todas las capas descritas en esta serie. Las bases
                    de datos históricas de DNS también pueden recordar una IP que usabas antes de pasar detrás de Cloudflare. Si el
                    origen fue público alguna vez, cambia su IP.
                </Callout>

                <H2>Dónde se detiene el edge</H2>
                <P>
                    El edge es excelente frente al volumen, pero una petición HTTP bien formada que lleva una inyección SQL parece
                    perfectamente normal a nivel de red. Inspeccionar el contenido de las peticiones es trabajo del siguiente punto
                    de control, la{' '}
                    <a href="/blog/security/waf-bot-layer-layer-7/" className="text-blue-600 font-bold hover:underline">capa WAF y bots</a>.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
