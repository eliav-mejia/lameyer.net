<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate limiting - Blog de Lameyer</title>
    <meta name="description" content="Frenar la fuerza bruta y el abuso de la API con reglas de rate limiting de Cloudflare basadas en IP, clave de API, cookie o cabecera.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Pon un límite estricto en los endpoints de login y de tokens',
            'Define límites distintos para lecturas y escrituras',
            'Cuenta por clave de API si tu plan lo permite',
            'Basa los umbrales en tráfico real, no en suposiciones',
            'Devuelve también 429 con Retry-After desde el origen',
        ];

        const TIERS = [
            { endpoint: 'POST /v1/auth/login', limit: '5 peticiones / 10 s', why: 'La fuerza bruta y el relleno de credenciales apuntan aquí primero.' },
            { endpoint: 'POST /v1/orders', limit: '30 peticiones / 1 min', why: 'Las escrituras son caras y los clientes reales rara vez las hacen en ráfaga.' },
            { endpoint: 'GET /v1/products', limit: '300 peticiones / 1 min', why: 'Las lecturas son baratas, pero sin límite invitan al scraping.' },
        ];

        const Content = () => (
            <>
                <P>
                    Hasta ahora, cada capa se preguntaba <em>«¿esta petición es maliciosa?»</em>. El rate limiting se hace otra pregunta:
                    <em> «¿este cliente está pidiendo demasiado?»</em>. Una petición de login con una contraseña de aspecto válido es
                    inofensiva una vez y un ataque diez mil veces. El rate limiting limita cuántas peticiones puede hacer un cliente en
                    una ventana de tiempo, y frena o bloquea a los clientes que la superan.
                </P>

                <H2>Anatomía de una regla de rate limiting</H2>
                <P>Una regla de rate limiting de Cloudflare tiene cuatro partes:</P>
                <UL items={[
                    <><strong className="text-gray-900">Coincidencia.</strong> Qué peticiones cuentan, por ejemplo una ruta del host de tu API.</>,
                    <><strong className="text-gray-900">Características.</strong> Qué identifica a un cliente: su dirección IP o, en planes superiores, una cabecera con la clave de API, una cookie de sesión, un parámetro de consulta u otra propiedad de la petición.</>,
                    <><strong className="text-gray-900">Umbral.</strong> Cuántas peticiones se permiten por periodo.</>,
                    <><strong className="text-gray-900">Acción.</strong> Qué ocurre cuando un cliente lo supera: bloquear, registrar o (solo para navegadores) lanzar un challenge, durante un tiempo determinado.</>,
                ]} />
                <CodeBlock title="Endpoint de login · Bloquear durante 10 s">{`Expresión:
(http.host eq "api.example.com"
 and http.request.uri.path eq "/v1/auth/login"
 and http.request.method eq "POST")

Características:  IP
Umbral:           5 peticiones cada 10 segundos
Acción:           Bloquear durante 10 segundos`}</CodeBlock>

                <H2>Por qué contar por IP no basta</H2>
                <P>
                    Contar por IP está disponible en todos los planes y es un buen comienzo, pero tiene dos puntos débiles. Muchos
                    usuarios legítimos pueden compartir una IP detrás de una red corporativa o móvil. Y los atacantes rotan entre miles
                    de IP de proxies residenciales, de modo que cada IP se queda por debajo del límite.
                </P>
                <P>
                    Para una API, la clave más sólida es <strong className="text-gray-900">la propia clave de API</strong>. Contar por
                    cabecera <Code>x-api-key</Code> significa que una clave filtrada solo puede abusarse tan rápido como permita su límite,
                    sin importar cuántas IP use el atacante. Contar por cabeceras, cookies y otras características requiere el Advanced
                    Rate Limiting de Cloudflare.
                </P>

                <H2>Endpoints distintos, límites distintos</H2>
                <P>Un límite global único es o demasiado laxo para el login o demasiado estricto para las lecturas. Un punto de partida de ejemplo:</P>
                <div className="my-8 overflow-x-auto rounded-2xl border border-gray-100">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 text-[10px] uppercase tracking-[0.2em] text-gray-400">
                            <tr>
                                <th className="p-4 font-bold">Endpoint</th>
                                <th className="p-4 font-bold">Límite por cliente</th>
                                <th className="p-4 font-bold">Motivo</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                            {TIERS.map(t => (
                                <tr key={t.endpoint}>
                                    <td className="p-4 font-mono text-xs font-bold text-gray-900 whitespace-nowrap">{t.endpoint}</td>
                                    <td className="p-4 font-bold text-blue-600 whitespace-nowrap">{t.limit}</td>
                                    <td className="p-4 text-gray-500 font-medium">{t.why}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
                <Callout title="Mide antes de limitar">
                    Ejecuta las reglas nuevas primero con la acción Log y compáralas con tu tráfico real en Security Analytics.
                    Un umbral demasiado bajo bloqueará a tus propios clientes durante los picos normales.
                </Callout>

                <H2>Dónde se detiene el rate limiting</H2>
                <P>
                    Todas estas capas protegen el tráfico que pasa por Cloudflare. Si un atacante encuentra la IP real de tu origen,
                    puede saltárselas todas. Cerrar esa puerta es trabajo de la última capa,{' '}
                    <a href="/blog/security/cloudflare-tunnel/" className="text-blue-600 font-bold hover:underline">Cloudflare Tunnel</a>.
                </P>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
