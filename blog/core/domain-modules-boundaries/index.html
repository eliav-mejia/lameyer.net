<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulos de dominio y límites - Blog de Lameyer</title>
    <meta name="description" content="Trazar los límites de los módulos a partir de las capacidades de negocio, dar a cada módulo un único punto de entrada público y hacer cumplir los límites con reglas de lint en un monolito modular.">
    <link rel="canonical" href="https://lameyer.net/blog/core/domain-modules-boundaries/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Divide por capacidad de negocio, no por capa técnica',
            'Nombra cada módulo con un sustantivo que use el negocio',
            'Da a cada módulo un único index.ts público',
            'Bloquea los imports de la carpeta internal/ de otro módulo',
            'Asigna un responsable a cada módulo en CODEOWNERS',
            'Controla la dirección de las dependencias y prohíbe los ciclos',
        ];

        const SIGNALS = [
            { signal: 'Las palabras cambian de significado', example: '«Cuenta» es un login en auth y un cliente en billing', verdict: 'Dos módulos' },
            { signal: 'Ritmo de cambio distinto', example: 'Las reglas de precios cambian cada semana; las fiscales, cada año', verdict: 'Dos módulos' },
            { signal: 'Deciden personas distintas', example: 'Finanzas es dueña de las facturas; operaciones, de los envíos', verdict: 'Dos módulos' },
            { signal: 'Siempre cambian juntos', example: 'El pedido y sus líneas se editan en la misma transacción', verdict: 'Un módulo' },
        ];

        const Content = () => (
            <>
                <P>
                    La mayoría de los monolitos no están enredados por descuido. Están enredados porque las carpetas siguen capas técnicas
                    (<Code>controllers/</Code>, <Code>services/</Code>, <Code>models/</Code>) y cada funcionalidad las atraviesa todas.
                    Un cambio en facturación toca cinco carpetas, y nada impide que <Code>InvoiceService</Code> llame directamente a{' '}
                    <Code>UserRepository</Code>. Un <strong className="text-gray-900">módulo de dominio</strong> le da la vuelta: una carpeta por
                    capacidad de negocio, con su propia lógica, acceso a datos y tests, y una única puerta hacia fuera.
                </P>

                <H2>Busca los límites en el negocio, no en el código</H2>
                <P>
                    Empieza con una lista de capacidades escrita en el lenguaje que usa el negocio: <em>calcular un precio, aceptar un
                    pedido, emitir una factura, enviar un paquete</em>. Una breve sesión de event storming funciona bien: escribe cada
                    evento que ocurre («Pedido realizado», «Factura emitida», «Pago fallido») en un pósit y después agrúpalos. Cada grupo es
                    un módulo candidato. Luego pon a prueba cada candidato con estas señales:
                </P>
                <Table
                    columns={[{ key: 'signal', label: 'Señal' }, { key: 'example', label: 'Ejemplo' }, { key: 'verdict', label: 'Veredicto', accent: true }]}
                    rows={SIGNALS}
                />
                <Callout title="Empieza con menos módulos y más grandes">
                    Fusionar dos módulos que resultaron ser uno es doloroso; dividir más adelante un módulo grande y bien delimitado es
                    fácil. Entre cuatro y ocho módulos es un buen comienzo para la mayoría de las aplicaciones de negocio.
                </Callout>

                <H2>Anatomía de un módulo</H2>
                <P>
                    Todos los módulos tienen la misma forma, así que cualquiera del equipo sabe dónde mirar. Solo <Code>index.ts</Code> es
                    público. Todo lo demás es un detalle de implementación que el módulo puede cambiar libremente.
                </P>
                <CodeBlock title="core/billing/">{`billing/
├── index.ts            # API pública: tipos + funciones que pueden usar otros módulos
├── contract.ts         # esquemas de entradas, salidas y errores (ver Contratos)
├── internal/
│   ├── invoice.ts      # reglas de negocio
│   ├── tax.ts
│   └── repository.ts   # solo billing toca las tablas de billing
├── events.ts           # eventos que publica billing: InvoiceIssued, ...
├── migrations/         # el esquema propio de billing (ver Datos)
└── tests/`}</CodeBlock>
                <CodeBlock title="core/billing/index.ts">{`export type { Invoice, InvoiceLine } from './contract';
export { createInvoice, getInvoice, voidInvoice } from './internal/invoice';
export { InvoiceIssued } from './events';
// No se exporta nada de ./internal/repository ni de ./internal/tax.`}</CodeBlock>

                <H2>Haz cumplir los límites con herramientas</H2>
                <P>
                    Un límite que depende de la disciplina dura hasta la primera fecha de entrega. Haz que falle el build. Con{' '}
                    <Code>dependency-cruiser</Code>, dos reglas cubren casi todo: no meterse en los internos de otro módulo y no tener ciclos.
                </P>
                <CodeBlock title=".dependency-cruiser.cjs">{`module.exports = {
  forbidden: [
    {
      name: 'no-deep-imports',
      comment: 'Importa otros módulos solo a través de su index.ts',
      severity: 'error',
      from: { path: '^core/([^/]+)/' },
      to:   { path: '^core/([^/]+)/internal/', pathNot: '^core/$1/' },
    },
    {
      name: 'no-cycles',
      severity: 'error',
      from: {},
      to: { circular: true },
    },
  ],
};`}</CodeBlock>
                <P>
                    Ejecútalo en CI junto a los tests. Si prefieres ESLint, <Code>no-restricted-imports</Code> con un patrón como{' '}
                    <Code>{'@core/*/internal/*'}</Code> hace lo mismo para archivos sueltos. En otros lenguajes la idea es idéntica: Java
                    tiene los módulos JPMS y ArchUnit, .NET tiene la visibilidad <Code>internal</Code> y NetArchTest, Python tiene <Code>import-linter</Code>.
                </P>

                <H2>La dirección importa tanto como los límites</H2>
                <P>
                    Permitir imports solo a través de <Code>index.ts</Code> no basta si cada módulo importa a todos los demás. Dibuja el
                    grafo de dependencias y mantenlo en un solo sentido: <Code>orders</Code> puede llamar a <Code>catalog</Code> y a{' '}
                    <Code>billing</Code>, pero <Code>billing</Code> no debería llamar de vuelta a <Code>orders</Code>. Cuando un módulo de
                    nivel inferior necesita reaccionar a algo que hace uno superior, se suscribe a un evento en lugar de importarlo.
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Las llamadas bajan.</strong> Los flujos de nivel superior (orders) llaman a las capacidades de nivel inferior (billing, catalog).</>,
                    <><strong className="text-gray-900">Los eventos suben.</strong> Billing publica <Code>InvoiceIssued</Code>; orders lo escucha y actualiza su estado.</>,
                    <><strong className="text-gray-900">El núcleo compartido se mantiene diminuto.</strong> Solo los tipos realmente universales (dinero, IDs, fechas) viven en un paquete compartido. Consulta <A href="/blog/core/shared-packages-workspaces/">Paquetes compartidos y workspaces</A>.</>,
                ]} />

                <H2>Responsables</H2>
                <P>
                    Un módulo sin responsable vuelve a convertirse en un cajón de sastre compartido. Pon cada módulo en <Code>CODEOWNERS</Code> para
                    que los cambios en su API pública necesiten la revisión de su responsable, mientras los cambios internos avanzan rápido:
                </P>
                <CodeBlock title=".github/CODEOWNERS">{`/core/billing/            @acme/finance-dev
/core/billing/index.ts    @acme/finance-dev @acme/architects
/core/catalog/            @acme/catalog-dev`}</CodeBlock>

                <H2>Medir el progreso</H2>
                <P>
                    Modularizar una base de código existente lleva meses, así que hazle seguimiento. Cifras útiles: las violaciones de
                    límites que informa el comprobador de dependencias (solo deberían bajar), los archivos cambiados por funcionalidad típica
                    y la frecuencia con la que el despliegue de un equipo se bloquea por tests fallidos de otro. Cuando esas cifras bajan, los
                    límites están funcionando.
                </P>

                <Callout title="Siguiente paso">
                    El <Code>index.ts</Code> de un módulo es su puerta. El siguiente artículo, <A href="/blog/core/contracts-typed-apis/">Contratos
                    y APIs tipadas</A>, hace esa puerta lo bastante precisa para las funciones edge y los flujos que están al otro lado de una red.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
