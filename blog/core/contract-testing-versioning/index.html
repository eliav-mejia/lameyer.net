<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests de contrato y versionado - Blog de Lameyer</title>
    <meta name="description" content="Detectar cambios incompatibles de API en CI con diffs de OpenAPI y tests de contrato guiados por el consumidor, versionado semántico de contratos y retirada de versiones antiguas con las cabeceras Deprecation y Sunset.">
    <link rel="canonical" href="https://lameyer.net/blog/core/contract-testing-versioning/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Compara en CI cada cambio de OpenAPI con main',
            'Deja que los consumidores publiquen los contratos de los que dependen',
            'Haz fallar el build ante cualquier cambio incompatible no aprobado',
            'Versiona los eventos en el nombre del topic',
            'Anuncia las retiradas con Deprecation y Sunset',
            'Elimina las versiones antiguas solo cuando su uso sea cero',
        ];

        const CHANGES = [
            { change: 'Añadir un campo opcional a la petición', kind: 'Minor', note: 'Los consumidores antiguos simplemente no lo envían.' },
            { change: 'Añadir un campo a la respuesta', kind: 'Minor', note: 'Solo si los clientes ignoran los campos desconocidos. Dilo en el contrato.' },
            { change: 'Añadir un valor a un enum de la respuesta', kind: 'Major*', note: 'Rompe los clientes con switches exhaustivos. Trátalo como incompatible salvo que esté documentado.' },
            { change: 'Hacer obligatorio un campo opcional', kind: 'Major', note: 'Los consumidores antiguos empiezan a recibir 422.' },
            { change: 'Renombrar o eliminar un campo', kind: 'Major', note: 'Usa expandir-y-contraer: añade el nuevo, depreca el antiguo.' },
            { change: 'Corregir una errata en una descripción', kind: 'Patch', note: 'Sin cambio de comportamiento.' },
        ];

        const Content = () => (
            <>
                <P>
                    Los pasos anteriores dieron a cada módulo un contrato tipado y datos privados. Eso convierte el contrato en lo único de lo
                    que depende el resto del sistema. Una función edge desplegada la semana pasada, un flujo que sigue reintentando mensajes
                    de ayer, la integración de un cliente: todos dan por hecho el contrato con el que se construyeron. Este último paso trata
                    de cambiar el núcleo cada día <strong className="text-gray-900">sin romper a ninguno</strong>, y de demostrarlo en CI en
                    lugar de en producción.
                </P>

                <H2>Qué cuenta como incompatible</H2>
                <Table
                    columns={[{ key: 'change', label: 'Cambio' }, { key: 'kind', label: 'Semver', accent: true }, { key: 'note', label: 'Por qué' }]}
                    rows={CHANGES}
                />

                <H2>Capa 1: compara el esquema en cada pull request</H2>
                <P>
                    Como el documento OpenAPI se genera y se sube al repositorio (consulta <A href="/blog/core/contracts-typed-apis/">Contratos
                    y APIs tipadas</A>), CI puede compararlo con <Code>main</Code>. <Code>oasdiff</Code> clasifica cada diferencia y falla
                    cuando aparece un cambio incompatible sin subir la versión mayor.
                </P>
                <CodeBlock title=".github/workflows/contracts.yml (extracto)">{`- name: Generar los contratos
  run: pnpm turbo run gen:openapi

- name: Buscar cambios incompatibles
  run: |
    git show origin/main:contracts/billing.openapi.yaml > /tmp/base.yaml
    oasdiff breaking /tmp/base.yaml contracts/billing.openapi.yaml \\
      --fail-on ERR`}</CodeBlock>
                <P>
                    Esto detecta las roturas estructurales: campos eliminados, tipos cambiados, nuevos parámetros obligatorios. No puede
                    detectar un cambio de <em>comportamiento</em> que mantiene la misma forma, como un total que ahora se devuelve en
                    céntimos en lugar de en unidades.
                </P>

                <H2>Capa 2: tests de contrato guiados por el consumidor</H2>
                <P>
                    Un esquema dice lo que el núcleo <em>permite</em>. Los consumidores saben lo que realmente <em>usan</em>. Con los tests de
                    contrato guiados por el consumidor (Pact es la herramienta habitual), cada consumidor escribe un pequeño test que describe
                    las peticiones que envía y las partes de la respuesta de las que depende. Esas expectativas se publican en un broker y el
                    CI del núcleo las reproduce contra la implementación real.
                </P>
                <CodeBlock title="edge-api/tests/billing.pact.test.ts">{`await provider
  .given('customer c-42 exists')
  .uponReceiving('a request to create an invoice')
  .withRequest({ method: 'POST', path: '/invoices', body: {
    customerId: 'c-42', lines: [{ sku: 'A1', quantity: 2,
      unitPrice: { amount: 1500, currency: 'USD' } }], idempotencyKey: like('k-123456'),
  }})
  .willRespondWith({ status: 201, body: {
    id: uuid(), status: 'issued', total: { amount: 3000, currency: 'USD' },
  }})
  .executeTest(async (mock) => {
    const res = await createInvoice(mock.url, input);
    expect(res.total.amount).toBe(3000);
  });`}</CodeBlock>
                <CodeBlock title="Antes de desplegar el núcleo">{`pact-broker can-i-deploy --pacticipant core-billing \\
  --version $GIT_SHA --to-environment production`}</CodeBlock>
                <P>
                    <Code>can-i-deploy</Code> responde a la pregunta que importa: ¿este build del núcleo satisface a todos los consumidores que
                    están ahora en producción? Además te da algo que un esquema nunca te dará: una lista de quién usa cada campo.
                </P>
                <Callout title="Los consumidores desconocidos son el riesgo real">
                    Los tests de contrato solo protegen a los consumidores que publican contratos. Para las integraciones externas, usa las
                    analíticas del edge: registra la clave de API y la versión del contrato de cada petición en el{' '}
                    <A href="/blog/serverless/serverless-edge-architecture/">edge</A>, para saber quién sigue llamando a una versión antigua
                    antes de eliminarla.
                </Callout>

                <H2>Versionar el contrato</H2>
                <UL items={[
                    <><strong className="text-gray-900">Los consumidores dentro del proceso</strong> reciben las versiones a través del paquete de contrato (<Code>@contracts/billing@2.x</Code>), gestionado con changesets.</>,
                    <><strong className="text-gray-900">Los consumidores HTTP</strong> llevan la versión mayor en la ruta (<Code>/v2/invoices</Code>). Los cambios menores se publican sin ruta nueva.</>,
                    <><strong className="text-gray-900">Los eventos</strong> llevan la versión en el topic (<Code>billing.invoice_issued.v2</Code>). Durante una migración, el outbox publica ambas versiones.</>,
                ]} />
                <P>
                    Mantén vivas como mucho dos versiones mayores. Dentro del núcleo, <Code>v1</Code> debería ser un adaptador ligero que
                    traduce a <Code>v2</Code>, no una segunda copia de la lógica de negocio.
                </P>

                <H2>Retirar una versión</H2>
                <P>
                    Anuncia las retiradas en la propia respuesta, para que las vean todos los clientes y no solo quien lee el changelog. Las
                    cabeceras HTTP <Code>Deprecation</Code> y <Code>Sunset</Code> están estandarizadas para esto (RFC 9745 y RFC 8594):
                </P>
                <CodeBlock title="Respuesta de /v1/invoices">{`HTTP/1.1 201 Created
Deprecation: @1798761600
Sunset: Wed, 30 Jun 2027 23:59:59 GMT
Link: <https://lameyer.net/docs/billing/v2-migration>; rel="deprecation"`}</CodeBlock>
                <P>
                    Después observa cómo bajan las cifras de uso. Elimina <Code>v1</Code> cuando el tráfico llegue a cero, o cuando pase la
                    fecha de sunset y se haya contactado con los consumidores restantes; nunca antes.
                </P>

                <H2>Medirlo</H2>
                <UL items={[
                    <><strong className="text-gray-900">Cambios incompatibles detectados en CI frente a encontrados en producción</strong>: la proporción debería subir hasta que producción no encuentre ninguno.</>,
                    <><strong className="text-gray-900">Frecuencia de despliegue del núcleo</strong>: debería aumentar cuando los equipos dejen de temer los despliegues.</>,
                    <><strong className="text-gray-900">Tráfico en versiones deprecadas</strong>: debería tender a cero antes de cada fecha de sunset.</>,
                ]} />

                <Callout title="El recorrido completo">
                    Los módulos dan forma al núcleo, los contratos le dan puertas, los paquetes comparten lo que debe seguir siendo idéntico,
                    los datos privados mantienen separados los módulos y los tests de contrato permiten que todo cambie con seguridad. Vuelve
                    a la visión general: <A href="/blog/core/modular-core-architecture/">Arquitectura Modular Core</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
