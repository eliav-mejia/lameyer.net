<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura Modular Core - Blog de Lameyer</title>
    <meta name="description" content="Modular Core: dividir la lógica de negocio en módulos de dominio con datos propios y contratos tipados, para que las funciones serverless en el edge y los flujos puedan llamarla con seguridad.">
    <link rel="canonical" href="https://lameyer.net/blog/core/modular-core-architecture/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Enumera tus dominios antes de dibujar ningún módulo',
            'Da a cada tabla exactamente un módulo propietario',
            'Expón cada módulo solo a través de un contrato público',
            'Prohíbe los imports profundos con una regla de lint',
            'Versiona los contratos y pruébalos en CI',
            'Extrae un módulo a un servicio solo cuando sea imprescindible',
        ];

        const CASES = [
            { case: 'Un cambio en facturación rompe el login', fix: 'Módulos de dominio con límites que se hacen cumplir', step: <A href="/blog/core/domain-modules-boundaries/">Módulos</A> },
            { case: 'Las funciones edge y los flujos llaman directamente a funciones internas', fix: 'Un contrato tipado (OpenAPI o una interfaz de TypeScript) por módulo', step: <A href="/blog/core/contracts-typed-apis/">Contratos</A> },
            { case: 'El mismo código de validación está copiado en cinco repositorios', fix: 'Paquetes compartidos en un único workspace', step: <A href="/blog/core/shared-packages-workspaces/">Paquetes</A> },
            { case: 'Tres módulos escriben en la misma tabla', fix: 'Un dueño por tabla; los demás leen a través del contrato', step: <A href="/blog/core/data-ownership-migrations/">Datos</A> },
            { case: 'Un despliegue rompe a un consumidor que nadie conocía', fix: 'Tests de contrato y versionado semántico', step: <A href="/blog/core/contract-testing-versioning/">Versionado</A> },
        ];

        const Content = () => (
            <>
                <P>
                    MC-SE significa <strong className="text-gray-900">Modular Core + Serverless Edge</strong>. El edge es donde llegan las
                    peticiones y donde se ejecutan las automatizaciones. El núcleo es donde viven las reglas de negocio: precios,
                    facturación, usuarios, inventario. El edge solo puede seguir siendo ligero y rápido si el núcleo le ofrece puntos de
                    entrada limpios y estables. Esta serie trata de construir ese núcleo.
                </P>

                <H2>Casos de uso para desarrolladores</H2>
                <Table
                    columns={[{ key: 'case', label: 'Síntoma' }, { key: 'fix', label: 'Solución' }, { key: 'step', label: 'Paso', accent: true }]}
                    rows={CASES}
                />

                <H2>Módulos, no microservicios</H2>
                <P>
                    Un núcleo modular suele ser un <em>monolito modular</em>: un único desplegable, muchos módulos. Cada módulo corresponde
                    a un dominio de negocio (<Code>billing</Code>, <Code>catalog</Code>, <Code>accounts</Code>), es dueño de sus datos y
                    expone una pequeña API pública. Obtienes casi todo el aislamiento de los microservicios sin las llamadas de red, las
                    transacciones distribuidas ni la carga de despliegue. Cuando un módulo necesita de verdad escalar o desplegarse por su
                    cuenta, su contrato ya existe, así que extraerlo es una mudanza, no una reescritura.
                </P>
                <CodeBlock title="Estructura">{`core/
  billing/
    index.ts        # contrato público: el único archivo que importan los demás módulos
    internal/       # implementación, nunca se importa desde fuera
    migrations/     # billing es dueño de sus tablas
  catalog/
    index.ts
    internal/
  accounts/
    index.ts
    internal/`}</CodeBlock>

                <H2>Los contratos son la costura con el edge</H2>
                <P>
                    Cada módulo publica un contrato: una interfaz de TypeScript para quienes lo llaman dentro del proceso y, cuando el edge
                    o un flujo lo llama por HTTP, un documento OpenAPI. Las funciones edge generan su cliente a partir de ese documento, así
                    que un campo renombrado hace fallar el build en lugar de fallar en producción.
                </P>
                <CodeBlock title="core/billing/index.ts">{`export interface Billing {
  createInvoice(input: { customerId: string; lines: Line[] }): Promise<Invoice>;
  getInvoice(id: string): Promise<Invoice | null>;
}`}</CodeBlock>

                <H2>Haz cumplir los límites</H2>
                <UL items={[
                    <><strong className="text-gray-900">Imports.</strong> Una regla de lint (por ejemplo <Code>no-restricted-imports</Code> o dependency-cruiser) bloquea <Code>billing/internal/*</Code> desde fuera de <Code>billing/</Code>.</>,
                    <><strong className="text-gray-900">Datos.</strong> Cada tabla tiene un módulo propietario. Los demás leen a través de su contrato o se suscriben a sus eventos, nunca con un join SQL entre módulos.</>,
                    <><strong className="text-gray-900">Paquetes.</strong> El código compartido (esquemas de validación, tipos de dinero, logging) vive en paquetes del workspace con su propia versión, no en una carpeta <Code>utils/</Code> que todo importa.</>,
                    <><strong className="text-gray-900">Versionado.</strong> Los tests de contrato se ejecutan en CI, y los cambios incompatibles suben la versión mayor para que los consumidores del edge migren a su ritmo.</>,
                ]} />

                <Callout title="Cómo encaja con el resto de MC-SE">
                    La serie <A href="/blog/serverless/serverless-edge-architecture/">Serverless Edge</A> trata las funciones que se sitúan
                    delante de estos contratos, y <A href="/blog/workflows/serverless-workflow-automation/">Automatización de flujos</A> trata
                    las colas y webhooks que los llaman en segundo plano. Ambas están protegidas por las capas de{' '}
                    <A href="/blog/?series=security">Seguridad de APIs</A>.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
