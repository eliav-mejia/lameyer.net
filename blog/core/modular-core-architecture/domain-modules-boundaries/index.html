<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Modules & Boundaries - Lameyer Blog</title>
    <meta name="description" content="Drawing module boundaries from business capabilities, giving each module one public entry point, and enforcing boundaries with lint rules in a modular monolith.">
    <link rel="canonical" href="https://lameyer.net/blog/core/domain-modules-boundaries/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Split by business capability, not by technical layer',
            'Name each module after a noun the business uses',
            'Give every module one public index.ts',
            'Block imports of another module\'s internal/ folder',
            'Assign an owner to each module in CODEOWNERS',
            'Track dependency direction and forbid cycles',
        ];

        const SIGNALS = [
            { signal: 'Words change meaning', example: '"Account" means a login in auth and a customer in billing', verdict: 'Two modules' },
            { signal: 'Different rate of change', example: 'Pricing rules change weekly, tax rules yearly', verdict: 'Two modules' },
            { signal: 'Different people decide', example: 'Finance owns invoices, operations owns shipments', verdict: 'Two modules' },
            { signal: 'Always change together', example: 'Order and order lines are edited in the same transaction', verdict: 'One module' },
        ];

        const Content = () => (
            <>
                <P>
                    Most monoliths are not tangled because people were careless. They are tangled because the folders follow technical layers
                    (<Code>controllers/</Code>, <Code>services/</Code>, <Code>models/</Code>) and every feature cuts across all of them.
                    A change to invoicing touches five folders, and nothing stops <Code>InvoiceService</Code> from calling straight into{' '}
                    <Code>UserRepository</Code>. A <strong className="text-gray-900">domain module</strong> turns that around: one folder per business
                    capability, containing its own logic, data access and tests, with a single door to the outside.
                </P>

                <H2>Find boundaries in the business, not the code</H2>
                <P>
                    Start with a list of capabilities written in the language the business uses: <em>quote a price, take an order, issue an
                    invoice, ship a package</em>. A short event-storming session works well here: write every event that happens
                    ("Order placed", "Invoice issued", "Payment failed") on a sticky note, then group them. Each group is a candidate
                    module. Then test each candidate against these signals:
                </P>
                <Table
                    columns={[{ key: 'signal', label: 'Signal' }, { key: 'example', label: 'Example' }, { key: 'verdict', label: 'Verdict', accent: true }]}
                    rows={SIGNALS}
                />
                <Callout title="Start with fewer, larger modules">
                    Merging two modules that turned out to be one is painful; splitting a large, well-bounded module later is easy. Four to
                    eight modules is a healthy start for most business applications.
                </Callout>

                <H2>Anatomy of a module</H2>
                <P>
                    Each module has the same shape, so anyone on the team knows where to look. Only <Code>index.ts</Code> is public.
                    Everything else is an implementation detail the module is free to change.
                </P>
                <CodeBlock title="core/billing/">{`billing/
├── index.ts            # public API: types + functions other modules may use
├── contract.ts         # schemas for inputs, outputs, errors (see Contracts)
├── internal/
│   ├── invoice.ts      # business rules
│   ├── tax.ts
│   └── repository.ts   # only billing touches billing tables
├── events.ts           # events billing publishes: InvoiceIssued, ...
├── migrations/         # billing's own schema (see Data)
└── tests/`}</CodeBlock>
                <CodeBlock title="core/billing/index.ts">{`export type { Invoice, InvoiceLine } from './contract';
export { createInvoice, getInvoice, voidInvoice } from './internal/invoice';
export { InvoiceIssued } from './events';
// Nothing from ./internal/repository or ./internal/tax is exported.`}</CodeBlock>

                <H2>Enforce boundaries with tooling</H2>
                <P>
                    A boundary that relies on discipline lasts until the first deadline. Make the build fail instead. With{' '}
                    <Code>dependency-cruiser</Code>, two rules cover most of it: no reaching into another module's internals, and no cycles.
                </P>
                <CodeBlock title=".dependency-cruiser.cjs">{`module.exports = {
  forbidden: [
    {
      name: 'no-deep-imports',
      comment: 'Import other modules only through their index.ts',
      severity: 'error',
      from: { path: '^core/([^/]+)/' },
      to:   { path: '^core/([^/]+)/internal/', pathNot: '^core/$1/' },
    },
    {
      name: 'no-cycles',
      severity: 'error',
      from: {},
      to: { circular: true },
    },
  ],
};`}</CodeBlock>
                <P>
                    Run it in CI next to the tests. If you prefer ESLint, <Code>no-restricted-imports</Code> with a pattern like{' '}
                    <Code>{'@core/*/internal/*'}</Code> does the same for single files. In other languages the idea is identical: Java has
                    JPMS modules and ArchUnit, .NET has <Code>internal</Code> visibility and NetArchTest, Python has <Code>import-linter</Code>.
                </P>

                <H2>Direction matters as much as boundaries</H2>
                <P>
                    Allowing imports only through <Code>index.ts</Code> is not enough if every module imports every other one. Draw the
                    dependency graph and keep it pointing one way: <Code>orders</Code> may call <Code>catalog</Code> and{' '}
                    <Code>billing</Code>, but <Code>billing</Code> should not call back into <Code>orders</Code>. When a lower module needs
                    to react to something a higher one does, it subscribes to an event instead of importing it.
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Calls go down.</strong> Higher-level workflows (orders) call lower-level capabilities (billing, catalog).</>,
                    <><strong className="text-gray-900">Events go up.</strong> Billing publishes <Code>InvoiceIssued</Code>; orders listens and updates its status.</>,
                    <><strong className="text-gray-900">Shared kernel stays tiny.</strong> Only truly universal types (money, IDs, dates) live in a shared package. See <A href="/blog/core/shared-packages-workspaces/">Shared Packages & Workspaces</A>.</>,
                ]} />

                <H2>Ownership</H2>
                <P>
                    A module without an owner becomes a shared dumping ground again. Put each module in <Code>CODEOWNERS</Code> so changes
                    to its public API need its owner's review, while internal changes move fast:
                </P>
                <CodeBlock title=".github/CODEOWNERS">{`/core/billing/            @acme/finance-dev
/core/billing/index.ts    @acme/finance-dev @acme/architects
/core/catalog/            @acme/catalog-dev`}</CodeBlock>

                <H2>Measuring progress</H2>
                <P>
                    Modularizing an existing codebase takes months, so track it. Useful numbers: boundary violations reported by the
                    dependency checker (should only go down), files changed per typical feature, and how often one team's deploy is blocked by
                    another team's failing tests. When those trend down, the boundaries are working.
                </P>

                <Callout title="Next step">
                    A module's <Code>index.ts</Code> is its door. The next article, <A href="/blog/core/contracts-typed-apis/">Contracts &
                    Typed APIs</A>, makes that door precise enough for edge functions and workflows on the other side of a network.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
