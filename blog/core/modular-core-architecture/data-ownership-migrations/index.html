<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Ownership & Migrations - Lameyer Blog</title>
    <meta name="description" content="One owning module per table, replacing cross-module joins with contract calls, read models and outbox events, and expand-and-contract migrations without downtime.">
    <link rel="canonical" href="https://lameyer.net/blog/core/data-ownership-migrations/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/blog.jsx"></script>
    <script type="text/babel">
        const CONTROLS = [
            'Give each module its own database schema',
            'Grant each module\'s DB role access to its schema only',
            'Replace cross-module joins with calls or read models',
            'Publish events through an outbox table',
            'Change schemas with expand, migrate, contract',
            'Keep migrations inside the owning module',
        ];

        const OPTIONS = [
            { need: 'One record from another module, now', use: 'Call its contract', cost: 'Simple. One extra call per request.' },
            { need: 'Lists that combine data from two modules', use: 'Local read model fed by events', cost: 'Fast reads, eventually consistent.' },
            { need: 'React when something happens elsewhere', use: 'Subscribe to its events', cost: 'Decoupled, needs idempotent handlers.' },
            { need: 'Reports across the whole business', use: 'Analytics copy (warehouse)', cost: 'Never used by live features.' },
        ];

        const Content = () => (
            <>
                <P>
                    You can draw perfect module boundaries in the code and still have a monolith, because every module reads and writes the
                    same tables. A join from <Code>orders</Code> into <Code>billing.invoices</Code> is a dependency the linter never sees, and
                    the day billing renames a column, orders breaks. The rule that fixes this is simple to state:{' '}
                    <strong className="text-gray-900">every table has exactly one owning module, and only that module writes to it or reads it directly.</strong>
                </P>

                <H2>Make ownership physical</H2>
                <P>
                    You don't need separate database servers. In Postgres, give each module its own schema and its own role. The database
                    then enforces what code review used to.
                </P>
                <CodeBlock title="migrations/000_modules.sql">{`CREATE SCHEMA billing;
CREATE SCHEMA catalog;
CREATE SCHEMA orders;

CREATE ROLE billing_svc LOGIN;
GRANT USAGE, CREATE ON SCHEMA billing TO billing_svc;
ALTER DEFAULT PRIVILEGES IN SCHEMA billing
  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO billing_svc;

-- orders_svc gets no grant on billing: a cross-module query now fails loudly.`}</CodeBlock>
                <P>
                    The core still runs as one deployable. Each module simply opens its connection pool with its own role. If you later
                    extract a module into its own service, its schema can move to its own database without untangling anything.
                </P>

                <H2>How other modules get the data</H2>
                <Table
                    columns={[{ key: 'need', label: 'Need' }, { key: 'use', label: 'Use', accent: true }, { key: 'cost', label: 'Trade-off' }]}
                    rows={OPTIONS}
                />
                <P>
                    Most needs are covered by the first row. Read models are worth it when a screen lists hundreds of rows that each need
                    data from another module, such as an order list showing invoice status.
                </P>

                <H2>Events without lost messages: the outbox</H2>
                <P>
                    Publishing an event right after a database commit has a gap: if the process crashes between the two, the invoice exists
                    but nobody hears about it. The <strong className="text-gray-900">outbox pattern</strong> closes it by writing the event in the
                    same transaction as the data. A relay then sends it to the queue.
                </P>
                <CodeBlock title="core/billing/internal/invoice.ts">{`await db.transaction(async (tx) => {
  const invoice = await tx.insert(invoices).values(data).returning();
  await tx.insert(outbox).values({
    topic: 'billing.invoice_issued.v1',
    key: invoice.id,
    payload: { invoiceId: invoice.id, customerId: data.customerId, total: invoice.total },
  });
});
// A relay (cron or LISTEN/NOTIFY) reads unsent rows, publishes them
// to the queue, and marks them sent. Delivery is at-least-once.`}</CodeBlock>
                <P>
                    Because delivery is at-least-once, consumers must be idempotent. The <A href="/blog/workflows/serverless-workflow-automation/">Workflow
                    Automation</A> series covers the queue side, including deduplication by event key.
                </P>

                <H2>Migrations: expand, migrate, contract</H2>
                <P>
                    In MC-SE, edge functions and workflows are deployed separately from the core, so for a while old and new code run at the
                    same time. A migration that renames a column in one step breaks whichever version isn't expecting it. Split every
                    breaking schema change into three releases:
                </P>
                <UL items={[
                    <><strong className="text-gray-900">Expand.</strong> Add the new column or table next to the old one. Nothing reads it yet.</>,
                    <><strong className="text-gray-900">Migrate.</strong> Deploy code that writes both, backfill old rows in batches, then switch reads to the new column.</>,
                    <><strong className="text-gray-900">Contract.</strong> Once no deployed code uses the old column, drop it.</>,
                ]} />
                <CodeBlock title="billing/migrations: renaming amount -> total_cents">{`-- 041_expand.sql
ALTER TABLE billing.invoices ADD COLUMN total_cents bigint;

-- 042_backfill.sql (run in batches to avoid long locks)
UPDATE billing.invoices SET total_cents = amount
WHERE total_cents IS NULL AND id IN (
  SELECT id FROM billing.invoices WHERE total_cents IS NULL LIMIT 5000
);

-- 043_contract.sql (a later release, after reads have switched)
ALTER TABLE billing.invoices ALTER COLUMN total_cents SET NOT NULL;
ALTER TABLE billing.invoices DROP COLUMN amount;`}</CodeBlock>
                <Callout title="Migrations belong to the module">
                    Keep each module's migrations in its own folder (<Code>core/billing/migrations/</Code>) and run them with that module's
                    role. A migration that touches two schemas is a sign that a boundary is in the wrong place.
                </Callout>

                <H2>Measuring progress</H2>
                <UL items={[
                    <><strong className="text-gray-900">Cross-schema queries</strong> found by the database logs: target zero.</>,
                    <><strong className="text-gray-900">Downtime per migration</strong>: target zero, with expand-and-contract.</>,
                    <><strong className="text-gray-900">Outbox lag</strong>: how long events wait before publishing, alerted when it grows.</>,
                ]} />

                <Callout title="Next step">
                    The database is now private and the contract is public, so the contract is the thing that must not break.{' '}
                    <A href="/blog/core/contract-testing-versioning/">Contract Testing & Versioning</A> makes sure it doesn't.
                </Callout>
            </>
        );

        renderPost(CONTROLS, Content);
    </script>
</body>
</html>
