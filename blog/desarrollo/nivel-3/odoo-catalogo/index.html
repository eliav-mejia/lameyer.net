            <h1>Catálogo en Odoo: un SKU, un precio, un identificador</h1>
            <p>Por qué un catálogo serializado, con un registro por variante vendible, es la base de inventario, tienda, pagos y reportes.</p>
            <h2>Qué es</h2>
            <p>Cómo pensar un catálogo para que cada variante vendible tenga un SKU, un precio y un identificador únicos, y cómo una misma estructura sirve para un catálogo global y para cada sitio.</p>
            <h2>Por qué importa</h2>
            <p>Un catálogo mal definido se nota en todas partes: precios distintos entre tienda y caja, duplicados al importar y reportes que no cuadran. Bien hecho, todo lo demás se alimenta de él.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Diseñar una gramática de SKU coherente.</li>
                <li>Decidir dónde vive cada precio y quién lo cambia.</li>
                <li>Entender un catálogo global frente a uno por sitio.</li>
                <li>Actualizar sin duplicar registros.</li>
            </ul>
            <h2>Dónde encaja en la ruta</h2>
            <p>Primer módulo práctico del Nivel 3; Inventario, Punto de venta y Códigos de barras dependen de él.</p>
            <p><strong>La regla:</strong> Un precio se escribe una vez; una variante tiene un único identificador en todos los sistemas.</p>
