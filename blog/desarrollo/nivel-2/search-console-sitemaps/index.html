            <h1>Google Search Console y sitemaps: decirle a Google qué páginas importan</h1>
            <p>Un sitemap no es una lista de todo: es la lista de lo que quieres en Google. Verificación, indexación y cómo influir en los enlaces de sitio.</p>
            <h2>Qué es</h2>
            <p>Cómo verificar un dominio en Search Console, escribir un sitemap limpio y pedir a Google que indexe las páginas correctas para que aparezcan con los títulos y enlaces de sitio adecuados.</p>
            <h2>Por qué importa</h2>
            <p>Una página que Google no conoce no existe para quien busca. Un sitemap descuidado, con redirecciones o páginas privadas, confunde al buscador y retrasa lo que sí importa.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Entender qué debe y qué no debe ir en un sitemap.</li>
                <li>Verificar la propiedad de un dominio.</li>
                <li>Leer los informes de cobertura e indexación.</li>
                <li>Saber qué influye en los enlaces de sitio.</li>
            </ul>
            <h2>Dónde encaja en la ruta</h2>
            <p>Primer paso del Nivel 2; los módulos de títulos y Markdown SEO trabajan el contenido que aquí se indexa.</p>
