            <h1>Títulos e indexación: la primera línea que lee el buscador</h1>
            <p>El título de una página decide si se hace clic en ella. Qué hace a un buen título, cómo se relaciona con la indexación y los errores que lo sabotean.</p>
            <h2>Qué es</h2>
            <p>El papel del título y la descripción de cada página en los resultados de búsqueda, y cómo se coordinan con las señales de indexación del sitio.</p>
            <h2>Por qué importa</h2>
            <p>Un buen título es el anuncio gratuito de cada página. Títulos duplicados, genéricos o reescritos por el buscador hacen perder clics aunque la página esté bien posicionada.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Escribir títulos únicos y descriptivos.</li>
                <li>Entender cuándo el buscador reescribe un título y por qué.</li>
                <li>Evitar duplicados entre páginas parecidas.</li>
                <li>Relacionar título, contenido y URL canónica.</li>
            </ul>
            <h2>Dónde encaja en la ruta</h2>
            <p>Se apoya en Search Console y alimenta el trabajo de contenido de Markdown SEO.</p>
            <p><strong>La regla:</strong> Una página, un tema, un título que lo diga.</p>
