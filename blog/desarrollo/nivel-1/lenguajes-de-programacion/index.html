            <p>Un recorrido por los cinco lenguajes que aparecen en cualquier proyecto de Lameyer y por la frontera entre ellos: qué describe la estructura, qué da estilo, qué añade comportamiento, qué automatiza y qué configura.</p>
            <h2>Por qué importa</h2>
            <p>Muchos fallos de quien empieza vienen de pedirle a un lenguaje un trabajo que no es suyo. Un mapa claro de responsabilidades hace que el código sea más fácil de leer, de depurar y de entregar.</p>
