            <h1>Cloudflare Pages: un mismo repositorio, dos despliegues y un dominio canónico</h1>
            <p>Por qué publicar una copia del sitio en Cloudflare, qué cambia respecto a GitHub Pages y cómo evitar que el clon compita con el original en Google.</p>
            <h2>Qué es</h2>
            <p>Cómo un sitio que vive en un repositorio puede desplegarse también en Cloudflare Pages, las diferencias entre ambas plataformas y los límites del plan gratuito.</p>
            <h2>Por qué importa</h2>
            <p>Un segundo despliegue aporta velocidad, previsualizaciones y resiliencia, pero mal planteado crea contenido duplicado y un segundo lugar donde «se editan» archivos.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Entender cuándo conviene un segundo despliegue.</li>
                <li>Saber qué se comporta distinto entre plataformas.</li>
                <li>Mantener un único dominio canónico ante buscadores.</li>
                <li>Reconocer los límites del plan gratuito antes de chocar con ellos.</li>
            </ul>
            <h2>Dónde encaja en la ruta</h2>
            <p>Usa el dominio de Registros DNS y prepara el terreno de la seguridad en el edge.</p>
            <p><strong>La regla:</strong> El código solo se edita en el repositorio; la plataforma de despliegue nunca es un segundo lugar de trabajo.</p>
