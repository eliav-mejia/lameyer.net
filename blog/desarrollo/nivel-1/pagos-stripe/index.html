            <h1>Cobrar con Stripe: enlaces de pago y las cuatro formas de integrar un cobro</h1>
            <p>Del enlace de pago creado a mano a la integración completa por API: cuándo basta un enlace, cuándo hace falta algo más y dónde debe vivir cada precio.</p>
            <h2>Qué es</h2>
            <p>El primer cobro de un negocio en línea: productos, precios y enlaces de pago, la página de agradecimiento, y una comparación de las cuatro formas de integrar Stripe según el tamaño del catálogo.</p>
            <h2>Por qué importa</h2>
            <p>Cobrar es el momento en que un sitio se convierte en negocio. Elegir el método adecuado evita sobrediseñar una tienda pequeña o quedarse corto en una grande, y un precio escrito en dos sitios termina, tarde o temprano, siendo dos precios distintos.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Elegir entre enlace de pago, Checkout, Elements o API completa.</li>
                <li>Conectar el cobro con el sitio y su página de agradecimiento.</li>
                <li>Distinguir el modo de prueba del modo real.</li>
                <li>Mantener un único origen para cada precio.</li>
            </ul>
            <h2>Dónde encaja en la ruta</h2>
            <p>Cierra el Nivel 1 y conecta con el seguimiento de ventas del Nivel 2 y el catálogo de Odoo del Nivel 3.</p>
            <p><strong>La regla:</strong> Un precio se escribe una sola vez, en un solo lugar.</p>
