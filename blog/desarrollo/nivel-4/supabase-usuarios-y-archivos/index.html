            <h1>Supabase: usuarios, inicio de sesión social y archivos privados</h1>
            <p>Iniciar sesión demuestra quién eres; las reglas de acceso deciden qué puedes tocar. Una base de usuarios bien diseñada, con archivos que el navegador nunca expone.</p>
            <h2>Qué es</h2>
            <p>Cómo diseñar la base de usuarios de una plataforma: inicio de sesión con Google o Microsoft, seguridad a nivel de fila en la base de datos y archivos privados guardados en un almacenamiento externo.</p>
            <h2>Por qué importa</h2>
            <p>Los datos de los usuarios son responsabilidad del negocio. Un error en las reglas de acceso puede exponer información de unos clientes a otros, y eso no se arregla con una disculpa.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Distinguir autenticación de autorización.</li>
                <li>Entender las reglas de acceso por fila.</li>
                <li>Separar el puntero del archivo de los propios bytes.</li>
                <li>Clasificar los datos por nivel de sensibilidad.</li>
            </ul>
            <h2>Dónde encaja en la ruta</h2>
            <p>Prepara el inicio de sesión y las cuentas de las plataformas, y se apoya en Scripts de shell.</p>
            <p><strong>La regla:</strong> El inicio de sesión prueba quién es alguien; las reglas de acceso deciden qué puede tocar.</p>
