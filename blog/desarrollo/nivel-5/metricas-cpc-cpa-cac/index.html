            <h1>Métricas publicitarias: CPC, CPA y CAC sin confundirlas</h1>
            <p>Cuánto cuesta un clic, una venta y un cliente no es lo mismo. Cómo leer las tres métricas juntas para decidir dónde invertir el siguiente peso.</p>
            <h2>Qué es</h2>
            <p>Las métricas que traducen la publicidad a dinero: costo por clic, costo por adquisición, costo de adquisición de cliente y retorno sobre la inversión publicitaria, y cómo se relacionan.</p>
            <h2>Por qué importa</h2>
            <p>Un clic barato que no vende es caro. Sin métricas comparables entre plataformas, las decisiones de presupuesto se toman por intuición.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Distinguir costo por clic, por venta y por cliente.</li>
                <li>Calcular el CAC combinado de todos los canales.</li>
                <li>Relacionar CAC con el margen del producto.</li>
                <li>Comparar plataformas con el mismo criterio.</li>
            </ul>
            <h2>Dónde encaja en la ruta</h2>
            <p>Cierra el Nivel 5 y reúne lo medido en todos los canales.</p>
            <p><strong>La regla:</strong> La métrica que manda es la que termina en la caja.</p>
