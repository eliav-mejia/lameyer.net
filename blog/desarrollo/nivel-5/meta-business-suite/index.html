            <h2>Qué es</h2>
            <p>Una introducción a Meta Business Suite como espacio de trabajo del negocio: páginas, cuentas, bandeja de mensajes, contenido programado y estadísticas.</p>

            <p>Cuando las cuentas dependen de un perfil personal, el negocio no es dueño de su propia presencia. Ordenar activos y permisos protege al cliente.</p>
            <h2>Qué sabrás hacer al terminar</h2>
            <ul>
                <li>Entender la relación entre páginas, cuentas y negocio.</li>

                <li>Asignar permisos sin compartir contraseñas.</li>

            <p>Primer paso del Nivel 5, antes de Facebook Ads y portafolio comercial.</p>
